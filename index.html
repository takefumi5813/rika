    if (busy) return;
    var it = queue[pos], q = it.q, gained = 0, rankUp = false, L2 = 0;
    last = {pos:pos, first:first, right:right, nw:wrongs.length, combo:combo, gt:gainedTotal, xp:P.xp, sid:q.id, s:S[q.id] ? {l:S[q.id].l, d:S[q.id].d} : null,
            ehp:E ? E.hp : 0, edead:E ? E.dead : false, scis:JSON.stringify(P.scis || {}), jc:sciClearedNow};
    if (!it.retry){
      first++;
      var L = (S[q.id] && S[q.id].l) || 0;
      L2 = ok ? Math.min(L + 1, MAXL) : Math.max(L - 1, 0);
      S[q.id] = {l: L2, d: Date.now() + WAIT[L2]};
      saveS();
      if (ok){ right++; rankUp = L2 > L; } else wrongs.push(q);
    }
    if (ok){
      combo++;
      var crit = Math.random() < 0.1;
      gained = 10 + Math.min(combo - 1, 10) * 2; if (crit) gained *= 2;
      if (q.f === '偉人') gained += 5;
      var before = lvOf(P.xp).lv; P.xp = Math.min(P.xp + gained, 9e8); gainedTotal += gained; saveP();
      var killed = hitEnemy(gained + Math.floor(Math.random() * 6));
      if (killed){ P.xp += 30; gainedTotal += 30; saveP(); }
      celebrate(combo, gained + (killed ? 30 : 0), rankUp && !it.retry, L2);
      attackFx(sciOf(), gained, crit);
      if (killed){ var k = document.createElement('div'); k.className = 'act'; k.style.top = '60%'; k.textContent = E.n + 'をたおした! +30pt'; fx.appendChild(k); }
      if (lvOf(P.xp).lv > before) setTimeout(function(){ tone([523, 659, 784, 1047], 0.1); }, 350);
      var cj = checkSciClear();
      if (cj){ sciClearedNow = cj; setTimeout(function(){ var m = document.createElement('div'); m.className = 'act'; m.style.top = '70%'; m.style.background = '#f2b01e'; m.style.color = '#2a1700'; m.textContent = cj.n + 'との研究が完成!'; fx.appendChild(m); tone([784, 988, 1175, 1568], 0.1); }, 300); }
    } else {
      combo = 0; encourage();
      var o = document.createElement('div'); o.className = 'ouch'; o.textContent = E ? E.n + 'のこうげき!' : ''; fx.appendChild(o);
    }
    pos++;
    busy = true;
    setTimeout(function(){
      busy = false; clearFx();
      if (pos >= queue.length) finish(); else render();
    }, 1500);
  }

  function finish(){
    $('prog').style.width = '100%';
    $('sc').textContent = right; $('tot').textContent = init;
    var r = right / init, m;
    if (r === 1) m = 'パーフェクト!すごい!';
    else if (r >= 0.8) m = 'よくできました。あと少し!';
    else if (r >= 0.5) m = 'まちがえた問題は、またすぐ出てくるよ。';
    else m = 'まちがえた問題がチャンス。次はがんばろう!';
    $('rmsg').textContent = m;
    var l = lvOf(P.xp);
    $('rpt').textContent = '今回 +' + gainedTotal + 'pt ・ レベル ' + l.lv + '(つぎまで' + l.rest + 'pt)';
    var ul = $('wrongs'); ul.innerHTML = '';
    wrongs.forEach(function(q){
      var li = document.createElement('li'), s = document.createElement('span'), b = document.createElement('b');
      s.textContent = q.q; b.textContent = q.a; li.appendChild(s); li.appendChild(b); ul.appendChild(li);
    });
    $('wrongwrap').classList.toggle('hide', wrongs.length === 0);
    var more = dueFor(mode).length;
    $('again').disabled = more === 0;
    $('again').textContent = more ? 'つづける' : 'ぜんぶおわり';
    if (r === 1) celebrate(5, 0, false, 0), setTimeout(clearFx, 900);
    $('undo2').classList.toggle('hide', !last);
    var jc = $('jobclear');
    if (sciDone() && sciCleared(sciOf().id)){ $('jobclearmsg').textContent = sciOf().n + 'との研究が完成した!次の仲間をえらぼう。'; jc.classList.remove('hide'); }
    else jc.classList.add('hide');
    show('result');
  }

  // ===== 仲間の画面 =====
  function openScis(){
    checkSciClear();
    var box = $('scitiers'); box.innerHTML = '';
    var cur = sciOf(), n = Object.keys(P.scis || {}).length;
    $('scislead').textContent = 'いまの仲間: ' + cur.i + ' ' + cur.n + '(研究レベル ' + sciLv() + '/10)・研究が完成した仲間 ' + n + ' / ' + SCI.length +
      (sciDone() || sciCleared(cur.id) ? '。次の仲間をえらべます。' : '。研究レベルが10になると次の仲間をえらべます。') + ' カードを押すと、その科学者のことがわかります。';
    for (var t = 0; t <= 7; t++){
      var js = SCI.filter(function(j){ return j.t === t; }); if (!js.length) continue;
      var sec = document.createElement('div'); sec.className = 'tier';
      var h = document.createElement('h3'); h.textContent = TIERNAME[t]; sec.appendChild(h);
      var grid = document.createElement('div'); grid.className = 'jgrid';
      js.forEach(function(j){
        var st = sciState(j), b = document.createElement('button'); b.type = 'button';
        var vis = st !== 'locked' || j.req.every(function(r){ return sciCleared(r) || P.sci === r; });   // 次に仲間にできる人は名前が見える
        b.className = 'job ' + (st === 'locked' && vis ? 'next' : st);
        var ic = document.createElement('div'); ic.className = 'ji'; ic.textContent = vis ? j.i : '❓';
        var nm = document.createElement('b'); nm.textContent = vis ? j.n : '???';
        var sm = document.createElement('small');
        if (!vis) sm.textContent = '???' + (j.req.length ? '(' + j.req.map(function(r){ return sciCleared(r) ? SCIMAP[r].n : '???'; }).join('・') + 'の研究のあと)' : '');
        else if (st === 'locked') sm.textContent = j.req.map(function(r){ return SCIMAP[r].n; }).join('・') + 'の研究が完成すると仲間にできる';
        else if (st === 'avail') sm.textContent = '仲間にできる!';
        else if (st === 'current') sm.textContent = j.d + '・いまの仲間';
        else sm.textContent = j.d;
        b.appendChild(ic); b.appendChild(nm); b.appendChild(sm);
        if (vis) b.onclick = function(){ openCard(j); };
        grid.appendChild(b);
      });
      sec.appendChild(grid); box.appendChild(sec);
    }
    $('scis').classList.remove('hide'); window.scrollTo(0,0);
  }
  function openCard(j, justJoined){
    var st = sciState(j), cur = sciOf();
    var box = $('scicard'); box.innerHTML = '';
    var card = document.createElement('div'); card.className = 'card';
    var ci = document.createElement('div'); ci.className = 'ci'; ci.textContent = j.i; card.appendChild(ci);
    var h3 = document.createElement('h3'); h3.textContent = (justJoined ? '仲間になった! ' : '') + j.n; card.appendChild(h3);
    var era = document.createElement('p'); era.className = 'era'; era.textContent = j.era; card.appendChild(era);
    var deed = document.createElement('div'); deed.className = 'deed'; deed.textContent = '偉業: ' + j.d; card.appendChild(deed);
    var ul = document.createElement('ul'); j.facts.forEach(function(f){ var li = document.createElement('li'); li.textContent = f; ul.appendChild(li); }); card.appendChild(ul);
    var note = document.createElement('p'); note.className = 'note';
    if (j.quiz.length) note.textContent = '仲間になると、この科学者についての問題(' + j.quiz.length + '問)が一問一答に出てくるよ。技: ' + (ACT[j.fx] ? ACT[j.fx][1] : '');
    card.appendChild(note);
    var row = document.createElement('div'); row.className = 'row';
    var close = document.createElement('button'); close.className = 'btn ghost'; close.type = 'button'; close.textContent = 'とじる';
    close.onclick = function(){ box.classList.add('hide'); };
    row.appendChild(close);
    var canChange = (sciDone() || sciCleared(cur.id)) && P.sci !== j.id && (st === 'avail' || st === 'cleared');
    if (canChange){
      var go = document.createElement('button'); go.className = 'btn'; go.type = 'button'; go.textContent = st === 'cleared' ? 'もういちど仲間にする' : '仲間にする';
      go.onclick = function(){ changeSci(j.id); box.classList.add('hide'); openScis(); hud(); buildHome(); tone([523, 659, 784, 1047], 0.1); openCard(j, true); };
      row.appendChild(go);
    } else if (st === 'avail' || st === 'locked'){
      var ng = document.createElement('button'); ng.className = 'btn'; ng.type = 'button'; ng.disabled = true;
      ng.textContent = st === 'locked' ? j.req.map(function(r){ return SCIMAP[r].n; }).join('・') + 'の研究が完成してから' : 'いまの仲間の研究が完成してから';
      row.appendChild(ng);
    }
    card.appendChild(row);
    box.appendChild(card); box.classList.remove('hide');
    box.onclick = function(e){ if (e.target === box) box.classList.add('hide'); };
  }
  $('scibtn').onclick = openScis;
  $('toscis').onclick = openScis;
  $('scisclose').onclick = function(){ $('scis').classList.add('hide'); buildHome(); };
  $('start').onclick = begin;
  $('again').onclick = begin;
  $('show').onclick = function(){ $('show').classList.add('hide'); $('reveal').classList.remove('hide'); };
  $('good').onclick = function(){ answer(true); };
  $('bad').onclick  = function(){ answer(false); };
  $('undo').onclick = undo;
  $('undo2').onclick = undo;
  $('quit').onclick = function(){ buildHome(); show('home'); };
  $('home2').onclick = function(){ buildHome(); show('home'); };
  $('mute').onclick = function(){ P.mute = !P.mute; saveP(); hud(); };
  // 記録のバックアップ／引っこし
  function b64e(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64d(b){ return decodeURIComponent(escape(atob(b))); }
  $('backup').onclick = function(){ $('bkbox').classList.toggle('hide'); $('bkmsg').textContent = ''; };
  $('bkout').onclick = function(){
    var code = 'RIKA1.' + b64e(JSON.stringify({S:S, P:P, t:Date.now()}));
    $('bktext').value = code; $('bktext').focus(); $('bktext').select();
    try { navigator.clipboard && navigator.clipboard.writeText(code); $('bkmsg').textContent = 'コードを出しました(コピーずみ)。' + Object.keys(S).length + '問分の記録・' + P.xp + 'pt'; } catch(e){ $('bkmsg').textContent = 'コードを出しました。長押しなどでコピーしてください。'; }
  };
  $('bkin').onclick = function(){
    var v = ($('bktext').value || '').trim();
    try {
      if (v.indexOf('RIKA1.') !== 0) throw new Error('形式');
      var o = JSON.parse(b64d(v.slice(6)));
      var n = 0;
      Object.keys(o.S || {}).forEach(function(k){ var a = S[k], b = o.S[k]; if (!a || (b && (b.l > a.l || (b.l === a.l && b.d > a.d)))){ S[k] = b; n++; } });
      if (o.P){ if ((o.P.xp || 0) > (P.xp || 0)){ P.xp = o.P.xp; P.sci = o.P.sci || P.sci; P.sciStart = o.P.sciStart || P.sciStart; } P.scis = Object.assign({}, o.P.scis || {}, P.scis || {}); P.streak = Math.max(P.streak || 0, o.P.streak || 0); }
      saveS(); saveP(); initSci(); buildHome();
      $('bkmsg').textContent = '読み込みました(' + n + '問分を更新)。';
    } catch(e){ $('bkmsg').textContent = 'コードが読めません。「コードを出す」で出た文字を、そのまま全部貼りつけてください。'; }
  };
  var resetStep = 0;
  $('resetall').onclick = function(){
    var box = $('resetbox'); box.innerHTML = ''; resetStep = 1; box.classList.remove('hide');
    var p = document.createElement('p'); p.textContent = '学習の記録(ランク・ポイント・仲間)をぜんぶ消しますか?'; box.appendChild(p);
    var b1 = document.createElement('button'); b1.className = 'btn ng'; b1.textContent = '消す'; var b2 = document.createElement('button'); b2.className = 'btn ghost'; b2.textContent = 'やめる';
    box.appendChild(b1); box.appendChild(b2);
    b2.onclick = function(){ box.classList.add('hide'); resetStep = 0; };
    b1.onclick = function(){
      if (resetStep === 1){ resetStep = 2; p.textContent = '本当に消しますか?もとにはもどせません。'; b1.textContent = '本当に消す'; return; }
      S = {}; saveS(); P = {xp:0, mute:P.mute, day:'', streak:0, sci:'me', sciStart:1, scis:{}}; saveP();
      try { localStorage.removeItem(KEY); localStorage.removeItem(PKEY); } catch(e){}
      box.classList.add('hide'); resetStep = 0; buildHome();
    };
  };

  initSci();
  buildHome();
  window.__ichimon = { S: function(){ return S; }, P: function(){ return P; }, WAIT: WAIT, DATA: DATA, CFG: CFG, SCI: SCI, lvOf: lvOf, changeSci: changeSci };
})();
</script>
</body>
