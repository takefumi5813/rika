<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>理科 一問一答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e3f4ec; --card:#ffffff; --ink:#10382a; --sub:#4a7a66; --line:#b7dcc9; --soft:#d2ecde;
  --primary:#148f5a; --primary-ink:#ffffff;
  --bio:#1b8a5a; --phy:#1a5fd8; --chem:#d9742e; --geo:#8a5a2a; --great:#b8860b; --env:#13a0a8; --tag-ink:#ffffff;
  --ok:#1b8a5a; --ng:#d93a3a; --ng-ink:#ffffff; --ctx:#eaf7f0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b2219; --card:#123428; --ink:#e6f6ee; --sub:#9bd1b6; --line:#2a5a45; --soft:#1b4634;
    --primary:#4fd49a; --primary-ink:#06160f;
    --bio:#52c995; --phy:#6aa4ff; --chem:#ffa15a; --geo:#d9a06a; --great:#ffd54a; --env:#5fd8e0; --tag-ink:#06160f;
    --ok:#52c995; --ng:#ff6b6b; --ng-ink:#2a0606; --ctx:#183a2c;
  }
}
:root[data-theme="dark"]{
  --bg:#0b2219; --card:#123428; --ink:#e6f6ee; --sub:#9bd1b6; --line:#2a5a45; --soft:#1b4634;
  --primary:#4fd49a; --primary-ink:#06160f;
  --bio:#52c995; --phy:#6aa4ff; --chem:#ffa15a; --geo:#d9a06a; --great:#ffd54a; --env:#5fd8e0; --tag-ink:#06160f;
  --ok:#52c995; --ng:#ff6b6b; --ng-ink:#2a0606; --ctx:#183a2c;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-weight:500;line-height:1.65;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;font-weight:900;margin:8px 0 4px}
.lead{color:var(--sub);margin:0 0 18px;font-size:15px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px}
.panel h2{font-size:14px;margin:0 0 8px;color:var(--sub);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{appearance:none;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;min-height:44px;text-align:left}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.chip small{display:block;font-weight:500;font-size:12px;opacity:.9;line-height:1.4}
.btn{appearance:none;border:0;font:inherit;font-weight:900;font-size:18px;padding:15px 20px;border-radius:16px;cursor:pointer;width:100%;min-height:54px;background:var(--primary);color:var(--primary-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ng{background:var(--ng);color:var(--ng-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip:focus-visible,.btn:focus-visible,.link:focus-visible{outline:3px solid var(--ng);outline-offset:2px}
.row{display:flex;gap:10px;margin-top:12px}
.row .btn{flex:1}
.info{font-size:14px;color:var(--sub);margin:12px 0 0;text-align:center}
.undo{text-align:right;margin:-6px 0 8px}.undo .link{font-size:13px;color:#d93a3a}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sub);margin-bottom:10px;font-weight:700}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--primary);width:0;transition:width .25s}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-block;color:var(--tag-ink);font-weight:900;font-size:13px;padding:3px 12px;border-radius:99px;background:var(--sub)}
.tag.bio{background:var(--bio)} .tag.phy{background:var(--phy)} .tag.chem{background:var(--chem)} .tag.geo{background:var(--geo)} .tag.great{background:var(--great)} .tag.env{background:var(--env)}
.unit{font-size:13px;color:var(--sub);font-weight:700}
.src{font-size:11px;color:var(--sub);opacity:.85}
.rank{margin-left:auto;font-size:18px;letter-spacing:.04em;white-space:nowrap}.rank .on{color:#f2b01e}.rank .off{color:#8fb9a5}.rank small{font-size:11px;color:var(--sub);margin-right:4px;font-weight:700}
.ctx{background:var(--ctx);border-radius:12px;padding:8px 12px;margin:12px 0 0;font-size:14px;color:var(--sub)}
.ctx b{color:var(--ink)}
.q{font-size:21px;font-weight:900;line-height:1.6;margin:14px 0 18px;min-height:4.8em;word-break:break-word;white-space:pre-line}
.q .lab{display:block;font-size:14px;color:var(--sub);font-weight:700;margin-bottom:4px}
.ans{border-top:2px dashed var(--line);padding-top:14px;margin-top:4px}
.ans .lab{font-size:13px;color:var(--sub);font-weight:700}
.ans .a{font-size:26px;font-weight:900;margin:2px 0 4px;color:var(--ok);word-break:break-word}
.ans .n{font-size:15px;color:var(--sub);margin:4px 0 0}
.hide{display:none !important}
.score{font-size:56px;font-weight:900;line-height:1.1;margin:6px 0}
.score small{font-size:22px;color:var(--sub)}
.msg{font-size:18px;font-weight:700;margin:0 0 16px}
.wronglist{margin:14px 0 0;padding:0;list-style:none}
.wronglist li{padding:10px 0;border-top:1px solid var(--line);font-size:15px;white-space:pre-line}
.wronglist b{display:block;color:var(--ok)}
.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--sub)}
.link{appearance:none;background:none;border:0;color:var(--sub);font:inherit;text-decoration:underline;cursor:pointer;padding:8px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
.scibar{appearance:none;display:flex;align-items:center;gap:10px;width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:10px 14px;font:inherit;cursor:pointer;margin:0 0 16px;text-align:left}
.scibar .jicon{font-size:30px;line-height:1}
.scibar .jtxt{flex:1;display:flex;flex-direction:column}
.scibar b{font-size:17px;font-weight:900}
.scibar small{font-size:12px;color:var(--sub)}
.scibar .jgo{font-size:13px;color:var(--primary);font-weight:700}
.enemy{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;font-size:13px;font-weight:700;color:var(--sub)}
.enemy .eicon{font-size:26px;line-height:1}
.enemy .ehp{flex:1;height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.enemy .ehp i{display:block;height:100%;background:#d93a3a;width:100%;transition:width .3s}
.enemy.hit .eicon{animation:ehit 400ms}
@keyframes ehit{0%,100%{transform:none}30%{transform:translateX(8px) rotate(12deg)}60%{transform:translateX(-6px) rotate(-10deg)}}
.enemy.dead .eicon{opacity:.25;transform:rotate(90deg)}
.jobclear{margin:12px 0;padding:14px;border:2px solid #f2b01e;border-radius:14px;background:var(--ctx)}
.jobclear p{margin:0 0 10px;font-weight:900}
.resetbox{margin-top:8px;font-size:14px;text-align:left}
.bktext{width:100%;box-sizing:border-box;font:12px/1.4 monospace;border:2px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;background:var(--card);color:var(--ink)}
.resetbox .btn{margin-top:8px;font-size:15px;min-height:44px}
#scis{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:40;padding-top:env(safe-area-inset-top,0px)}
.tier{margin:0 0 18px}
.tier h3{font-size:13px;color:var(--sub);margin:0 0 8px}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.job{border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--card);text-align:left;font:inherit;color:var(--ink);cursor:pointer;min-height:84px}
.job .ji{font-size:26px;line-height:1}
.job b{display:block;font-size:15px;font-weight:900;margin-top:4px}
.job small{display:block;font-size:11px;color:var(--sub);line-height:1.4;margin-top:2px}
.job.cleared{border-color:#1b8a5a}
.job.cleared b::after{content:' ✓';color:#1b8a5a}
.job.current{border-color:var(--primary);box-shadow:0 0 0 3px var(--soft)}
.job.avail{border-color:#f2b01e;border-style:dashed}
.job.locked{opacity:.45;border-style:dashed;cursor:default}
.job.next{opacity:.8;border-style:dashed}
.job.locked .ji{filter:blur(2px)}
/* 科学者カード */
#scicard{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--card);color:var(--ink);border-radius:20px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;border:3px solid #f2b01e}
.card .ci{font-size:64px;text-align:center;line-height:1.1}
.card h3{font-size:22px;font-weight:900;margin:8px 0 2px;text-align:center}
.card .era{font-size:13px;color:var(--sub);text-align:center;margin:0 0 10px}
.card .deed{font-weight:900;font-size:16px;background:var(--ctx);border-radius:12px;padding:8px 12px;margin:0 0 10px}
.card ul{margin:0 0 12px;padding-left:20px;font-size:15px}
.card li{margin:4px 0}
.card .note{font-size:13px;color:var(--sub);margin:0 0 10px}
.card .row{margin-top:8px}
.dmg{position:absolute;top:36%;left:50%;transform:translate(-50%,0);font-size:48px;font-weight:900;color:#fff;text-shadow:0 0 6px #000,0 2px 0 #000;animation:dmg 1400ms ease-out forwards;white-space:nowrap}
.dmg.crit{color:#ffd54a;font-size:56px}
@keyframes dmg{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.act{position:absolute;top:26%;left:50%;transform:translateX(-50%);font-size:16px;font-weight:900;color:#fff;background:rgba(0,0,0,.55);padding:4px 14px;border-radius:99px;animation:actin 1400ms forwards;white-space:nowrap}
@keyframes actin{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
.glyph{position:absolute;top:46%;left:50%;font-size:72px;line-height:1;transform:translate(-50%,-50%);animation:glyph 1300ms ease-out forwards}
@keyframes glyph{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1.1)}}
.glyph.swing{animation:swing 1100ms ease-out forwards;transform-origin:20% 90%}
@keyframes swing{0%{opacity:0;transform:translate(-50%,-50%) rotate(-70deg)}40%{opacity:1;transform:translate(-50%,-50%) rotate(30deg)}100%{opacity:0;transform:translate(-50%,-50%) rotate(40deg)}}
.slash{position:absolute;top:50%;left:50%;width:260px;height:10px;background:linear-gradient(90deg,transparent,#fff,transparent);transform:translate(-50%,-50%) rotate(-35deg) scaleX(0);animation:slash 700ms ease-out forwards;box-shadow:0 0 18px #fff}
.slash.two{animation-delay:250ms;transform:translate(-50%,-50%) rotate(35deg) scaleX(0)}
@keyframes slash{0%{transform:translate(-50%,-50%) rotate(var(--ang,-35deg)) scaleX(0);opacity:1}60%{transform:translate(-50%,-50%) rotate(var(--ang,-35deg)) scaleX(1.2);opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--ang,-35deg)) scaleX(1.3)}}
.multi{position:absolute;top:46%;left:50%;font-size:56px;transform:translate(-50%,-50%);animation:multi 1200ms ease-out forwards}
@keyframes multi{0%{opacity:0;transform:translate(-80%,-50%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}50%{transform:translate(-20%,-60%) scale(1)}75%{opacity:1;transform:translate(-55%,-40%) scale(1.3)}100%{opacity:0}}
.ring{position:absolute;top:46%;left:50%;width:40px;height:40px;border:6px solid var(--c,#ffd54a);border-radius:50%;transform:translate(-50%,-50%);animation:ring 1200ms ease-out forwards}
@keyframes ring{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(6)}}
.ouch{position:absolute;top:24%;left:50%;transform:translate(-50%,-50%);font-size:22px;font-weight:900;color:#fff;background:#d93a3a;padding:4px 14px;border-radius:99px;animation:actin 1300ms forwards;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion: reduce){.glyph,.slash,.multi,.ring,.dmg,.act,.ouch{animation:fadeonly 900ms forwards}}
.hud{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0 0 14px;font-weight:900}
.hud .lv{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:15px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.lv.t0{background:#8d6e63;border-color:#6d4c41}.lv.t1{background:#8e9aab;border-color:#6f7b8c}.lv.t2{background:#e0a800;border-color:#b58900}
.lv.t3{background:#1a5fd8;border-color:#0f47a8}.lv.t4{background:#7a3fd1;border-color:#5a2aa6}.lv.t5{background:#d93a3a;border-color:#a92222}
.lv.t6{background:#0e9a8a;border-color:#0b7a6d}.lv.t7{background:linear-gradient(90deg,#ff5f6d,#ffc371,#47d16c,#3aa0ff,#b36bff);border-color:#fff}
.hud .pt{color:var(--primary);font-size:15px}
.combo{font-size:14px;color:#e08a1a;font-weight:900;min-width:5em;text-align:right}
.mute{appearance:none;border:2px solid var(--line);background:var(--card);border-radius:999px;font-size:18px;width:44px;height:44px;cursor:pointer}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;display:flex;align-items:center;justify-content:center;overflow:hidden}
.burst{position:absolute;width:10px;height:14px;border-radius:2px;top:50%;left:50%;opacity:0;animation:fly 1300ms cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.yay{position:relative;text-align:center;animation:pop 1400ms ease-out forwards}
.yay .big{font-size:64px;font-weight:900;color:var(--ok);text-shadow:0 3px 0 rgba(0,0,0,.12);line-height:1.1}
.yay .sub{font-size:20px;font-weight:900;color:var(--primary);margin-top:4px}
.yay .up{font-size:18px;font-weight:900;color:#e08a1a;margin-top:2px}
@keyframes pop{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.15);opacity:1}60%{transform:scale(1)}100%{transform:scale(1) translateY(-30px);opacity:0}}
.stamp{position:relative;text-align:center;animation:stamp 1500ms ease-out forwards}
.stamp .kanji{display:inline-block;font-family:"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho",serif;font-size:150px;line-height:1;color:#d64545;border:8px solid #d64545;border-radius:22px;padding:6px 18px 14px;background:rgba(255,255,255,.88);transform:rotate(-8deg)}
.stamp .yomi{font-size:16px;font-weight:900;color:#d64545;margin-top:12px}
.stamp .msg2{font-size:22px;font-weight:900;color:var(--ink);background:var(--card);border-radius:12px;padding:4px 14px;margin-top:8px;display:inline-block}
@keyframes stamp{0%{transform:scale(2.4);opacity:0}18%{transform:scale(.92);opacity:1}26%{transform:scale(1.03)}34%{transform:scale(1)}82%{opacity:1}100%{opacity:0}}
.shake{animation:shake 380ms}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.lvup{font-size:15px;color:#e08a1a;font-weight:900}
@media (prefers-reduced-motion: reduce){.burst{display:none}.yay,.stamp{animation:fadeonly 1200ms forwards}.shake{animation:none}@keyframes fadeonly{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0}}}
</style>
</head>
<body>
<div class="wrap">

  <section id="home">
    <div class="hud"><span class="lv" id="lvH"></span><span class="pt" id="ptH"></span><button class="mute" id="mute" type="button" aria-label="音のオンオフ">🔊</button></div>
    <button class="scibar" id="scibtn" type="button"><span class="jicon" id="jicon"></span><span class="jtxt"><b id="jname"></b><small id="jprog"></small></span><span class="jgo">仲間をみる ›</span></button>
    <h1>理科 一問一答</h1>
    <p class="lead">問題を読んで、頭の中で答えてから「答えを見る」を押そう。</p>
    <div class="panel">
      <h2>どこから出す?</h2>
      <div class="chips" id="modes"></div>
      <h2>問題の数</h2>
      <div class="chips" id="counts"></div>
      <button class="btn" id="start">スタート</button>
      <p class="info" id="dueinfo"></p>
    </div>
    <div class="foot">
      <div id="ver"></div>
      <button class="link" id="resetall">学習の記録をリセット</button>
      <button class="link" id="backup">記録のバックアップ／引っこし</button>
      <div id="resetbox" class="resetbox hide"></div>
      <div id="bkbox" class="resetbox hide">
        <p>この端末の記録(ランク・ポイント・仲間)を文字のコードにします。別の端末やファイルで続けるときは、コードをコピーして、そちらで「読み込む」に貼りつけます。</p>
        <button class="btn ghost" id="bkout" type="button">コードを出す</button>
        <textarea id="bktext" class="bktext" rows="4" placeholder="ここにコードが出ます／貼りつけます"></textarea>
        <button class="btn" id="bkin" type="button">このコードを読み込む(今の記録と合わせる)</button>
        <p id="bkmsg"></p>
      </div>
    </div>
  </section>

  <section id="play" class="hide">
    <div class="meta"><span id="pos"></span><span class="combo" id="combo"></span><button class="link" id="quit">やめる</button></div>
    <div class="enemy" id="enemy"><span class="eicon" id="eicon"></span><span class="ename" id="ename"></span><span class="ehp"><i id="ehp"></i></span><span class="ehpn" id="ehpn"></span></div>
    <div class="undo"><button class="link hide" id="undo" type="button">← 押しまちがえた(ひとつ前にもどる)</button></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="panel">
      <div class="tags"><span class="tag" id="tag"></span><span class="unit" id="unit"></span><span class="rank" id="rank" aria-label="ランク"></span></div>
      <div class="src" id="src"></div>
      <div class="ctx hide" id="ctx"></div>
      <div class="q" id="q"></div>
      <button class="btn" id="show">答えを見る</button>
      <div id="reveal" class="hide">
        <div class="ans">
          <div class="lab">答え</div>
          <div class="a" id="a"></div>
          <p class="n hide" id="n"></p>
        </div>
        <div class="row">
          <button class="btn ng" id="bad">まちがえた</button>
          <button class="btn ok" id="good">できた</button>
        </div>
      </div>
    </div>
  </section>

  <section id="result" class="hide">
    <div class="panel">
      <h2>けっか</h2>
      <div class="score"><span id="sc"></span><small> / <span id="tot"></span></small></div>
      <p class="msg" id="rmsg"></p>
      <p class="lvup" id="rpt"></p>
      <div id="jobclear" class="jobclear hide"><p id="jobclearmsg"></p><button class="btn" id="toscis">次の仲間をえらぶ</button></div>
      <div id="wrongwrap" class="hide">
        <h2>まちがえた問題</h2>
        <ul class="wronglist" id="wrongs"></ul>
      </div>
      <div class="undo"><button class="link hide" id="undo2" type="button">← 最後の問題を押しまちがえた(もどる)</button></div>
      <div class="row">
        <button class="btn ghost" id="home2">はじめに戻る</button>
        <button class="btn" id="again">つづける</button>
      </div>
    </div>
  </section>

</div>

<section id="scis" class="hide">
  <div class="wrap">
    <div class="meta"><b>仲間の科学者</b><button class="link" id="scisclose">とじる</button></div>
    <p class="lead" id="scislead"></p>
    <div id="scitiers"></div>
  </div>
</section>

-7","s":"コアプラス","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\nあたためられた水（空気）が上へ動き、全体があたたまる。上を熱すると上だけ熱くなる","a":"対流"},{"id":"CP-4-8","s":"コアプラス","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n光が当たって吸収され熱が伝わる。黒色は白色より日光を吸収しやすい","a":"放射（ふく射）"},{"id":"CP-4-9","s":"コアプラス","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n魔法びん：真空で伝導と対流を防ぎ、銀メッキで［　　］を反射","a":"放射"},{"id":"CP-4-10","s":"コアプラス","f":"化学","u":["25"],"q":"次の説明にあてはまる言葉は?\n液体＝塩酸／固体＝炭酸カルシウムを含む物（石灰石・大理石・貝殻・卵の殻・チョーク）","a":"二酸化炭素"},{"id":"CP-4-11","s":"コアプラス","f":"化学","u":["25"],"q":"［　　］に入る言葉は?\n二酸化炭素：炭素を完全燃焼させると発生／［　　］水溶液によく吸収される／石灰水を白くにごらせる","a":"水酸化ナトリウム"},{"id":"CP-4-12","s":"コアプラス","f":"化学","u":["25"],"q":"［　　］に入る言葉は?\n二酸化炭素：炭素を完全燃焼させると発生／水酸化ナトリウム水溶液によく吸収される／［　　］を白くにごらせる","a":"石灰水"},{"id":"CP-4-13","s":"コアプラス","f":"化学","u":["3","夏1","夏2"],"q":"次の説明にあてはまる言葉は?\n物が熱と光を出しながら激しく酸素と結びつくこと","a":"燃焼"},{"id":"CP-4-14","s":"コアプラス","f":"化学","u":["3","夏1","夏2"],"q":"［　　］に入る言葉は?\n炎のつくり：［　　］＝完全燃焼で最も高温、炎はほとんど見えない／内炎＝炭素の粒が熱せられて輝き最も明るい／炎心＝ほとんど燃焼しておらず最も低温","a":"外炎"},{"id":"CP-4-15","s":"コアプラス","f":"化学","u":["3","夏1","夏2"],"q":"［　　］に入る言葉は?\n炎のつくり：外炎＝完全燃焼で最も高温、炎はほとんど見えない／［　　］＝炭素の粒が熱せられて輝き最も明るい／炎心＝ほとんど燃焼しておらず最も低温","a":"内炎"},{"id":"CP-4-16","s":"コアプラス","f":"化学","u":["3","夏1","夏2"],"q":"［　　］に入る言葉は?\nろうそくのまわりの対流により：新しい酸素が供給され燃え続ける／外壁が冷やされてふちが土手のように盛り上がる／炎の形が［　　］なる","a":"細長く"},{"id":"CP-4-17","s":"コアプラス","f":"化学","u":["3","夏1","夏2"],"q":"［　　］に入る言葉は?\nさび：［　　］＝水分があるところで自然に酸素と結びつき内部まで進む／黒さび＝鉄が燃焼してでき、膜をつくり内部を守る。電気は通しにくいが磁石にはつく","a":"赤さび"},{"id":"CP-4-18","s":"コアプラス","f":"化学","u":["3","夏1","夏2"],"q":"［　　］に入る言葉は?\nさび：赤さび＝水分があるところで自然に酸素と結びつき内部まで進む／［　　］＝鉄が燃焼してでき、膜をつくり内部を守る。電気は通しにくいが磁石にはつく","a":"黒さび"},{"id":"CP-4-19","s":"コアプラス","f":"化学","u":["春1","3","26","27"],"q":"次の説明にあてはまる言葉は?\n熱量＝水の重さ×温度。混ぜた後の温度＝（各水の重さ×温度の和）÷（重さの合計）","a":"熱量計算"},{"id":"CPQ-157","s":"コアプラス","f":"化学","u":["春1"],"q":"打ち水で涼しくなる理由は?","a":"水が蒸発するときに地面から気化熱を奪うため"},{"id":"CPQ-164","s":"コアプラス","f":"化学","u":["春1"],"q":"毛細管つきフラスコを熱湯につけたときの水面は?","a":"いったん少し下がり、その後大きく上がる"},{"id":"CPQ-181","s":"コアプラス","f":"化学","u":["25"],"q":"炭酸カルシウムを含む物5つ答えよう","a":"石灰石・大理石・貝殻・卵の殻・チョーク"},{"id":"CP-5-23","s":"コアプラス","f":"化学","u":["1"],"q":"次の説明にあてはまる言葉は?\n固体が液体に状態変化する（雪がとける）","a":"融解"},{"id":"CP-5-24","s":"コアプラス","f":"化学","u":["1"],"q":"次の説明にあてはまる言葉は?\n細かい粒になって全体に散らばり、目に見えなくなる（紅茶に砂糖がとける）","a":"溶解"},{"id":"CP-5-25","s":"コアプラス","f":"化学","u":["1"],"q":"次の説明にあてはまる言葉は?\n別の物質になる（酢に卵の殻を入れるととける）","a":"化学変化"},{"id":"CP-5-26","s":"コアプラス","f":"化学","u":["1"],"q":"［　　］に入る言葉は?\n水溶液＝物が水に溶解した液体。有色でもよいが透明、濃さは［　　］、重さは水＋溶けた物の和","a":"均一"},{"id":"CP-5-27","s":"コアプラス","f":"化学","u":["20","21","1"],"q":"次の説明にあてはまる言葉は?\n砂糖を細かく砕く／水温を上げる／よくかき混ぜる","a":"早く溶かす"},{"id":"CP-5-28","s":"コアプラス","f":"化学","u":["20","21","1"],"q":"次の説明にあてはまる言葉は?\n水の量を増やす／水温を上げる（「かき混ぜる」は量を増やさない ← ここが混同しやすい）","a":"たくさん溶かす"},{"id":"CP-5-29","s":"コアプラス","f":"化学","u":["1","2"],"q":"次の説明にあてはまる言葉は?\n塩酸・炭酸水・ホウ酸水・酢酸水溶液／アルカリ性＝アンモニア水・水酸化ナトリウム水溶液・石灰水・重そう水","a":"酸性"},{"id":"CP-5-30","s":"コアプラス","f":"化学","u":["1","2"],"q":"［　　］に入る言葉は?\nリトマス紙：ピンセットで持ち、ガラス棒で液をつける。赤色リトマス紙が変化しない＝［　　］","a":"酸性か中性"},{"id":"CP-5-31","s":"コアプラス","f":"化学","u":["1","2"],"q":"［　　］に入る言葉は?\nBTB液：酸性［　　］／中性緑／アルカリ性青","a":"黄"},{"id":"CP-5-32","s":"コアプラス","f":"化学","u":["1","2"],"q":"［　　］に入る言葉は?\nBTB液：酸性黄／中性［　　］／アルカリ性青","a":"緑"},{"id":"CP-5-33","s":"コアプラス","f":"化学","u":["1","2"],"q":"［　　］に入る言葉は?\nフェノールフタレイン液：アルカリ性だけ［　　］","a":"赤"},{"id":"CPQ-217","s":"コアプラス","f":"化学","u":["1","20"],"q":"食塩の飽和水溶液からなるべく大きな結晶を得る方法は?","a":"水をゆっくり蒸発させる"},{"id":"CPQ-222","s":"コアプラス","f":"化学","u":["1","2"],"q":"においの調べ方は?","a":"手であおぎ、空気と混ぜてうすめて吸う"},{"id":"CPQ-225","s":"コアプラス","f":"化学","u":["2","25"],"q":"酸性と中性で無色、アルカリ性で赤色の指示薬は?","a":"フェノールフタレイン液"},{"id":"CP-6-37","s":"コアプラス","f":"地学","u":["春2"],"q":"［　　］に入る言葉は?\n日の出は［　　］、日の入りは西寄りの地平線。春分・秋分は真東・真西","a":"東寄り"},{"id":"CP-6-38","s":"コアプラス","f":"地学","u":["春2"],"q":"［　　］に入る言葉は?\n日の出は東寄り、日の入りは［　　］の地平線。春分・秋分は真東・真西","a":"西寄り"},{"id":"CP-6-39","s":"コアプラス","f":"地学","u":["春2"],"q":"［　　］に入る言葉は?\n地軸は公転軸に対して［　　］傾いている。季節による南中高度の変化は、地軸を傾けたまま公転しているから（太陽との距離は関係ない）","a":"23.4度"},{"id":"CP-6-40","s":"コアプラス","f":"地学","u":["春2"],"q":"［　　］に入る言葉は?\n日影曲線：南中時の影の中心ができる側が［　　］、その反対が南。冬至の曲線は最も影が長いもの","a":"北"},{"id":"CP-6-41","s":"コアプラス","f":"地学","u":["春2","34"],"q":"［　　］に入る言葉は?\n日本標準時子午線は兵庫県［　　］市を通る東経135度","a":"明石"},{"id":"CP-6-42","s":"コアプラス","f":"地学","u":["春2","34"],"q":"［　　］に入る言葉は?\n日本標準時子午線は兵庫県明石市を通る［　　］","a":"東経135度"},{"id":"CP-6-43","s":"コアプラス","f":"地学","u":["春2","34"],"q":"［　　］に入る言葉は?\n太陽の光は［　　］（太陽が非常に遠いため）。棒を移動しても影の長さは変わらない","a":"平行光線"},{"id":"CP-6-44","s":"コアプラス","f":"地学","u":["春2","春3"],"q":"次の説明にあてはまる言葉は?\n自ら光を放つ星。エネルギー源は水素の核融合（燃焼ではない）","a":"恒星"},{"id":"CP-6-45","s":"コアプラス","f":"地学","u":["春3","11","12"],"q":"［　　］に入る言葉は?\n月の出・月の入りは1日あたり約［　　］なる（南中から次の南中まで約24時間48分。位置は1日あたり約12度東へずれる）","a":"48分遅く"},{"id":"CP-6-46","s":"コアプラス","f":"地学","u":["春3","11","12"],"q":"［　　］に入る言葉は?\n月の出・月の入りは1日あたり約48分遅くなる（南中から次の南中まで約［　　］。位置は1日あたり約12度東へずれる）","a":"24時間48分"},{"id":"CP-6-47","s":"コアプラス","f":"地学","u":["春3","11","12"],"q":"［　　］に入る言葉は?\n公転周期（27.3日）より満ち欠けの周期（29.5日）の方が約［　　］。地球が太陽のまわりを公転しているから","a":"2.2日長い"},{"id":"CP-6-48","s":"コアプラス","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\n1等星は全天で［　　］。最も明るいのはおおいぬ座のシリウス（−1.5等）","a":"21個"},{"id":"CP-6-49","s":"コアプラス","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\n1等星は全天で21個。最も明るいのは［　　］（−1.5等）","a":"おおいぬ座のシリウス"},{"id":"CP-6-50","s":"コアプラス","f":"地学","u":["15","16"],"q":"次の説明にあてはまる言葉は?\n上端の2つの2等星を結ぶ線と、下端の3等星を結ぶ線を延長した交点と、真ん中の2等星を結び、その線を5倍のばす","a":"カシオペヤ座から北極星"},{"id":"CP-6-51","s":"コアプラス","f":"地学","u":["15","16"],"q":"次の説明にあてはまる言葉は?\nシリウス（白・おおいぬ座）・プロキオン（黄・こいぬ座）・ベテルギウス（赤・オリオン座）・リゲル（青白・オリオン座）","a":"冬の星空"},{"id":"CP-6-52","s":"コアプラス","f":"地学","u":["15","16"],"q":"［　　］に入る言葉は?\nオリオン座の3つ星は真東からのぼって真西に沈む（春分・秋分の太陽と同じ）。南中高度＝［　　］。空に出ている時間は約12時間","a":"90−緯度"},{"id":"CP-7-53","s":"コアプラス","f":"地学","u":["22"],"q":"［　　］に入る言葉は?\n中流〜下流：［　　］され、石はぶつかって角がとれ小さく丸くなる","a":"運搬"},{"id":"CP-7-54","s":"コアプラス","f":"地学","u":["22"],"q":"次の説明にあてはまる言葉は?\n堤防を作ると川底に土砂がたまり続け、堤防を高くすることを繰り返して、まわりの土地より川底が高くなる","a":"天井川"},{"id":"CP-7-55","s":"コアプラス","f":"地学","u":["22"],"q":"［　　］に入る言葉は?\n砂防えん堤：土砂をせき止め、流れをゆるやかにする。ただし魚がのぼれなくなるので［　　］などの工夫が必要","a":"魚道"},{"id":"CP-7-56","s":"コアプラス","f":"地学","u":["22"],"q":"［　　］に入る言葉は?\n海では河口に近い浅い所＝小石、［　　］","a":"遠い深い所＝泥"},{"id":"CP-7-57","s":"コアプラス","f":"地学","u":["22","24"],"q":"［　　］に入る言葉は?\n層が水平に連続して重なる＝整合。間に侵食面があり地上に出た証拠がある＝［　　］","a":"不整合"},{"id":"CP-7-58","s":"コアプラス","f":"地学","u":["22","24"],"q":"［　　］に入る言葉は?\n地層の逆転や傾きは［　　］による力で起こる","a":"火山活動やプレートの運動"},{"id":"CP-7-59","s":"コアプラス","f":"地学","u":["22","24"],"q":"［　　］に入る言葉は?\n［　　］（時代が分かる）：広い範囲に限られた期間だけ生存した生き物。アンモナイト・フズリナ・サンヨウチュウ・マンモス・ナウマンゾウ","a":"示準化石"},{"id":"CP-7-60","s":"コアプラス","f":"地学","u":["22","24"],"q":"［　　］に入る言葉は?\n地下水は［　　］にたまりやすい（泥は粒が細かく水を通しにくい）","a":"泥の層の上"},{"id":"CP-7-61","s":"コアプラス","f":"地学","u":["22","23"],"q":"［　　］に入る言葉は?\nカコウ岩の主な鉱物：石英（無色透明）・長石（白）・黒雲母（黒）。風化すると［　　］になる","a":"真砂土"},{"id":"CP-7-62","s":"コアプラス","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\n火山灰は風によって広い範囲へ運ばれる（日本では偏西風のため火山の［　　］に多い）","a":"東側"},{"id":"CP-7-63","s":"コアプラス","f":"地学","u":["23"],"q":"次の説明にあてはまる言葉は?\n軽石や溶岩などが高温の火山ガスと混ざり流れ下る。700℃に達し、速さは高速道路を走る自動車ほど","a":"火砕流"},{"id":"CP-7-64","s":"コアプラス","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\n火山ガスの主成分は［　　］（白い煙は湯気）。ほかに二酸化炭素・硫化水素などの有毒な気体","a":"水蒸気"},{"id":"CP-7-65","s":"コアプラス","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\n直径2mm以下の噴出物＝［　　］、小さな穴が多く水に浮くほど軽い噴出物＝軽石（マグマに溶けていた水が水蒸気になってできた穴）","a":"火山灰"},{"id":"CP-7-66","s":"コアプラス","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\n直径2mm以下の噴出物＝火山灰、小さな穴が多く水に浮くほど軽い噴出物＝［　　］（マグマに溶けていた水が水蒸気になってできた穴）","a":"軽石"},{"id":"CP-7-67","s":"コアプラス","f":"地学","u":["24"],"q":"［　　］に入る言葉は?\n海溝型地震＝プレート境界で周期的に起こる大規模地震／［　　］がずれて起こる","a":"内陸型地震＝活断層"},{"id":"CP-7-68","s":"コアプラス","f":"地学","u":["24"],"q":"次の説明にあてはまる言葉は?\n地震の規模。2大きいとエネルギー1000倍、1大きいと約32倍","a":"マグニチュード"},{"id":"CP-7-69","s":"コアプラス","f":"地学","u":["24"],"q":"次の説明にあてはまる言葉は?\n各地点のゆれの大きさ。0〜7の10段階（5・6は弱・強に分かれる）","a":"震度"},{"id":"CP-7-70","s":"コアプラス","f":"地学","u":["24"],"q":"［　　］に入る言葉は?\n地震計は［　　］（上下動用）とふりこ（水平動用）の不動点を利用する","a":"ばね"},{"id":"CP-7-71","s":"コアプラス","f":"地学","u":["24"],"q":"［　　］に入る言葉は?\n地震計はばね（上下動用）と［　　］（水平動用）の不動点を利用する","a":"ふりこ"},{"id":"CP-7-72","s":"コアプラス","f":"地学","u":["24"],"q":"［　　］に入る言葉は?\n地震による海の波＝［　　］、地盤がゆるんで建物が倒れる現象＝液状化現象","a":"津波"},{"id":"CP-7-73","s":"コアプラス","f":"地学","u":["24"],"q":"［　　］に入る言葉は?\n地震による海の波＝津波、地盤がゆるんで建物が倒れる現象＝［　　］","a":"液状化現象"},{"id":"CPQ-39","s":"コアプラス","f":"地学","u":["22"],"q":"川から運ばれる土砂の量が増えるのはどんなときか?","a":"大雨によって川が増水したとき"},{"id":"CPQ-43","s":"コアプラス","f":"地学","u":["22"],"q":"天井川で川の高さが昔より高くなった理由は?","a":"川底に土砂がたまっていったから"},{"id":"CPQ-56","s":"コアプラス","f":"地学","u":["23"],"q":"火山の近くの白い煙にもっとも多く含まれる気体は?","a":"水蒸気"},{"id":"CPQ-57","s":"コアプラス","f":"地学","u":["23"],"q":"穴だらけの石（軽石）はどのようにできたか?","a":"マグマから火山ガスが出ることでできた"},{"id":"CP-8-78","s":"コアプラス","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n晴れの日は最高気温が高い（雲に邪魔されず日光が地面をあたためる）が、最低気温は低い（夜間の［　　］）","a":"放射冷却"},{"id":"CP-8-79","s":"コアプラス","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n地域気象観測システム","a":"アメダス"},{"id":"CP-8-80","s":"コアプラス","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n気象衛星［　　］は赤道上空約36000kmの静止軌道。常に同じ位置に見えるのは、地球の自転とまわる向き・周期が同じだから（速さは違う）","a":"ひまわり"},{"id":"CP-8-81","s":"コアプラス","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n気象衛星ひまわりは［　　］の静止軌道。常に同じ位置に見えるのは、地球の自転とまわる向き・周期が同じだから（速さは違う）","a":"赤道上空約36000km"},{"id":"CP-8-82","s":"コアプラス","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n空気1m³中に含むことのできる水蒸気の限界量。気温が高いほど大きい","a":"飽和水蒸気量"},{"id":"CP-8-83","s":"コアプラス","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n冷やしていくと飽和水蒸気量が小さくなり、湿度が100%になって水滴が生じる。このときの温度が［　　］","a":"露点"},{"id":"CP-8-84","s":"コアプラス","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n昼、陸の方が太陽の放射熱であたたまりやすく、陸の空気が膨張して上昇。そこへ海から陸へ吹く風。夜は逆で陸風","a":"海風"},{"id":"CP-8-85","s":"コアプラス","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n朝と夕方、陸と海の温度が等しくなり無風状態になる","a":"凪"},{"id":"CP-8-86","s":"コアプラス","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n中心が下降気流。上空から下降するとき周囲の気圧が高く空気が圧縮され温度が上がるので飽和水蒸気量が大きくなり、雲が消えて晴れる","a":"高気圧"},{"id":"CP-8-87","s":"コアプラス","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n中緯度上空を1年中吹く西よりの強い風。日本の天気は西から東へ変化する","a":"偏西風"},{"id":"CP-8-88","s":"コアプラス","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n春・秋に長江気団から偏西風に乗ってやってくる。天気が周期的に変わる","a":"移動性高気圧"},{"id":"CP-8-89","s":"コアプラス","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n6〜7月の長雨、秋雨（あきさめ）＝8月末〜10月の長雨","a":"梅雨（つゆ）"},{"id":"CP-8-90","s":"コアプラス","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n北西太平洋にある熱帯低気圧のうち、最大風速が毎秒17.2m以上（風力8以上）になったもの","a":"台風"},{"id":"CP-8-91","s":"コアプラス","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n進行方向の［　　］は風が強い。台風の中心に向かって吹き込む風と進行方向が一致するから","a":"右側（危険半円）"},{"id":"CP-8-92","s":"コアプラス","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n中心付近の雲がなく風もおだやかな部分。通過後に晴れる＝台風一過","a":"台風の目"},{"id":"CP-8-93","s":"コアプラス","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n台風で海水が吸い上げられ吹き寄せられる。満潮と重なると被害が大きい","a":"高潮"},{"id":"CP-8-94","s":"コアプラス","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n都市部が郊外より数℃気温が高くなる／フェーン現象＝山を越えた空気が乾燥して気温が高くなる","a":"ヒートアイランド現象"},{"id":"CPQ-327","s":"コアプラス","f":"地学","u":["34"],"q":"地域気象観測システムの略称は?","a":"アメダス"},{"id":"CPQ-342","s":"コアプラス","f":"地学","u":["34"],"q":"中緯度上空を1年中吹く西よりの強い風は?","a":"偏西風"},{"id":"CPQ-354","s":"コアプラス","f":"地学","u":["34"],"q":"都市部が郊外より数℃気温が高くなる現象は?","a":"ヒートアイランド現象"},{"id":"CPQ-355","s":"コアプラス","f":"地学","u":["34"],"q":"山を越えた空気が乾燥して気温が高くなる現象は?","a":"フェーン現象"},{"id":"CP-9-99","s":"コアプラス","f":"物理","u":["13"],"q":"［　　］に入る言葉は?\n洋ばさみで厚い紙を切るときは［　　］（支点と作用点の距離が近く、力点にかける力が小さくてすむ）","a":"根元"},{"id":"CP-9-100","s":"コアプラス","f":"物理","u":["13","14"],"q":"［　　］に入る言葉は?\n回転のはたらき：［　　］。力のモーメント＝力(g)×支点からの距離(cm)","a":"時計回り＝反時計回り"},{"id":"CP-9-101","s":"コアプラス","f":"物理","u":["14"],"q":"［　　］に入る言葉は?\n板の重心の探し方：1か所を糸でつるし、つるした点から真下に線を引く。別の点でも同じことをして、［　　］が重心","a":"2本の線の交点"},{"id":"CP-9-102","s":"コアプラス","f":"物理","u":["14"],"q":"重心の位置：長方形＝対角線の交点／ひし形＝対角線の交点／ドーナツ形は?","a":"穴の中心"},{"id":"CP-9-103","s":"コアプラス","f":"物理","u":["14"],"q":"［　　］に入る言葉は?\n太さが一様な棒：重心は［　　］、棒の重さは中心にかかるとして計算","a":"棒の中心"},{"id":"CP-9-104","s":"コアプラス","f":"物理","u":["30"],"q":"次の説明にあてはまる言葉は?\nどのばねにも同じ力がかかる。おもりの重さがそのままかかる","a":"直列つなぎ"},{"id":"CP-9-105","s":"コアプラス","f":"物理","u":["31"],"q":"次の説明にあてはまる言葉は?\n力の向きを変えるだけ。引く力＝おもりの重さ、引く距離＝持ち上げる距離","a":"定滑車"},{"id":"CP-9-106","s":"コアプラス","f":"物理","u":["31"],"q":"次の説明にあてはまる言葉は?\nおもりを2本の糸で支えるので力は1/2、引く距離は2倍","a":"動滑車"},{"id":"CP-9-107","s":"コアプラス","f":"物理","u":["31"],"q":"［　　］に入る言葉は?\n輪軸は［　　］でつり合う。半径が大きい側は力が小さくてすみ、動く距離は大きい","a":"半径の比"},{"id":"CP-9-108","s":"コアプラス","f":"物理","u":["32","35"],"q":"次の説明にあてはまる言葉は?\n液中の物体は、その物体がおしのけた液体の重さに等しい上向きの力（浮力）を受ける","a":"アルキメデスの原理"},{"id":"CP-9-109","s":"コアプラス","f":"物理","u":["36"],"q":"次の説明にあてはまる言葉は?\n振れ幅によらず周期が一定（ガリレオ・ガリレイが発見。ふりこ時計・メトロノーム）","a":"ふりこの等時性"},{"id":"CP-9-110","s":"コアプラス","f":"物理","u":["36"],"q":"［　　］に入る言葉は?\n途中に釘を打つと、左右で長さの違うふりこになる。［　　］","a":"1往復＝それぞれの半周期の和"},{"id":"CP-10-111","s":"コアプラス","f":"物理","u":["8"],"q":"［　　］に入る言葉は?\nフィラメントは［　　］。発熱して一定温度より高くなると発光する","a":"タングステン"},{"id":"CP-10-112","s":"コアプラス","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n豆電球は明るくなり、乾電池の持ちは短くなる","a":"直列"},{"id":"CP-10-113","s":"コアプラス","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n明るさは変わらず、持ちは長持ちする","a":"並列"},{"id":"CP-10-114","s":"コアプラス","f":"物理","u":["8"],"q":"［　　］に入る言葉は?\n電流の単位は［　　］、電流計は回路に直列につなぐ","a":"A（アンペア）"},{"id":"CP-10-115","s":"コアプラス","f":"物理","u":["8"],"q":"［　　］に入る言葉は?\n電流の単位はA（アンペア）、電流計は回路に［　　］につなぐ","a":"直列"},{"id":"CP-10-116","s":"コアプラス","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n導線と比べて非常に抵抗の大きい豆電球にはほぼ電流が流れず、導線側を通って乾電池に非常に大きな電流が流れる（豆電球は消える）","a":"ショート回路"},{"id":"CP-10-117","s":"コアプラス","f":"物理","u":["8"],"q":"［　　］に入る言葉は?\n［　　］。決まった向きにしか電流を流さないので、つなぐ向きで光るかどうかが決まる","a":"LED＝発光ダイオード"},{"id":"CP-10-118","s":"コアプラス","f":"物理","u":["9"],"q":"［　　］に入る言葉は?\n方位磁針を北極で使うとS極が［　　］を向く（北極付近が地球のS極）","a":"上"},{"id":"CP-10-119","s":"コアプラス","f":"物理","u":["9"],"q":"［　　］に入る言葉は?\n導線のまわりには［　　］ができる。向きは右ねじの法則（親指を電流の向きにすると、4本の指の曲がる向きが磁力線の向き）","a":"同心円状の磁力線"},{"id":"CP-10-120","s":"コアプラス","f":"物理","u":["9"],"q":"［　　］に入る言葉は?\n導線のまわりには同心円状の磁力線ができる。向きは［　　］（親指を電流の向きにすると、4本の指の曲がる向きが磁力線の向き）","a":"右ねじの法則"},{"id":"CP-10-121","s":"コアプラス","f":"物理","u":["10"],"q":"［　　］に入る言葉は?\nコイルに［　　］の鉄心を入れたものが電磁石。鋼鉄だと電流を切った後も磁力が残る","a":"軟鉄"},{"id":"CP-10-122","s":"コアプラス","f":"物理","u":["10"],"q":"［　　］に入る言葉は?\nコイルに軟鉄の鉄心を入れたものが［　　］。鋼鉄だと電流を切った後も磁力が残る","a":"電磁石"},{"id":"CPQ-405","s":"コアプラス","f":"物理","u":["8","夏7"],"q":"電熱線を利用した道具3つ答えよう","a":"アイロン、ドライヤー、ホットプレート など"},{"id":"CP-11-124","s":"コアプラス","f":"物理","u":["夏3"],"q":"次の説明にあてはまる言葉は?\n色の外側（赤側）。リモコンなどのセンサーに利用され、放射熱をよく伝える","a":"赤外線"},{"id":"CP-11-125","s":"コアプラス","f":"物理","u":["夏3"],"q":"［　　］に入る言葉は?\n紫外線：紫側。［　　］作用があるが、皮膚がん・白内障の原因。太陽光の紫外線はオゾン層に多く吸収される","a":"殺菌"},{"id":"CP-11-126","s":"コアプラス","f":"物理","u":["夏3"],"q":"［　　］に入る言葉は?\n紫外線：紫側。殺菌作用があるが、皮膚がん・白内障の原因。太陽光の紫外線は［　　］に多く吸収される","a":"オゾン層"},{"id":"CP-11-127","s":"コアプラス","f":"物理","u":["夏3"],"q":"［　　］に入る言葉は?\n真空中の光の速さは［　　］＝1秒間に地球を約7.5周","a":"毎秒30万km"},{"id":"CP-11-128","s":"コアプラス","f":"物理","u":["夏3"],"q":"［　　］に入る言葉は?\n棒の影ができるのは光の［　　］による","a":"直進"},{"id":"CP-11-129","s":"コアプラス","f":"物理","u":["夏3"],"q":"［　　］に入る言葉は?\n面積16倍にするには距離［　　］／明るさ4倍にするには距離1/2倍","a":"4倍（40cm）"},{"id":"CP-11-130","s":"コアプラス","f":"物理","u":["夏3"],"q":"次の説明にあてはまる言葉は?\n像は上下左右が逆（うしろからのぞくと左右はそのまま見える点に注意）","a":"ピンホールカメラ"},{"id":"CP-11-131","s":"コアプラス","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n鏡を［　　］回転させると、反射光の進む方向は20度ずれる（2倍）","a":"10度"},{"id":"CP-11-132","s":"コアプラス","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n鏡を10度回転させると、反射光の進む方向は［　　］ずれる（2倍）","a":"20度"},{"id":"CP-11-133","s":"コアプラス","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n鏡にうつる像は鏡に対して線対称の位置。像と実物を結んだ線は鏡の面と［　　］で、距離が等しい","a":"垂直"},{"id":"CP-11-134","s":"コアプラス","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n全身をうつすのに必要な鏡の高さは［　　］（140cmなら70cm）。距離を2倍にしても必要な高さは1倍（変わらない）","a":"身長の半分"},{"id":"CP-11-135","s":"コアプラス","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n直角に組んだ2枚の鏡では、入射光と反射光が必ず［　　］になる（自転車や道路の反射板に利用）","a":"平行"},{"id":"CP-11-136","s":"コアプラス","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n直角に組んだ2枚の鏡では、入射光と反射光が必ず平行になる（［　　］に利用）","a":"自転車や道路の反射板"},{"id":"CP-11-137","s":"コアプラス","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n合わせ鏡：像の数＝［　　］。90度なら3つ、60度なら5つ","a":"360度÷合わせ鏡の角度−1"},{"id":"CP-11-138","s":"コアプラス","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n合わせ鏡：像の数＝360度÷合わせ鏡の角度−1。90度なら3つ、60度なら［　　］","a":"5つ"},{"id":"CP-11-139","s":"コアプラス","f":"物理","u":["冬3"],"q":"［　　］に入る言葉は?\n音の高低＝振動数の多少。高い音は振動数が多い。単位は［　　］（1秒間に振動する数）","a":"Hz"},{"id":"CP-11-140","s":"コアプラス","f":"物理","u":["冬3"],"q":"［　　］に入る言葉は?\n人の耳に聞こえるのは約20Hz〜20000Hz。それを超える音が［　　］（魚群探知機、胎児のエコー検査）","a":"超音波"},{"id":"CP-11-141","s":"コアプラス","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n音孔を指で押さえて吹くと、振動する空気の長さが長くなり低い音","a":"リコーダー"},{"id":"CP-11-142","s":"コアプラス","f":"物理","u":["冬3"],"q":"［　　］に入る言葉は?\n試験管をふえのように吹く：振動するのは［　　］。空気の長さが短い方が高い音","a":"試験管の中の空気"},{"id":"CP-11-143","s":"コアプラス","f":"物理","u":["冬3"],"q":"［　　］に入る言葉は?\n気温15℃で音が空気中を伝わる速さは［　　］。気温が高いほど速い（+1℃で毎秒0.6m）","a":"毎秒340m"},{"id":"CP-11-144","s":"コアプラス","f":"物理","u":["冬3"],"q":"［　　］に入る言葉は?\n気温15℃で音が空気中を伝わる速さは毎秒340m。気温が［　　］ほど速い（+1℃で毎秒0.6m）","a":"高い"},{"id":"CP-11-145","s":"コアプラス","f":"物理","u":["冬3"],"q":"［　　］に入る言葉は?\n音は［　　］を伝えるので、固体>液体>気体の順に速く伝わる","a":"振動"},{"id":"CP-11-146","s":"コアプラス","f":"物理","u":["冬3"],"q":"［　　］に入る言葉は?\n音は振動を伝えるので、［　　］の順に速く伝わる","a":"固体>液体>気体"},{"id":"CP-11-147","s":"コアプラス","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n救急車が近づくとき、音の速さは変わらないが1秒あたりの振動数が多くなるので高い音に聞こえる","a":"ドップラー効果"},{"id":"CPQ-429","s":"コアプラス","f":"物理","u":["夏3"],"q":"棒の影ができる光の性質は?","a":"直進"},{"id":"CPQ-437","s":"コアプラス","f":"物理","u":["夏3"],"q":"鏡を10度回転させると反射光は何度ずれるか?","a":"20度"},{"id":"CPQ-451","s":"コアプラス","f":"物理","u":["夏3"],"q":"花火で音が遅れる理由は?","a":"光の進む速さに比べて音の伝わる速さが遅いから"},{"id":"CP-12-151","s":"コアプラス","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n全身に血液を送り出すポンプ＝［　　］／けいれんでしゃっくり＝横隔膜","a":"心臓"},{"id":"CP-12-152","s":"コアプラス","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n全身に血液を送り出すポンプ＝心臓／けいれんでしゃっくり＝［　　］","a":"横隔膜"},{"id":"CP-12-153","s":"コアプラス","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n酸素を取り入れ二酸化炭素を出す＝［　　］／体内で最も大きな器官＝肝臓（アルコールや有害物質を分解）","a":"肺"},{"id":"CP-12-154","s":"コアプラス","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n酸素を取り入れ二酸化炭素を出す＝肺／体内で最も大きな器官＝［　　］（アルコールや有害物質を分解）","a":"肝臓"},{"id":"CP-12-155","s":"コアプラス","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n血液から不要物をこし出し尿をつくる＝［　　］（腰のあたりの背側、握りこぶし大で左右1個ずつ）／尿をためる＝ぼうこう","a":"腎臓"},{"id":"CP-12-156","s":"コアプラス","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n血液から不要物をこし出し尿をつくる＝腎臓（腰のあたりの背側、握りこぶし大で左右1個ずつ）／尿をためる＝［　　］","a":"ぼうこう"},{"id":"CP-12-157","s":"コアプラス","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n胆汁をためる＝［　　］／すい液をつくる＝すい臓／胆汁とすい液が出る＝十二指腸","a":"胆のう"},{"id":"CP-12-158","s":"コアプラス","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n胆汁をためる＝胆のう／すい液をつくる＝［　　］／胆汁とすい液が出る＝十二指腸","a":"すい臓"},{"id":"CP-12-159","s":"コアプラス","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n水分や消化された養分を吸収＝［　　］／吸収しきれなかった水分を吸収し便をつくる＝大腸／数時間たくわえどろどろにする＝胃","a":"小腸"},{"id":"CP-12-160","s":"コアプラス","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n水分や消化された養分を吸収＝小腸／吸収しきれなかった水分を吸収し便をつくる＝［　　］／数時間たくわえどろどろにする＝胃","a":"大腸"},{"id":"CP-12-161","s":"コアプラス","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n1分間の呼吸数は大人の安静時で［　　］、子どもは多い。運動時に増えるのは運動に必要なエネルギーを得るために酸素が多く必要だから","a":"12〜20回"},{"id":"CP-12-162","s":"コアプラス","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n1分間の呼吸数は大人の安静時で12〜20回、子どもは［　　］。運動時に増えるのは運動に必要なエネルギーを得るために酸素が多く必要だから","a":"多い"},{"id":"CP-12-163","s":"コアプラス","f":"生物","u":["18"],"q":"次の説明にあてはまる言葉は?\n肺で酸素を取り込み二酸化炭素を出す／内呼吸（細胞呼吸）＝細胞で行う","a":"外呼吸"},{"id":"CP-12-164","s":"コアプラス","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n三大栄養素（でんぷん・たんぱく質・脂肪）＋ミネラル（無機養分）・ビタミン＝［　　］","a":"五大栄養素"},{"id":"CP-12-165","s":"コアプラス","f":"生物","u":["19"],"q":"［　　］に入る言葉は?\n血液は体重の約1/13。新しい血液がつくられるのは［　　］","a":"骨髄"},{"id":"CP-12-166","s":"コアプラス","f":"生物","u":["19"],"q":"［　　］に入る言葉は?\n血管：大静脈・大動脈・肺動脈・肺静脈。血液の流れは［　　］を見ると分かる","a":"弁"},{"id":"CP-12-167","s":"コアプラス","f":"生物","u":["19"],"q":"［　　］に入る言葉は?\n血液が全身の細胞へ渡すもの＝［　　］／細胞から受け取るもの＝二酸化炭素・不要物","a":"酸素・栄養分"},{"id":"CP-12-168","s":"コアプラス","f":"生物","u":["19"],"q":"［　　］に入る言葉は?\n血液が全身の細胞へ渡すもの＝酸素・栄養分／細胞から受け取るもの＝［　　］","a":"二酸化炭素・不要物"},{"id":"CP-12-169","s":"コアプラス","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\nヒトの骨格：［　　］。骨の数は約200個","a":"頭骨・胸骨・肋骨・背骨・骨盤"},{"id":"CP-12-170","s":"コアプラス","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\nヒトの骨格：頭骨・胸骨・肋骨・背骨・骨盤。骨の数は約［　　］","a":"200個"},{"id":"CP-12-171","s":"コアプラス","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n背骨のつなぎ方＝［　　］／関節でのつなぎ方＝関節／骨の主成分＝リン酸カルシウム","a":"軟骨結合"},{"id":"CP-12-172","s":"コアプラス","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n背骨のつなぎ方＝軟骨結合／関節でのつなぎ方＝関節／骨の主成分＝［　　］","a":"リン酸カルシウム"},{"id":"CP-12-173","s":"コアプラス","f":"生物","u":["18"],"q":"次の説明にあてはまる言葉は?\n骨と骨をつなぐ／けん＝骨と筋肉をつなぐ／軟骨＝関節のクッション","a":"じん帯"},{"id":"CP-12-174","s":"コアプラス","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n腕を曲げるとき、内側の筋肉Xは［　　］、外側のYはゆるむ（筋肉は縮むことはあってものびることはない）","a":"縮み"},{"id":"CP-12-175","s":"コアプラス","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n腕を曲げるとき、内側の筋肉Xは縮み、外側のYは［　　］（筋肉は縮むことはあってものびることはない）","a":"ゆるむ"},{"id":"CP-12-176","s":"コアプラス","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\nヒトの足の［　　］はアーチ構造で重さに耐えやすい。イヌはかかとを地面につけない","a":"土ふまず"},{"id":"CP-12-177","s":"コアプラス","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\nヒトがかかとをつけるのは［　　］のため。骨盤は内臓の重さを支えるためヒトの方が大きくお椀状","a":"直立二足歩行"},{"id":"CP-13-178","s":"コアプラス","f":"生物","u":["28"],"q":"［　　］に入る言葉は?\n水中に産卵する両生類・魚類の卵に殻はなく、受精は［　　］","a":"体外受精"},{"id":"CP-13-179","s":"コアプラス","f":"生物","u":["28"],"q":"［　　］に入る言葉は?\nカエルの卵：［　　］（泡状のかたまり）とヒキガエル（ひも状）","a":"モリアオガエル"},{"id":"CP-13-180","s":"コアプラス","f":"生物","u":["28"],"q":"［　　］に入る言葉は?\nカエルの卵：モリアオガエル（泡状のかたまり）と［　　］（ひも状）","a":"ヒキガエル"},{"id":"CP-13-181","s":"コアプラス","f":"生物","u":["28"],"q":"［　　］に入る言葉は?\nフナの解剖：えらぶた・えら・心臓・浮き袋・卵巣・消化管・［　　］（水圧や水の流れを感じ、天敵や獲物を察知）","a":"側線"},{"id":"CP-13-182","s":"コアプラス","f":"生物","u":["28"],"q":"［　　］に入る言葉は?\n解剖ばさみは先が丸い方を体内に差し込む（内臓を傷つけないため）。魚の心臓は［　　］が流れ、えらに直接つながるのは心室側","a":"心房も心室も静脈血"},{"id":"CP-13-183","s":"コアプラス","f":"生物","u":["29"],"q":"［　　］に入る言葉は?\n節のあるあしを持たない：［　　］（タコ・アサリ・カタツムリ）＋その他","a":"軟体動物"},{"id":"CP-13-184","s":"コアプラス","f":"生物","u":["29"],"q":"［　　］に入る言葉は?\n節足動物は［　　］を持ち、脱皮してからだを大きくする","a":"外骨格"},{"id":"CP-13-185","s":"コアプラス","f":"生物","u":["29"],"q":"［　　］に入る言葉は?\n節足動物は外骨格を持ち、［　　］してからだを大きくする","a":"脱皮"},{"id":"CP-13-186","s":"コアプラス","f":"生物","u":["29"],"q":"［　　］に入る言葉は?\nはねの枚数：ハエ・アブ・カは［　　］、ハチは4枚。はたらきアリははねが4枚（アリはハチの仲間）","a":"2枚"},{"id":"CP-13-187","s":"コアプラス","f":"生物","u":["29"],"q":"［　　］に入る言葉は?\n鳴くのは［　　］。セミは腹をふるわせて鳴く／コオロギ・キリギリスは前ばねをこすり合わせて鳴く（メスをおびき寄せる／なわ張りを主張する）","a":"オス"},{"id":"CP-13-188","s":"コアプラス","f":"生物","u":["29"],"q":"［　　］に入る言葉は?\nセミ：ジリジリジリ＝［　　］／オーシーツクツク＝ツクツクボウシ／カナカナカナ＝ヒグラシ","a":"アブラゼミ"},{"id":"CP-13-189","s":"コアプラス","f":"生物","u":["29"],"q":"［　　］に入る言葉は?\nセミ：ジリジリジリ＝アブラゼミ／オーシーツクツク＝［　　］／カナカナカナ＝ヒグラシ","a":"ツクツクボウシ"},{"id":"CP-13-190","s":"コアプラス","f":"生物","u":["28"],"q":"［　　］に入る言葉は?\nひれ：胸びれ・背びれ・尾びれ・尻びれ・腹びれ。2枚あるのは［　　］","a":"胸びれ・腹びれ"},{"id":"CP-13-191","s":"コアプラス","f":"生物","u":["28"],"q":"［　　］に入る言葉は?\n産卵は［　　］。水温25℃ぐらいで、産卵から11日目頃にふ化","a":"早朝"},{"id":"CP-13-192","s":"コアプラス","f":"生物","u":["夏6"],"q":"［　　］に入る言葉は?\n［　　］：ゾウリムシ・ツボワムシ・ツリガネムシ・アメーバ・ラッパムシ・ミジンコ・ケンミジンコ・クラゲ","a":"動物性"},{"id":"CP-13-193","s":"コアプラス","f":"生物","u":["夏6"],"q":"［　　］に入る言葉は?\n［　　］（視野を広くし、観察するものを見つけやすくするため）。接眼レンズは短い方が低倍率、対物レンズは短い方が低倍率","a":"低倍率から使う"},{"id":"CP-13-194","s":"コアプラス","f":"生物","u":["夏6"],"q":"［　　］に入る言葉は?\n食う・食われるの関係＝［　　］、網の目状の複雑なつながり＝食物網、捕食者＝天敵","a":"食物連鎖"},{"id":"CP-13-195","s":"コアプラス","f":"生物","u":["夏6"],"q":"［　　］に入る言葉は?\n食う・食われるの関係＝食物連鎖、網の目状の複雑なつながり＝［　　］、捕食者＝天敵","a":"食物網"},{"id":"CP-13-196","s":"コアプラス","f":"生物","u":["夏6"],"q":"［　　］に入る言葉は?\n昼の池：気体X＝［　　］、気体Y＝二酸化炭素。夜になると向きが変わるのはミカヅキモ（A）とE（光合成をやめ呼吸だけになるため）","a":"酸素"},{"id":"CP-13-197","s":"コアプラス","f":"生物","u":["夏6"],"q":"［　　］に入る言葉は?\n昼の池：気体X＝酸素、気体Y＝［　　］。夜になると向きが変わるのはミカヅキモ（A）とE（光合成をやめ呼吸だけになるため）","a":"二酸化炭素"},{"id":"CP-14-198","s":"コアプラス","f":"生物","u":["4"],"q":"［　　］に入る言葉は?\n種子をつくる植物＝［　　］、つくらない植物＝シダ・コケ（胞子でふえる胞子植物）","a":"種子植物"},{"id":"CP-14-199","s":"コアプラス","f":"生物","u":["4"],"q":"［　　］に入る言葉は?\n種子をつくる植物＝種子植物、つくらない植物＝［　　］（胞子でふえる胞子植物）","a":"シダ・コケ"},{"id":"CP-14-200","s":"コアプラス","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\n種子の内部を乾燥から守る／胚＝子葉・幼芽・胚軸・幼根など、成長して植物のからだになる部分","a":"種皮"},{"id":"CP-14-201","s":"コアプラス","f":"生物","u":["4"],"q":"［　　］に入る言葉は?\n［　　］（養分を子葉にたくわえる）：インゲンマメなど双子葉類の多く","a":"無胚乳種子"},{"id":"CP-14-202","s":"コアプラス","f":"生物","u":["6"],"q":"［　　］に入る言葉は?\nオオカナダモ：水を入れた水そうBは光の熱を吸収し水温を一定に保つため。たまる気体Cは［　　］（火のついた線香を入れると激しく燃える）","a":"酸素"},{"id":"CP-14-203","s":"コアプラス","f":"生物","u":["6"],"q":"［　　］に入る言葉は?\nアルコールは緑色、葉は［　　］になる。ヨウ素液で青紫になるのはア・オ（緑色で光が当たった部分）","a":"白色"},{"id":"CP-14-204","s":"コアプラス","f":"生物","u":["7"],"q":"［　　］に入る言葉は?\n根：単子葉類＝［　　］／双子葉類＝主根と側根","a":"ひげ根"},{"id":"CP-14-205","s":"コアプラス","f":"生物","u":["7"],"q":"［　　］に入る言葉は?\n葉脈：単子葉類＝［　　］／双子葉類＝網状脈","a":"平行脈"},{"id":"CP-14-206","s":"コアプラス","f":"生物","u":["7"],"q":"［　　］に入る言葉は?\n葉脈：単子葉類＝平行脈／双子葉類＝［　　］","a":"網状脈"},{"id":"CP-14-207","s":"コアプラス","f":"生物","u":["7"],"q":"［　　］に入る言葉は?\n根の先端：［　　］（水や肥料を吸収）・成長点（細胞分裂して根をのばす）・根冠（成長点を守る）","a":"根毛"},{"id":"CP-14-208","s":"コアプラス","f":"生物","u":["7"],"q":"［　　］に入る言葉は?\n根の先端：根毛（水や肥料を吸収）・成長点（細胞分裂して根をのばす）・［　　］（成長点を守る）","a":"根冠"},{"id":"CP-14-209","s":"コアプラス","f":"生物","u":["7"],"q":"［　　］に入る言葉は?\n茎の断面：［　　］（葉でつくられた養分の通り道）・道管（根で吸収した水や肥料の通り道）・形成層（細胞分裂して茎を太くする）","a":"師管"},{"id":"CP-14-210","s":"コアプラス","f":"生物","u":["7"],"q":"［　　］に入る言葉は?\n茎の断面：師管（葉でつくられた養分の通り道）・［　　］（根で吸収した水や肥料の通り道）・形成層（細胞分裂して茎を太くする）","a":"道管"},{"id":"CP-14-211","s":"コアプラス","f":"生物","u":["33"],"q":"［　　］に入る言葉は?\n花のつくり（外側から）：がく・花びら（花弁）・おしべ（やく＋花糸）・めしべ（柱頭・花柱・子房・胚珠）、［　　］","a":"花たく（花床）"},{"id":"CP-14-212","s":"コアプラス","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\nマツ・ヘチマ・トウモロコシ（裸子植物とウリ科）","a":"単性花"},{"id":"CP-14-213","s":"コアプラス","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\n花があざやかで目立つ／蜜や香りがある。風媒花：花粉が大量／花粉がさらさらして軽い","a":"虫媒花"},{"id":"CP-14-214","s":"コアプラス","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\n冬に咲くツバキ・サザンカ・ビワ（メジロなどが運ぶ）","a":"鳥媒花"},{"id":"CP-14-215","s":"コアプラス","f":"生物","u":["33"],"q":"［　　］に入る言葉は?\n［　　］：アサガオ・イネ・エンドウ","a":"自家受粉"},{"id":"CP-14-216","s":"コアプラス","f":"生物","u":["33"],"q":"［　　］に入る言葉は?\n果実：カキは［　　］が果実（A果実・B種子）、リンゴは花たくが可食部（C花たく・D果実・E種子）。花たくが実になる＝リンゴ・ナシ・イチゴ","a":"子房"},{"id":"CP-14-217","s":"コアプラス","f":"生物","u":["4","5","7","33"],"q":"次の説明にあてはまる言葉は?\n春にまき、夏に咲き、果実ができたあと種子で冬越し。巻きひげは茎が変化したもの","a":"ヘチマ"},{"id":"CP-14-218","s":"コアプラス","f":"生物","u":["4","5","7","33"],"q":"次の説明にあてはまる言葉は?\n気温の変化で開閉。種子でもふえるが、ふつう球根でふえる","a":"チューリップ"},{"id":"G夏1-1","s":"グノーブル","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n酸素には物が燃えるのを助ける性質＝［　　］がある","a":"助燃性"},{"id":"G夏1-2","s":"グノーブル","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\n物が急激に酸素と結びついて、熱や光を出す現象","a":"燃焼"},{"id":"G夏1-3","s":"グノーブル","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n新たに空気（酸素）を送りこまずに強く加熱すること。物質が固体・液体・気体に［　　］される","a":"熱分解"},{"id":"G夏1-4","s":"グノーブル","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\n石炭を蒸し焼きにしたもの。炭素の純度が高く高温で燃焼。鉄鉱石から鉄をつくるのに利用","a":"コークス"},{"id":"G夏1-5","s":"グノーブル","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n酸素が十分＝完全燃焼（二酸化炭素）／酸素が不足＝［　　］（一酸化炭素）","a":"不完全燃焼"},{"id":"G夏1-6","s":"グノーブル","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n酸素が十分＝完全燃焼（二酸化炭素）／酸素が不足＝不完全燃焼（［　　］）","a":"一酸化炭素"},{"id":"G夏1-7","s":"グノーブル","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n一酸化炭素は燃やすと酸素と結びついて二酸化炭素になり、そのとき［　　］をあげる","a":"青白い炎"},{"id":"G夏1-8","s":"グノーブル","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n常温では［　　］（液体）をのぞくすべての金属が固体","a":"水銀"},{"id":"G夏1-9","s":"グノーブル","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n燃えたあとが重くなるのは［　　］","a":"結びついた酸素の分だけ"},{"id":"G夏1-10","s":"グノーブル","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\nしめった空気中で赤茶色。酸素と水のほか食塩水でできやすい。内部まで広がり鉄をぼろぼろにする","a":"鉄の赤さび"},{"id":"G夏1-11","s":"グノーブル","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\n灰白色。1円玉に見られる。うすい膜で内部を守る","a":"アルミニウムのさび"},{"id":"G夏2-12","s":"グノーブル","f":"化学","u":["夏2"],"q":"次の説明にあてはまる言葉は?\n火がついているしんをピンセットで強くはさむと、液体のろうの流れが止められて気体のろうに変われなくなり、やがて火が消える","a":"証明実験2"},{"id":"G夏2-13","s":"グノーブル","f":"化学","u":["夏2"],"q":"［　　］に入る言葉は?\n宇宙船内などの無重力状態では空気の流れが起こらないため、炎は［　　］になりすぐ消えてしまう","a":"丸い形"},{"id":"G夏2-14","s":"グノーブル","f":"化学","u":["夏2"],"q":"［　　］に入る言葉は?\nしんの長さは［　　］、アルコールの量は容器の8分目まで入れる","a":"5mmくらい"},{"id":"G夏2-15","s":"グノーブル","f":"化学","u":["夏2"],"q":"［　　］に入る言葉は?\nしんの長さは5mmくらい、アルコールの量は容器の［　　］まで入れる","a":"8分目"},{"id":"G夏2-16","s":"グノーブル","f":"化学","u":["夏2"],"q":"［　　］に入る言葉は?\n初め空気調節ねじを閉じたままガス調節ねじを回して点火すると［　　］（酸素不足の不完全燃焼、すすが熱せられている）","a":"オレンジ色の炎"},{"id":"G夏2-17","s":"グノーブル","f":"化学","u":["夏2"],"q":"［　　］に入る言葉は?\n初め空気調節ねじを閉じたままガス調節ねじを回して点火するとオレンジ色の炎（酸素不足の［　　］、すすが熱せられている）","a":"不完全燃焼"},{"id":"G夏2-18","s":"グノーブル","f":"化学","u":["夏2"],"q":"［　　］に入る言葉は?\n空気調節ねじを回して空気の量を調節すると、とう明に近い［　　］の明るい内炎と少し暗い外炎に変化（ガスと空気（酸素）がうまく混ざり完全燃焼）","a":"青色"},{"id":"G夏2-19","s":"グノーブル","f":"化学","u":["夏2"],"q":"［　　］に入る言葉は?\n空気調節ねじを回して空気の量を調節すると、とう明に近い青色の明るい内炎と少し暗い外炎に変化（ガスと空気（酸素）がうまく混ざり［　　］）","a":"完全燃焼"},{"id":"G夏3-20","s":"グノーブル","f":"物理","u":["夏3"],"q":"［　　］に入る言葉は?\n混ぜるほど［　　］なり、最後は白（加法混色）","a":"明るく"},{"id":"G夏3-21","s":"グノーブル","f":"物理","u":["夏3"],"q":"［　　］に入る言葉は?\n混ぜるほど［　　］なり、最後は黒（減法混色）","a":"暗く"},{"id":"G夏3-22","s":"グノーブル","f":"物理","u":["夏3"],"q":"［　　］に入る言葉は?\n日食・月食では太陽を［　　］とみて拡散光線で考える","a":"面光源"},{"id":"G夏3-23","s":"グノーブル","f":"物理","u":["夏3"],"q":"［　　］に入る言葉は?\n1秒で約［　　］＝地球を約7周半","a":"30万km"},{"id":"G夏3-24","s":"グノーブル","f":"物理","u":["夏3"],"q":"［　　］に入る言葉は?\n1秒で約30万km＝地球を約［　　］","a":"7周半"},{"id":"G夏3-25","s":"グノーブル","f":"物理","u":["夏3"],"q":"［　　］に入る言葉は?\n1光年＝30万km/秒×60×60×24×365＝約［　　］","a":"9兆4600億km"},{"id":"G夏4-26","s":"グノーブル","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n光がものに当たってはね返ることを［　　］という","a":"反射"},{"id":"G夏4-27","s":"グノーブル","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n鏡に垂直に引いた線を［　　］という","a":"法線"},{"id":"G夏4-28","s":"グノーブル","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n入射光（線）と法線の間の角＝［　　］、反射光（線）と法線の間の角＝反射角","a":"入射角"},{"id":"G夏4-29","s":"グノーブル","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n入射光（線）と法線の間の角＝入射角、反射光（線）と法線の間の角＝［　　］","a":"反射角"},{"id":"G夏4-30","s":"グノーブル","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n鏡像は常に実物と鏡に対して［　　］の位置に見える","a":"線（面）対称"},{"id":"G夏4-31","s":"グノーブル","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n2枚の鏡を平行に、またはいろいろな角度に組み合わせたものを［　　］という","a":"合わせ鏡"},{"id":"G夏4-32","s":"グノーブル","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n2枚の鏡を平行に向かい合わせて置くと、鏡像は［　　］に見える","a":"無数"},{"id":"G夏5-33","s":"グノーブル","f":"物理","u":["夏5"],"q":"［　　］に入る言葉は?\n光は空気・水・ガラスなど同じ物質の中では直進するが、性質のちがう物質の境目にななめに入ると進む方向が変わる。この現象を［　　］という","a":"光の屈折"},{"id":"G夏5-34","s":"グノーブル","f":"物理","u":["夏5"],"q":"［　　］に入る言葉は?\n水中から空気中へ進むとき：光は水面に近づくように進み、［　　］という関係が成り立つ","a":"屈折角＞入射角"},{"id":"G夏5-35","s":"グノーブル","f":"物理","u":["夏5"],"q":"次の説明にあてはまる言葉は?\n反対方向から光を当てても全く同じ道すじを通る。これにより、鏡による反射と同様、自分から相手が見えた場合は相手からも自分が見えている","a":"光の逆進性"},{"id":"G夏5-36","s":"グノーブル","f":"物理","u":["夏5"],"q":"［　　］に入る言葉は?\n人間の目で見ることができるさまざまな色の光を［　　］という","a":"可視光線"},{"id":"G夏5-37","s":"グノーブル","f":"物理","u":["夏5"],"q":"次の説明にあてはまる言葉は?\n紫色の光より屈折しやすい光（波長が短い）。殺菌作用があるが、皮ふの日焼けや皮ふガンの原因にもなる。オゾン層がよく吸収している","a":"紫外線"},{"id":"G夏5-38","s":"グノーブル","f":"物理","u":["夏5"],"q":"［　　］に入る言葉は?\n昼間の空が青く見えるのは、太陽の光が地上にとどくまでの間に大気中の小さなつぶにぶつかって、散乱されやすい［　　］の光が目にとどくため","a":"青〜紫色"},{"id":"G夏5-39","s":"グノーブル","f":"物理","u":["夏5"],"q":"［　　］に入る言葉は?\n虹は太陽の光が空気中の水のつぶに反射されて見えるので、太陽は虹を見ている人の背中側に必ずあり、虹が見られるのは太陽の高さが低い［　　］","a":"朝や夕方"},{"id":"G夏5-40","s":"グノーブル","f":"物理","u":["夏5"],"q":"［　　］に入る言葉は?\n光が1点に集まる点を［　　］、とつレンズから焦点までの長さを焦点きょりという","a":"焦点（F）"},{"id":"G夏5-41","s":"グノーブル","f":"物理","u":["夏5"],"q":"［　　］に入る言葉は?\n光が1点に集まる点を焦点（F）、とつレンズから焦点までの長さを［　　］という","a":"焦点きょり"},{"id":"G夏5-42","s":"グノーブル","f":"物理","u":["夏5"],"q":"［　　］に入る言葉は?\n物体を焦点きょりの2倍の位置（2F）に置いた場合：焦点きょり2倍の位置に、実物と同じ大きさの、［　　］ができる","a":"倒立の実像"},{"id":"G夏6-43","s":"グノーブル","f":"生物","u":["夏6"],"q":"［　　］に入る言葉は?\n水中や水面をただよって、水の流れのままに生活している生物を［　　］という","a":"プランクトン"},{"id":"G夏6-44","s":"グノーブル","f":"生物","u":["夏6"],"q":"次の説明にあてはまる言葉は?\n植物と同じように葉緑体（葉緑素）をもち、光合成を行う。自分で動くことはできない","a":"植物プランクトン"},{"id":"G夏6-45","s":"グノーブル","f":"生物","u":["夏6"],"q":"次の説明にあてはまる言葉は?\n葉緑体をもたず光合成を行うことができないので、おもに植物プランクトンを食べて生活している","a":"動物プランクトン"},{"id":"G夏6-46","s":"グノーブル","f":"生物","u":["夏6"],"q":"次の説明にあてはまる言葉は?\nつり合いが一時的にくずれても、しばらくすると元の状態にもどる","a":"個体数の調節"},{"id":"G夏6-47","s":"グノーブル","f":"生物","u":["夏6"],"q":"［　　］に入る言葉は?\nメダカのからだになっていく部分を［　　］といい、卵の中でメダカが育つための養分となるのが卵黄と油のつぶ（油てき・油球）","a":"胚盤（胚）"},{"id":"G夏6-48","s":"グノーブル","f":"生物","u":["夏6"],"q":"［　　］に入る言葉は?\nメダカのからだになっていく部分を胚盤（胚）といい、卵の中でメダカが育つための養分となるのが［　　］と油のつぶ（油てき・油球）","a":"卵黄"},{"id":"G夏7-49","s":"グノーブル","f":"物理","u":["夏7"],"q":"［　　］に入る言葉は?\n電流を起こす力のことを［　　］という","a":"電圧"},{"id":"G夏7-50","s":"グノーブル","f":"物理","u":["夏7"],"q":"［　　］に入る言葉は?\n豆電球より下の通り道で電気の流れをじゃますものがなく、矢印の向きだけに電流が流れて、豆電球はつかない場合を［　　］という","a":"ショート"},{"id":"G17-51","s":"グノーブル","f":"生物","u":["17"],"q":"次の説明にあてはまる言葉は?\n食べ物を水に溶けやすく、からだに吸収されやすい形に分解するはたらき","a":"消化"},{"id":"G17-52","s":"グノーブル","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\nそのまま吸収できる：［　　］。分解が必要：でんぷん・タンパク質・しぼう","a":"ビタミン・ミネラル・水分"},{"id":"G17-53","s":"グノーブル","f":"生物","u":["17"],"q":"次の説明にあてはまる言葉は?\n消化管＋肝臓・たんのう・すい臓（消化管ではないが消化に関係する）","a":"消化器官"},{"id":"G17-54","s":"グノーブル","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n三大栄養素＝でんぷん（炭水化物）・タンパク質・しぼう。五大栄養素＝三大栄養素＋［　　］","a":"ビタミン・ミネラル"},{"id":"G17-55","s":"グノーブル","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n消化液＝栄養を消化する液。［　　］＝消化液の中にあって栄養を消化する物質","a":"消化酵素"},{"id":"G17-56","s":"グノーブル","f":"生物","u":["17"],"q":"次の説明にあてはまる言葉は?\n肝臓でつくられ、たんのうにたくわえられる。消化酵素なし。乳化作用でしぼうのつぶを細かくし水と混ざりやすくする","a":"たん液（たん汁）"},{"id":"G17-57","s":"グノーブル","f":"生物","u":["17"],"q":"次の説明にあてはまる言葉は?\nリンパ管に入りゆっくり運ばれ、胸のあたり（胸管）で血液に合流。一部は皮下しぼうになる","a":"しぼう酸・モノグリセリド"},{"id":"G17-58","s":"グノーブル","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n試薬：［　　］＝でんぷんがあると青紫色／ベネジクト液＝糖があると加熱で赤かっ色の沈でん","a":"ヨウ素液"},{"id":"G17-59","s":"グノーブル","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n試薬：ヨウ素液＝でんぷんがあると青紫色／［　　］＝糖があると加熱で赤かっ色の沈でん","a":"ベネジクト液"},{"id":"G18-60","s":"グノーブル","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\nヒトのからだはおよそ［　　］の骨が組み合わさった骨格で支えられ、からだの内側にあるので内骨格","a":"200個"},{"id":"G18-61","s":"グノーブル","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\nヒトのからだはおよそ200個の骨が組み合わさった骨格で支えられ、からだの内側にあるので［　　］","a":"内骨格"},{"id":"G18-62","s":"グノーブル","f":"生物","u":["18"],"q":"次の説明にあてはまる言葉は?\nヒト・イヌ・鳥・トカゲ・カエル・魚など。背骨中心の内骨格","a":"セキツイ動物"},{"id":"G18-63","s":"グノーブル","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n骨は骨のまわりの筋肉＝［　　］ののびちぢみで動く。筋肉と骨をつなぐかたいすじがけん","a":"骨格筋"},{"id":"G18-64","s":"グノーブル","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n骨は骨のまわりの筋肉＝骨格筋ののびちぢみで動く。筋肉と骨をつなぐかたいすじが［　　］","a":"けん"},{"id":"G18-65","s":"グノーブル","f":"生物","u":["18"],"q":"次の説明にあてはまる言葉は?\n内呼吸に必要な酸素を体内に取り入れ、内呼吸で出た二酸化炭素を体外に放出するはたらき（息を吸う・はく）","a":"外呼吸"},{"id":"G18-66","s":"グノーブル","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n肺は筋肉ではないので自分でふくらんだりちぢんだりできない。肺をつつむ部屋＝［　　］を広げたりせまくしたりして動かす＝呼吸運動","a":"胸腔（きょうくう）"},{"id":"G18-67","s":"グノーブル","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n肺は筋肉ではないので自分でふくらんだりちぢんだりできない。肺をつつむ部屋＝胸腔（きょうくう）を広げたりせまくしたりして動かす＝［　　］","a":"呼吸運動"},{"id":"G18-68","s":"グノーブル","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n肺の中は気管支がさらに細かく枝分かれし、先に［　　］という小さなふくろが3億〜8億個","a":"肺胞"},{"id":"G18-69","s":"グノーブル","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n肺の中は気管支がさらに細かく枝分かれし、先に肺胞という小さなふくろが［　　］","a":"3億〜8億個"},{"id":"G18-70","s":"グノーブル","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n肺胞は［　　］に取りまかれ、肺胞内の空気と血液の間で酸素と二酸化炭素の交換","a":"毛細血管"},{"id":"G18-71","s":"グノーブル","f":"生物","u":["18"],"q":"次の説明にあてはまる言葉は?\n酸素を多くふくむ血液／静脈血＝二酸化炭素を多くふくむ血液","a":"動脈血"},{"id":"G19-72","s":"グノーブル","f":"生物","u":["19"],"q":"［　　］に入る言葉は?\n血液を全身に送るポンプの役割をする器官が心臓。心臓は［　　］という筋肉でできている","a":"心筋"},{"id":"G19-73","s":"グノーブル","f":"生物","u":["19"],"q":"［　　］に入る言葉は?\n大きさはにぎりこぶしくらい。2つの肺にはさまれる［　　］、横隔膜の上にある","a":"胸の中央から少しだけ左"},{"id":"G19-74","s":"グノーブル","f":"生物","u":["19"],"q":"［　　］に入る言葉は?\n大きさはにぎりこぶしくらい。2つの肺にはさまれる胸の中央から少しだけ左、［　　］にある","a":"横隔膜の上"},{"id":"G19-75","s":"グノーブル","f":"生物","u":["19"],"q":"次の説明にあてはまる言葉は?\n酸素を多くふくむ血液／静脈血＝酸素が少なく二酸化炭素を多くふくむ血液","a":"動脈血"},{"id":"G19-76","s":"グノーブル","f":"生物","u":["19"],"q":"［　　］に入る言葉は?\nこの動きを拍動。心室が収縮すると血管のかべに圧力（［　　］）がかかり、動脈に伝わる拍動が脈拍","a":"血圧"},{"id":"G19-77","s":"グノーブル","f":"生物","u":["19"],"q":"［　　］に入る言葉は?\nこの動きを拍動。心室が収縮すると血管のかべに圧力（血圧）がかかり、動脈に伝わる拍動が［　　］","a":"脈拍"},{"id":"G19-78","s":"グノーブル","f":"生物","u":["19"],"q":"次の説明にあてはまる言葉は?\n胃・小腸・大腸・心臓などをつくる筋肉。意志で動かせず、つかれにくい","a":"内臓筋"},{"id":"G20-79","s":"グノーブル","f":"化学","u":["20"],"q":"［　　］に入る言葉は?\n物質が水に溶けている液体を［　　］という","a":"水溶液"},{"id":"G20-80","s":"グノーブル","f":"化学","u":["20"],"q":"次の説明にあてはまる言葉は?\n液体に溶けていない固体を、ろ紙を通して液体と固体に分ける方法","a":"ろ過"},{"id":"G20-81","s":"グノーブル","f":"化学","u":["20"],"q":"［　　］に入る言葉は?\n液体を加熱して気体にし、それを冷やして再び液体として集めることを［　　］という","a":"蒸留"},{"id":"G22-82","s":"グノーブル","f":"地学","u":["22"],"q":"［　　］に入る言葉は?\n風化＝岩石が長い年月、日光・空気・風雨にさらされて細かくくずれたり変化したりすること。その働きが［　　］","a":"風化作用"},{"id":"G22-83","s":"グノーブル","f":"地学","u":["22"],"q":"次の説明にあてはまる言葉は?\n上流でしん食作用により川底が深くけずられてできたV字形の谷","a":"V字谷"},{"id":"G22-84","s":"グノーブル","f":"地学","u":["22"],"q":"次の説明にあてはまる言葉は?\n中流〜下流で流れがおそいため蛇行。蛇行が激しくなり洪水などで川すじがまっすぐになったあと、取り残された部分が三日月湖","a":"蛇行・三日月湖"},{"id":"G22-85","s":"グノーブル","f":"地学","u":["22"],"q":"［　　］に入る言葉は?\n水によって粒が大きさごとにふり分けられることを［　　］という","a":"分級作用"},{"id":"G22-86","s":"グノーブル","f":"地学","u":["22"],"q":"次の説明にあてはまる言葉は?\nがけや切り通しなどで見られる、れき・砂・泥などの層が積み重なったしまもよう","a":"地層"},{"id":"G22-87","s":"グノーブル","f":"地学","u":["22"],"q":"［　　］に入る言葉は?\nほとんどは流水によって運ばれた土砂・生物の死がい・火山灰が［　　］で積み重なってできたもの。土地全体が隆起して陸上で見られるようになる","a":"海底や湖底"},{"id":"G22-88","s":"グノーブル","f":"地学","u":["22"],"q":"［　　］に入る言葉は?\nほとんどは流水によって運ばれた土砂・生物の死がい・火山灰が海底や湖底で積み重なってできたもの。土地全体が［　　］して陸上で見られるようになる","a":"隆起"},{"id":"G22-89","s":"グノーブル","f":"地学","u":["22"],"q":"［　　］に入る言葉は?\nたい積物は長い年月おし固められて岩石（［　　］）になる","a":"たい積岩"},{"id":"G22-90","s":"グノーブル","f":"地学","u":["22"],"q":"［　　］に入る言葉は?\n地上に降った水の一部は地中にしみこむ。粒の大きい層は水を通しやすく、粒の小さい泥などの層は水を通しにくいので、その上に水がたまる＝［　　］","a":"地下水"},{"id":"G22-91","s":"グノーブル","f":"地学","u":["22"],"q":"［　　］に入る言葉は?\n地下水が地層のすき間からわき出たもの＝［　　］","a":"泉（わき水）"},{"id":"G22-92","s":"グノーブル","f":"地学","u":["22"],"q":"次の説明にあてはまる言葉は?\n泥岩に強い圧力。うすい板状にはがれるように割れる。ケツ岩の層にはシェールガス・シェールオイル。ネンバン岩はすずりの材料","a":"ケツ岩・ネンバン岩"},{"id":"G22-93","s":"グノーブル","f":"地学","u":["22"],"q":"次の説明にあてはまる言葉は?\n石灰岩がマグマの熱を受けてできる。彫刻・建造物に利用","a":"大理石（結晶質石灰岩）"},{"id":"G22-94","s":"グノーブル","f":"地学","u":["22"],"q":"［　　］に入る言葉は?\nこれらのように、ある岩石が熱や圧力で変化してできた岩石が［　　］","a":"変成岩"},{"id":"G22-95","s":"グノーブル","f":"地学","u":["22"],"q":"［　　］に入る言葉は?\n川底が周囲の土地より高い川。［　　］に多い","a":"谷の出口（扇状地）"},{"id":"G13-96","s":"グノーブル","f":"物理","u":["13"],"q":"次の説明にあてはまる言葉は?\nてこを支える点。回転運動の中心で動かない","a":"支点"},{"id":"G13-97","s":"グノーブル","f":"物理","u":["13"],"q":"次の説明にあてはまる言葉は?\nてこに力を加える点","a":"力点"},{"id":"G13-98","s":"グノーブル","f":"物理","u":["13"],"q":"次の説明にあてはまる言葉は?\nてこに加えた力が物にはたらく点","a":"作用点"},{"id":"G13-99","s":"グノーブル","f":"物理","u":["13"],"q":"次の説明にあてはまる言葉は?\n2種類のてこの組み合わせ。上のてこ＝作用点が間（力を強める）、下のてこ＝力点が間（動きを大きくする）","a":"つめ切り"},{"id":"G13-100","s":"グノーブル","f":"物理","u":["13"],"q":"［　　］に入る言葉は?\n［　　］なところに置く。皿はうでの番号に合わせてのせる","a":"水平"},{"id":"G13-101","s":"グノーブル","f":"物理","u":["13"],"q":"［　　］に入る言葉は?\nつり合いは、針が目盛り板の中央から左右に同じはばでふれているかで確かめる（止まるまで待たなくてよい）。つり合っていなければ［　　］で合わせる","a":"調節ねじ"},{"id":"G13-102","s":"グノーブル","f":"物理","u":["13"],"q":"［　　］に入る言葉は?\n分銅は［　　］で扱う（手でさわると汚れたりさびたりして重さが変わるから）。重い方から順にのせる（あげおろしの回数を減らすため）","a":"必ずピンセット"},{"id":"G13-103","s":"グノーブル","f":"物理","u":["13"],"q":"［　　］に入る言葉は?\n物の重さをはかるとき（右ききの人）：はかりたい物を［　　］の皿、分銅を右の皿","a":"左"},{"id":"G14-104","s":"グノーブル","f":"物理","u":["14"],"q":"次の説明にあてはまる言葉は?\n物体全体の重さが集まっていると考えられる点。そこを支えると水平につり合う","a":"重心"},{"id":"G14-105","s":"グノーブル","f":"物理","u":["14"],"q":"［　　］に入る言葉は?\n太さが一様な棒：重心は棒の［　　］","a":"真ん中"},{"id":"G14-106","s":"グノーブル","f":"物理","u":["14"],"q":"［　　］に入る言葉は?\nばねはかり／支点が［　　］に支えている場合、その値＝おもりの重さの合計＋棒の重さ（支点が間にあるとき）","a":"上向き"},{"id":"G14-107","s":"グノーブル","f":"物理","u":["14"],"q":"次の説明にあてはまる言葉は?\n皿に何ものせないときのつり合い位置","a":"0gの目盛り"},{"id":"G15-108","s":"グノーブル","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\n恒星：自ら光っている星（太陽など）。星座は恒星がつくる。［　　］。天球上で位置関係が変わらないので「恒（つね）の星」","a":"88の星座"},{"id":"G15-109","s":"グノーブル","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\n肉眼でやっと見える暗い星が［　　］、とくに明るい21個が1等星","a":"6等星"},{"id":"G15-110","s":"グノーブル","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\n肉眼でやっと見える暗い星が6等星、とくに明るい［　　］が1等星","a":"21個"},{"id":"G15-111","s":"グノーブル","f":"地学","u":["15"],"q":"次の説明にあてはまる言葉は?\nデネブ（はくちょう座・白）・ベガ（こと座・白）・アルタイル（わし座・白）。3つとも白色の1等星で、天頂近くの天の川にある","a":"夏の大三角"},{"id":"G15-112","s":"グノーブル","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\nはくちょう座：大きな十文字（北十字星）。天の川の［　　］。デネブは天頂よりも北側を通る","a":"真ん中"},{"id":"G15-113","s":"グノーブル","f":"地学","u":["15"],"q":"次の説明にあてはまる言葉は?\n天の川の中。アルタイル＝七夕のひこ星（牽牛星）。ベガやデネブより低い位置の南の空を通る（大三角で最も南より）","a":"わし座"},{"id":"G15-114","s":"グノーブル","f":"地学","u":["15"],"q":"次の説明にあてはまる言葉は?\nシリウス（おおいぬ座・白／全天で最も明るい恒星）・プロキオン（こいぬ座・黄）・ベテルギウス（オリオン座・赤）。正三角形に近い","a":"冬の大三角"},{"id":"G15-115","s":"グノーブル","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\nペガスス座が目立つ。ペガスス座の3つの星＋アンドロメダ座の1つで［　　］","a":"秋の四辺形"},{"id":"G16-116","s":"グノーブル","f":"地学","u":["16"],"q":"［　　］に入る言葉は?\n地球から［　　］と非常に遠いため、地軸とのずれは無視できるほど小さい","a":"430光年"},{"id":"G16-117","s":"グノーブル","f":"地学","u":["16"],"q":"［　　］に入る言葉は?\n北半球でしか見えない。［　　］。東京（北緯36°）で36°、北極（90°）で頭の真上、赤道（0°）で地平線上","a":"北極星の高度＝観測地点の緯度"},{"id":"G16-118","s":"グノーブル","f":"地学","u":["16"],"q":"［　　］に入る言葉は?\n北斗七星とカシオペヤ座は北極星をはさんで［　　］、約150°離れている。冬（2月）にはカシオペヤ座が北極星の右にくる","a":"反対側"},{"id":"G16-119","s":"グノーブル","f":"地学","u":["16"],"q":"次の説明にあてはまる言葉は?\n地球を中心とした、地球よりはるかに大きい球。星はその内側にはりついて動いて見える","a":"天球"},{"id":"G16-120","s":"グノーブル","f":"地学","u":["16"],"q":"［　　］に入る言葉は?\n地軸を北極方向にのばして天球とぶつかるところ＝［　　］（この先に北極星）。南極方向＝天の南極。赤道を広げて天球とぶつかるところ＝天の赤道","a":"天の北極"},{"id":"G16-121","s":"グノーブル","f":"地学","u":["16"],"q":"［　　］に入る言葉は?\n地軸を北極方向にのばして天球とぶつかるところ＝天の北極（この先に北極星）。南極方向＝［　　］。赤道を広げて天球とぶつかるところ＝天の赤道","a":"天の南極"},{"id":"G16-122","s":"グノーブル","f":"地学","u":["16"],"q":"［　　］に入る言葉は?\n原因＝地球が地軸を中心に1日1回、西から東へ（反時計回りに）自転しているため。360÷24＝［　　］","a":"15°/時"},{"id":"G16-123","s":"グノーブル","f":"地学","u":["16"],"q":"次の説明にあてはまる言葉は?\n北極星を中心に反時計回りに1か月30°","a":"北の空"},{"id":"G16-124","s":"グノーブル","f":"地学","u":["16"],"q":"次の説明にあてはまる言葉は?\n東から西へ（時計回り）に1か月30°。そのため南中時刻は1か月に2時間ずつ（1日に約4分ずつ）早くなる","a":"南の空"},{"id":"G16-125","s":"グノーブル","f":"地学","u":["16"],"q":"［　　］に入る言葉は?\n原因＝地球が1年で太陽のまわりを1回［　　］しているため。360÷12＝30°／360÷365≒1°","a":"公転"},{"id":"G16-126","s":"グノーブル","f":"地学","u":["16"],"q":"次の説明にあてはまる言葉は?\n黄道（太陽の見かけの通り道）の上にある12星座。太陽の反対側にある星座を夜に見る。太陽方向の星座は昼にあたり、明るすぎて見えない","a":"黄道十二星座"},{"id":"G16-127","s":"グノーブル","f":"地学","u":["16"],"q":"［　　］に入る言葉は?\n1時間＝15°／1か月＝30°。北の空は［　　］が「すすむ」、南の空は時計回りが「すすむ」","a":"反時計回り"},{"id":"G16-128","s":"グノーブル","f":"地学","u":["16"],"q":"［　　］に入る言葉は?\n［　　］。角度を出したら「何時間分か／何か月分か」に換算する","a":"30°＝1か月＝2時間"},{"id":"G16-129","s":"グノーブル","f":"地学","u":["16"],"q":"次の説明にあてはまる言葉は?\n星どうしの間かく 5°・10°・15°・25° を覚えておくと目安になる","a":"北斗七星のものさし"},{"id":"G8-130","s":"グノーブル","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n中に空気（酸素）があるとフィラメントが焼き切れるので、空気をぬいて真空に近い状態にするか、アルゴンなどの不活性ガスを入れる","a":"ガラス球"},{"id":"G8-131","s":"グノーブル","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n口金とへその間に入れ、口金とへそのショートを防ぐ","a":"絶縁体"},{"id":"G8-132","s":"グノーブル","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n回路をつくりやすくするための部品。だから豆電球の口金はねじになっている","a":"ソケット"},{"id":"G8-133","s":"グノーブル","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n光エネルギーを電気エネルギーに変える。光があればいつまでも使える。電卓・人工衛星に利用。二酸化炭素や有害物質を出さない","a":"光電池（太陽電池）"},{"id":"G8-134","s":"グノーブル","f":"物理","u":["8"],"q":"［　　］に入る言葉は?\n導線でつなぐこと＝配線、電気の通り道＝［　　］","a":"回路"},{"id":"G9-135","s":"グノーブル","f":"物理","u":["9"],"q":"［　　］に入る言葉は?\n導線に電流を流すと、導線を中心とした［　　］ができる","a":"同心円状の磁界"},{"id":"G9-136","s":"グノーブル","f":"物理","u":["9"],"q":"次の説明にあてはまる言葉は?\n右手の親指を電流の向きに合わせ、残り4本の指で導線をつかむと、4本の指の向きが磁界の向き","a":"右ねじの法則"},{"id":"G9-137","s":"グノーブル","f":"物理","u":["9"],"q":"［　　］に入る言葉は?\nふれが大きくなる：導線を方位磁針に［　　］と上下を流れる電流の磁力が強め合うため","a":"まきつける"},{"id":"G9-138","s":"グノーブル","f":"物理","u":["9"],"q":"［　　］に入る言葉は?\nふれが大きくなる：導線を方位磁針にまきつけると上下を流れる電流の磁力が［　　］ため","a":"強め合う"},{"id":"G10-139","s":"グノーブル","f":"物理","u":["10"],"q":"［　　］に入る言葉は?\n円形の導線に電流を流すと、円の内と外で磁界の向きは逆、2つの導線にはさまれた（円の内側の）部分は［　　］になり磁力を強め合う","a":"同じ向き"},{"id":"G10-140","s":"グノーブル","f":"物理","u":["10"],"q":"［　　］に入る言葉は?\nコイルに［　　］の鉄心を入れて電流を流すと、コイルだけのときより磁力が強くなる。これが電磁石。強くなるのは鉄心自体も磁石になるため","a":"軟鉄"},{"id":"G10-141","s":"グノーブル","f":"物理","u":["10"],"q":"［　　］に入る言葉は?\nコイルに軟鉄の鉄心を入れて電流を流すと、コイルだけのときより磁力が強くなる。これが［　　］。強くなるのは鉄心自体も磁石になるため","a":"電磁石"},{"id":"G11-142","s":"グノーブル","f":"地学","u":["11"],"q":"［　　］に入る言葉は?\n月の直径は約［　　］。地球の直径は月の約4倍、太陽の直径は月の約400倍","a":"3500km"},{"id":"G11-143","s":"グノーブル","f":"地学","u":["11"],"q":"［　　］に入る言葉は?\n地球—月は約［　　］、地球—太陽は約1億5000万km＝月までの約400倍","a":"38万km"},{"id":"G11-144","s":"グノーブル","f":"地学","u":["11"],"q":"［　　］に入る言葉は?\n地球—月は約38万km、地球—太陽は約［　　］＝月までの約400倍","a":"1億5000万km"},{"id":"G11-145","s":"グノーブル","f":"地学","u":["11"],"q":"［　　］に入る言葉は?\n月の重力は地球の約1/6。地球で体重60kgの人は月面の体重計で［　　］を示す","a":"10kg"},{"id":"G11-146","s":"グノーブル","f":"地学","u":["11"],"q":"［　　］に入る言葉は?\nただし［　　］で60gの物体をはかると月面でも60g（分銅も1/6になるため）","a":"上皿てんびん"},{"id":"G11-147","s":"グノーブル","f":"地学","u":["11"],"q":"［　　］に入る言葉は?\n白く見える部分＝クレーターが多い部分／黒く見える平らな部分＝［　　］（水はない）","a":"「海」"},{"id":"G11-148","s":"グノーブル","f":"地学","u":["11"],"q":"［　　］に入る言葉は?\n三日月は太陽がしずんだあと［　　］に見え、欠けた部分がうっすら光る地球照が見えることがある","a":"南西〜西の空"},{"id":"G11-149","s":"グノーブル","f":"地学","u":["11"],"q":"［　　］に入る言葉は?\n三日月は太陽がしずんだあと南西〜西の空に見え、欠けた部分がうっすら光る［　　］が見えることがある","a":"地球照"},{"id":"G11-150","s":"グノーブル","f":"地学","u":["11"],"q":"［　　］に入る言葉は?\n［　　］は太陽の上の端が地平線に接するとき、月の出・月の入りは月の中心が地平線に重なるとき","a":"日の出・日の入り"},{"id":"G11-151","s":"グノーブル","f":"地学","u":["11"],"q":"［　　］に入る言葉は?\n日の出・日の入りは太陽の上の端が地平線に接するとき、［　　］は月の中心が地平線に重なるとき","a":"月の出・月の入り"},{"id":"G12-152","s":"グノーブル","f":"地学","u":["12"],"q":"［　　］に入る言葉は?\n満ち欠けの周期約29.5日で360°動くので、1日あたり 360÷29.5≒［　　］にうつる","a":"12°ずつ西から東"},{"id":"G12-153","s":"グノーブル","f":"地学","u":["12"],"q":"次の説明にあてはまる言葉は?\n距離が遠く月が小さく見えるとき、太陽のふちが輪に見える","a":"金環日食"},{"id":"G12-154","s":"グノーブル","f":"地学","u":["12"],"q":"［　　］に入る言葉は?\n［　　］になる理由：地球の大気を通るとき青色に近い光は散乱され、赤色に近い光が残って屈折し、月面を照らすため","a":"赤銅色"},{"id":"G1-155","s":"グノーブル","f":"化学","u":["1"],"q":"［　　］に入る言葉は?\nろ過＝液体に［　　］をろ紙で分ける操作。用具＝ろうと・ろうと台・ろ紙・ビーカー・ガラス棒","a":"溶けていない固体"},{"id":"G1-156","s":"グノーブル","f":"化学","u":["1"],"q":"次の説明にあてはまる言葉は?\n塩化水素（刺激臭）／炭酸水＝二酸化炭素（無臭。石灰水と混ぜると白くにごる）／アンモニア水＝アンモニア（刺激臭）","a":"塩酸"},{"id":"G2-157","s":"グノーブル","f":"化学","u":["2"],"q":"［　　］に入る言葉は?\n［　　］（無色・無臭）＝気体の二酸化炭素。石灰水と混ぜると炭酸カルシウムができ白くにごる","a":"炭酸水"},{"id":"G2-158","s":"グノーブル","f":"化学","u":["2"],"q":"［　　］に入る言葉は?\n炭酸水（無色・無臭）＝気体の［　　］。石灰水と混ぜると炭酸カルシウムができ白くにごる","a":"二酸化炭素"},{"id":"G2-159","s":"グノーブル","f":"化学","u":["2"],"q":"［　　］に入る言葉は?\n［　　］（無色・刺激臭）＝液体の酢酸。石灰石・重そうから二酸化炭素。食酢の成分でタンパク質を固める（魚の煮くずれ防止・生臭さ消し）","a":"酢酸水"},{"id":"G2-160","s":"グノーブル","f":"化学","u":["2"],"q":"［　　］に入る言葉は?\n［　　］（無色・無臭）＝固体のホウ酸。殺虫剤（ゴキブリ用ホウ酸だんご）・目を洗う薬品に利用","a":"ホウ酸水"},{"id":"G2-161","s":"グノーブル","f":"化学","u":["2"],"q":"次の説明にあてはまる言葉は?\n固体のクエン酸など（正しくは水溶液ではない）。クエン酸は重そうとともに発泡入浴剤に利用","a":"果汁"},{"id":"G2-162","s":"グノーブル","f":"化学","u":["2"],"q":"［　　］に入る言葉は?\n［　　］（無色・刺激臭）＝気体のアンモニア。塩酸と近づけると白いけむりが生じる","a":"アンモニア水"},{"id":"G2-163","s":"グノーブル","f":"化学","u":["2"],"q":"次の説明にあてはまる言葉は?\n固体の重そう（炭酸水素ナトリウム）。ベーキングパウダー・胃薬・発泡入浴剤。酸性の水溶液を注ぐ／加熱すると二酸化炭素発生","a":"重そう水"},{"id":"G2-164","s":"グノーブル","f":"化学","u":["2"],"q":"次の説明にあてはまる言葉は?\n固体の消石灰（水酸化カルシウム）。二酸化炭素・炭酸水で炭酸カルシウムができ白くにごる","a":"石灰水"},{"id":"G2-165","s":"グノーブル","f":"化学","u":["2"],"q":"［　　］に入る言葉は?\n手でさわらない（汗で反応する）。［　　］で容器から取り出す","a":"ピンセット"},{"id":"G2-166","s":"グノーブル","f":"化学","u":["2"],"q":"［　　］に入る言葉は?\n水溶液にしたとき電気を通す物質＝電解質、通さない物質＝［　　］","a":"非電解質"},{"id":"G3-167","s":"グノーブル","f":"化学","u":["3"],"q":"［　　］に入る言葉は?\n空気より少し重い（空気の約1.1倍）。空気中の約［　　］が酸素","a":"5分の1（約21%）"},{"id":"G3-168","s":"グノーブル","f":"化学","u":["3"],"q":"［　　］に入る言葉は?\n［　　］。気体検知管（酸素用6〜24%）で割合を調べられる。酸素用検知管は熱くなるのでカバーゴムの部分を持つ","a":"無色・無臭"},{"id":"G3-169","s":"グノーブル","f":"化学","u":["3"],"q":"［　　］に入る言葉は?\n目盛りの読み方：色がはっきり変わっているときは［　　］、ななめに変わっているときは中間の目盛りを読む","a":"中間のこさの目盛り"},{"id":"G3-170","s":"グノーブル","f":"化学","u":["3"],"q":"［　　］に入る言葉は?\n目盛りの読み方：色がはっきり変わっているときは中間のこさの目盛り、ななめに変わっているときは［　　］を読む","a":"中間の目盛り"},{"id":"G3-171","s":"グノーブル","f":"化学","u":["3"],"q":"［　　］に入る言葉は?\n集め方＝［　　］。最初に出てくるフラスコとガラス管の中の空気（集気びん1本分くらい）は集めない","a":"水上置換法"},{"id":"G3-172","s":"グノーブル","f":"化学","u":["3"],"q":"次の説明にあてはまる言葉は?\n無色無臭、空気中に最も多い（約78%）、水にとけにくい（水上置換）、ほかの物質と反応しにくい","a":"ちっ素"},{"id":"G4-173","s":"グノーブル","f":"生物","u":["4"],"q":"［　　］に入る言葉は?\nでんぷんは［　　］（茶かっ色）で青紫色になる＝ヨウ素でんぷん反応","a":"ヨウ素液"},{"id":"G4-174","s":"グノーブル","f":"生物","u":["4"],"q":"［　　］に入る言葉は?\nでんぷんはヨウ素液（茶かっ色）で［　　］になる＝ヨウ素でんぷん反応","a":"青紫色"},{"id":"G4-175","s":"グノーブル","f":"生物","u":["4"],"q":"［　　］に入る言葉は?\n双子葉植物：子葉2枚が地上に出て広がる＝［　　］。単子葉植物：胚乳に養分、子葉は目立たない。裸子植物（マツ）：子葉が3枚以上＝多子葉","a":"双葉"},{"id":"G4-176","s":"グノーブル","f":"生物","u":["4"],"q":"［　　］に入る言葉は?\n双子葉植物：子葉2枚が地上に出て広がる＝双葉。単子葉植物：［　　］に養分、子葉は目立たない。裸子植物（マツ）：子葉が3枚以上＝多子葉","a":"胚乳"},{"id":"G4-177","s":"グノーブル","f":"生物","u":["4"],"q":"［　　］に入る言葉は?\n発芽前の子葉にはでんぷんが多く、ヨウ素液で［　　］。発芽・成長につれて養分が使われ、本葉が出るころにはほとんど色が変わらない","a":"濃い青紫色"},{"id":"G4-178","s":"グノーブル","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\n葉が大きい・色が濃い（緑）・数が多い／茎が短く太くがっしり","a":"日なた（A）"},{"id":"G4-179","s":"グノーブル","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\n葉が小さい・色がうすい（黄色）・数が少ない／茎が細長く草たけが高い","a":"日かげ（B）"},{"id":"G5-180","s":"グノーブル","f":"生物","u":["5"],"q":"［　　］に入る言葉は?\nはたらき：光合成・呼吸・蒸散。（養分をたくわえるものも：［　　］＝地下茎についた葉＝球根）","a":"タマネギ・ユリ・チューリップ"},{"id":"G5-181","s":"グノーブル","f":"生物","u":["5"],"q":"［　　］に入る言葉は?\nはたらき：光合成・呼吸・蒸散。（養分をたくわえるものも：タマネギ・ユリ・チューリップ＝地下茎についた葉＝［　　］）","a":"球根"},{"id":"G5-182","s":"グノーブル","f":"生物","u":["5"],"q":"［　　］に入る言葉は?\n双子葉＝［　　］／単子葉＝平行脈","a":"網状脈"},{"id":"G5-183","s":"グノーブル","f":"生物","u":["5"],"q":"［　　］に入る言葉は?\n双子葉＝網状脈／単子葉＝［　　］","a":"平行脈"},{"id":"G6-184","s":"グノーブル","f":"生物","u":["6"],"q":"次の説明にあてはまる言葉は?\nマツ・スギ・モミ・ヒノキ・イチョウ・ソテツ。胚珠がむき出し。草花はなくすべて樹木。形成層をもち茎や根のつくりは双子葉に似る","a":"裸子植物"},{"id":"G6-185","s":"グノーブル","f":"生物","u":["6"],"q":"［　　］に入る言葉は?\n使われずにあまった水を体外に出すはたらきが［　　］","a":"蒸散"},{"id":"G6-186","s":"グノーブル","f":"生物","u":["6"],"q":"［　　］に入る言葉は?\n植物が［　　］から体内の水を水蒸気として体外に出すはたらき","a":"気孔"},{"id":"G6-187","s":"グノーブル","f":"生物","u":["6"],"q":"［　　］に入る言葉は?\n植物が気孔から体内の水を［　　］として体外に出すはたらき","a":"水蒸気"},{"id":"G6-188","s":"グノーブル","f":"生物","u":["6"],"q":"［　　］に入る言葉は?\n気孔は葉の裏に多い（茎にも少しある）。1対の［　　］によるすき間","a":"三日月形の孔辺細胞"},{"id":"G6-189","s":"グノーブル","f":"生物","u":["6"],"q":"［　　］に入る言葉は?\n乾燥時［　　］、水分をふくむと赤色","a":"青色"},{"id":"G6-190","s":"グノーブル","f":"生物","u":["6"],"q":"［　　］に入る言葉は?\n乾燥時青色、水分をふくむと［　　］","a":"赤色"},{"id":"G7-191","s":"グノーブル","f":"生物","u":["7"],"q":"［　　］に入る言葉は?\n材料：［　　］（根から吸収され道管を通る）・二酸化炭素（葉の裏に多い気孔から取り入れる）","a":"水"},{"id":"G7-192","s":"グノーブル","f":"生物","u":["7"],"q":"［　　］に入る言葉は?\n［　　］（1節に1枚ずつたがいちがい）：ヒマワリ・アサガオ・ナズナ・ツツジ・ヒメジョオン・ジャガイモ","a":"互生"},{"id":"G7-193","s":"グノーブル","f":"生物","u":["7"],"q":"［　　］に入る言葉は?\n［　　］（1節に2枚向かい合う）：カエデ・アジサイ・ナデシコ・シソ・ハコベ・キンモクセイ","a":"対生"},{"id":"G7-194","s":"グノーブル","f":"生物","u":["7"],"q":"［　　］に入る言葉は?\n［　　］（1節に3枚以上）：ヤエムグラ・オオカナダモ・クロモ・ツリガネニンジン","a":"輪生"},{"id":"G7-195","s":"グノーブル","f":"生物","u":["7"],"q":"［　　］に入る言葉は?\n［　　］（1枚の葉が小葉に分かれる）：ジャガイモ・フジ・クズ・カタバミ","a":"複葉"},{"id":"G7-196","s":"グノーブル","f":"生物","u":["7"],"q":"［　　］に入る言葉は?\n場所は［　　］、目的はエネルギーを取り出すこと、1日中（昼も夜も）行う","a":"全身の細胞"},{"id":"G7-197","s":"グノーブル","f":"生物","u":["7"],"q":"［　　］に入る言葉は?\n場所は全身の細胞、目的はエネルギーを取り出すこと、［　　］行う","a":"1日中（昼も夜も）"},{"id":"G春1-198","s":"グノーブル","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n温度＝あたたかさ・冷たさの度合い。［　　］＝温度を変化させる原因となるエネルギー","a":"熱"},{"id":"G春1-199","s":"グノーブル","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n熱は物の内部を温度の高い方から低い方へ順に伝わる。これが［　　］。近い所から順に伝わるのが特ちょう","a":"伝導"},{"id":"G春1-200","s":"グノーブル","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\nろうをぬった金属板は［　　］に伝わる。距離が近くても、間をとばしていきなり伝わることはない（切りこみがあればまわりこむ）","a":"熱している点から同心円状"},{"id":"G春1-201","s":"グノーブル","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n熱を伝えやすい＝良導体（金属）／伝えにくい＝［　　］（ガラス・水・木・空気）","a":"不良導体"},{"id":"G春1-202","s":"グノーブル","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n試験管の［　　］を熱すると上の部分だけで流れができ下は冷たいまま／下部を熱すると全体があたたまる","a":"上部"},{"id":"G春1-203","s":"グノーブル","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n試験管の上部を熱すると上の部分だけで流れができ下は冷たいまま／［　　］を熱すると全体があたたまる","a":"下部"},{"id":"G春1-204","s":"グノーブル","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n冷房は［　　］、暖房は下に置くとよい","a":"上"},{"id":"G春1-205","s":"グノーブル","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n冷房は上、暖房は［　　］に置くとよい","a":"下"},{"id":"G春1-206","s":"グノーブル","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n水は融点＝凝固点＝0℃、［　　］","a":"沸点＝100℃"},{"id":"G春2-207","s":"グノーブル","f":"地学","u":["春2"],"q":"［　　］に入る言葉は?\n直径約140万km＝［　　］・月の約400倍","a":"地球の約109倍"},{"id":"G春2-208","s":"グノーブル","f":"地学","u":["春2"],"q":"［　　］に入る言葉は?\n直径約140万km＝地球の約109倍・［　　］","a":"月の約400倍"},{"id":"G春2-209","s":"グノーブル","f":"地学","u":["春2"],"q":"［　　］に入る言葉は?\n地球からの距離約1億5000万km。光（秒速約30万km）で［　　］","a":"8分20秒＝500秒"},{"id":"G春2-210","s":"グノーブル","f":"地学","u":["春2"],"q":"［　　］に入る言葉は?\n5円玉の穴にすっぽり入る＝［　　］。直接見ずしゃ光板・日食グラスを使う","a":"円形"},{"id":"G春2-211","s":"グノーブル","f":"地学","u":["春2"],"q":"［　　］に入る言葉は?\n5円玉の穴にすっぽり入る＝円形。直接見ず［　　］を使う","a":"しゃ光板・日食グラス"},{"id":"G春2-212","s":"グノーブル","f":"地学","u":["春2"],"q":"次の説明にあてはまる言葉は?\n外側の100万℃以上の非常にうすいガス。皆既日食のときに白くかがやいて見える。プロミネンス（紅炎）","a":"コロナ"},{"id":"G春2-213","s":"グノーブル","f":"地学","u":["春2"],"q":"次の説明にあてはまる言葉は?\n地平線から太陽を見上げた角度。南中したときが南中高度","a":"太陽高度"},{"id":"G春2-214","s":"グノーブル","f":"地学","u":["春2"],"q":"［　　］に入る言葉は?\nそのため太陽は反対に［　　］へ動いて見える。1時間で15°動き、1°動くのに4分かかる","a":"東から西"},{"id":"G春2-215","s":"グノーブル","f":"地学","u":["春2"],"q":"次の説明にあてはまる言葉は?\n真東からのぼり真西にしずむ、昼と夜がほぼ12時間","a":"春分（3/21ごろ）"},{"id":"G春2-216","s":"グノーブル","f":"地学","u":["春2"],"q":"次の説明にあてはまる言葉は?\n昼が最も長い・南中高度が最も高い・日の出／日の入りの位置が最も北より","a":"夏至（6/22ごろ）"},{"id":"G春2-217","s":"グノーブル","f":"地学","u":["春2"],"q":"次の説明にあてはまる言葉は?\n真東・真西、昼夜ほぼ12時間","a":"秋分（9/23ごろ）"},{"id":"G春2-218","s":"グノーブル","f":"地学","u":["春2"],"q":"次の説明にあてはまる言葉は?\n昼が最も短い・南中高度が最も低い・日の出／日の入りが最も南より","a":"冬至（12/22ごろ）"},{"id":"G春2-219","s":"グノーブル","f":"地学","u":["春2"],"q":"［　　］に入る言葉は?\n地軸が公転面に垂直な線に対して23.4°傾いたまま自転・公転しているから。公転の向きは自転と同じで、北極側から見て［　　］","a":"反時計回り"},{"id":"G春2-220","s":"グノーブル","f":"地学","u":["春2"],"q":"次の説明にあてはまる言葉は?\n棒の北側を東西方向と平行な一直線","a":"春分・秋分"},{"id":"G春2-221","s":"グノーブル","f":"地学","u":["春2"],"q":"次の説明にあてはまる言葉は?\n南中時の影が1年で最も短い。日の出・日の入りが北よりなので、そのときの影は南より（曲線は南側にふくらむ）","a":"夏至"},{"id":"G春2-222","s":"グノーブル","f":"地学","u":["春2"],"q":"次の説明にあてはまる言葉は?\n南中時の影が1年で最も長い。曲線は北側に大きく開く","a":"冬至"},{"id":"G春2-223","s":"グノーブル","f":"地学","u":["春2"],"q":"［　　］に入る言葉は?\n気温：風通しのよい、直射日光の当たらない、地面から1.2〜1.5mの高さ。1日1回なら［　　］（1日の平均気温に最も近い）","a":"午前9時"},{"id":"G春2-224","s":"グノーブル","f":"地学","u":["春2"],"q":"［　　］に入る言葉は?\n温度計は直角になる位置から読み、［　　］まで目分量で読む","a":"最小目盛りの1/10"},{"id":"G春3-225","s":"グノーブル","f":"地学","u":["春3"],"q":"［　　］に入る言葉は?\n地温は［　　］と地面から出ていく熱の差で決まる","a":"太陽から受ける熱"},{"id":"G春3-226","s":"グノーブル","f":"地学","u":["春3"],"q":"［　　］に入る言葉は?\n地温は太陽から受ける熱と［　　］の差で決まる","a":"地面から出ていく熱"},{"id":"G春3-227","s":"グノーブル","f":"地学","u":["春3"],"q":"［　　］に入る言葉は?\n南中高度が最高＝［　　］、最低＝冬至","a":"夏至"},{"id":"G春3-228","s":"グノーブル","f":"地学","u":["春3"],"q":"［　　］に入る言葉は?\n南中高度が最高＝夏至、最低＝［　　］","a":"冬至"},{"id":"G春3-229","s":"グノーブル","f":"地学","u":["春3"],"q":"［　　］に入る言葉は?\n晴れ：昼＝受ける熱が多く上がりやすい／夜＝［　　］で出ていく熱が多く下がりやすい","a":"放射"},{"id":"G春3-230","s":"グノーブル","f":"地学","u":["春3"],"q":"［　　］に入る言葉は?\n南中時刻と明石（12時）との差◯分÷4＝◯度、南中が［　　］・遅ければ西","a":"早ければ東"},{"id":"G春3-231","s":"グノーブル","f":"地学","u":["春3"],"q":"［　　］に入る言葉は?\n南中時刻と明石（12時）との差◯分÷4＝◯度、南中が早ければ東・［　　］","a":"遅ければ西"},{"id":"G23-232","s":"グノーブル","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\n内側から［　　］・マントル・地殻の3層","a":"核"},{"id":"G23-233","s":"グノーブル","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\n内側から核・［　　］・地殻の3層","a":"マントル"},{"id":"G23-234","s":"グノーブル","f":"地学","u":["23"],"q":"次の説明にあてはまる言葉は?\n核と地殻の間。高温高圧の岩石。液体のような性質をもち対流を起こす","a":"マントル"},{"id":"G23-235","s":"グノーブル","f":"地学","u":["23"],"q":"次の説明にあてはまる言葉は?\n地殻とマントルの最上層部をふくむ厚さ約100kmの岩盤。10数枚に分かれて地球をおおう","a":"プレート"},{"id":"G23-236","s":"グノーブル","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\n核に熱せられたマントルがゆっくり上昇し、冷えると下降する＝［　　］。これにのってプレートが1年間に数cm動く","a":"マントルの対流"},{"id":"G23-237","s":"グノーブル","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\nプレートが生まれる所＝［　　］（マントルが上昇）／沈みこむ所＝海溝（マントルが下降）","a":"海嶺"},{"id":"G23-238","s":"グノーブル","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\nプレートが生まれる所＝海嶺（マントルが上昇）／沈みこむ所＝［　　］（マントルが下降）","a":"海溝"},{"id":"G23-239","s":"グノーブル","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\n日本列島には無数の［　　］（動く可能性のある断層）がある","a":"活断層"},{"id":"G23-240","s":"グノーブル","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\nプレートが沈みこんだ所（マントルの上層部）で岩石の一部がとけて液体になったもの＝［　　］","a":"マグマ"},{"id":"G23-241","s":"グノーブル","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\nマグマは地下数kmの所に［　　］をつくり、圧力が高まると地殻の弱い所から地上に噴き出す＝噴火。噴出物が積もって火山ができる","a":"マグマだまり"},{"id":"G23-242","s":"グノーブル","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\nマグマは地下数kmの所にマグマだまりをつくり、圧力が高まると地殻の弱い所から地上に噴き出す＝［　　］。噴出物が積もって火山ができる","a":"噴火"},{"id":"G23-243","s":"グノーブル","f":"地学","u":["23"],"q":"次の説明にあてはまる言葉は?\nほとんどが水蒸気（90％以上）。ほかに二酸化硫黄（亜硫酸ガス）・硫化水素・二酸化炭素","a":"火山ガス"},{"id":"G23-244","s":"グノーブル","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\n火山灰の粒は風で運ばれ流水のはたらきをほとんど受けないので［　　］","a":"角ばっている"},{"id":"G23-245","s":"グノーブル","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\n火山ガスがぬけて固まった溶岩（軽石など）は［　　］がたくさんあいている","a":"小さな穴"},{"id":"G23-246","s":"グノーブル","f":"地学","u":["23"],"q":"次の説明にあてはまる言葉は?\n非常に高温で、まきこまれた森林や住宅街は焼きつくされる","a":"溶岩流"},{"id":"G23-247","s":"グノーブル","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\nねばり気が強い＝火山ガスがたまりやすく、一気に噴出して［　　］を起こしやすい","a":"爆発的な噴火"},{"id":"G23-248","s":"グノーブル","f":"地学","u":["23"],"q":"次の説明にあてはまる言葉は?\n屈斜路湖・支笏湖・洞爺湖・十和田湖など。海水が入りこんだ湾：鹿児島湾。カルデラの中に町：阿蘇カルデラ","a":"カルデラ湖"},{"id":"G23-249","s":"グノーブル","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\n鹿児島県一帯の［　　］＝鹿児島湾のもとになった姶良カルデラができたときの火山灰が積もったもの","a":"シラス台地"},{"id":"G23-250","s":"グノーブル","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\n鹿児島県一帯のシラス台地＝鹿児島湾のもとになった［　　］ができたときの火山灰が積もったもの","a":"姶良カルデラ"},{"id":"G23-251","s":"グノーブル","f":"地学","u":["23"],"q":"［　　］に入る言葉は?\nマグマが冷えて固まった岩石＝［　　］。高温のマグマが固まったので化石をふくまない。流水と関係なくできるので粒は角ばっている","a":"火成岩"
