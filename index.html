5-89","s":"基本問題5年","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\n石油の燃焼によるちっ素酸化物やイオウ酸化物が雨にとけ、強い酸性を示す","a":"酸性雨"},{"id":"K5-90","s":"基本問題5年","f":"環境","u":["環境"],"q":"次の説明にあてはまる言葉は?\nフロンガスなどで上空のオゾン層が破壊され紫外線量が増える","a":"オゾン層の破壊"},{"id":"K5-91","s":"基本問題5年","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n［　　］は伝導・対流・放射の3通り","a":"熱の伝わり方"},{"id":"K5-92","s":"基本問題5年","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n熱の伝わり方は［　　］の3通り","a":"伝導・対流・放射"},{"id":"K5-93","s":"基本問題5年","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n液体や気体は熱を受け取った物質そのものが移動しながら熱を伝える（水を下から熱するとき、あたたまった水が上へ、冷たい水が下へ動く）","a":"対流"},{"id":"K5-94","s":"基本問題5年","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n熱が途中を素通りして、当たったものを直接あたためる（日光であたたかくなる）","a":"放射"},{"id":"K5-95","s":"基本問題5年","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n温度が高い方から低い方へ熱だけが移動していく（金属の棒：熱を伝えやすい順に銅、アルミニウム、鉄","a":"伝導"},{"id":"K5-96","s":"基本問題5年","f":"化学","u":["夏2"],"q":"次の説明にあてはまる言葉は?\nまわりに酸素が十分あり、完全燃焼している","a":"外炎"},{"id":"K5-97","s":"基本問題5年","f":"化学","u":["夏2"],"q":"次の説明にあてはまる言葉は?\n酸素が不足してほとんど燃焼していない","a":"炎心"},{"id":"K5-98","s":"基本問題5年","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\n燃焼は、燃えるものが酸素と結びつき熱や光を出す反応","a":"燃焼の化学反応"},{"id":"K5-99","s":"基本問題5年","f":"物理","u":["32"],"q":"［　　］に入る言葉は?\nおもりの重さとばねののび：［　　］の関係にある","a":"正比例"},{"id":"K5-100","s":"基本問題5年","f":"物理","u":["30"],"q":"［　　］に入る言葉は?\nてこを回そうとする力のつり合い：一方を［　　］として考えてよい","a":"支点"},{"id":"K5-102","s":"基本問題5年","f":"物理","u":["8"],"q":"［　　］に入る言葉は?\n電気回路：電気の通り道を電気回路（回路）といい、そこに流れる電気を［　　］という","a":"電流"},{"id":"K5-103","s":"基本問題5年","f":"物理","u":["10"],"q":"次の説明にあてはまる言葉は?\n導線に電気が流れているとき、導線のまわりにできる磁力線は、電流の流れていく向きに対して右回りになる","a":"導線のまわりの磁力線"},{"id":"K5-104","s":"基本問題5年","f":"物理","u":["9","10"],"q":"［　　］に入る言葉は?\n磁力線の向き：方位磁針を置いたとき、方位磁針の［　　］が磁力線の向き。これによって磁力線の向きを調べることができる","a":"N極の向き"},{"id":"K5-105","s":"基本問題5年","f":"物理","u":["9","10"],"q":"［　　］に入る言葉は?\n磁力線の向き：方位磁針を置いたとき、方位磁針の［　　］が磁力線の向き","a":"N極の向き"},{"id":"K5-106","s":"基本問題5年","f":"物理","u":["冬3"],"q":"［　　］に入る言葉は?\n音：音は物体の［　　］によって出る。音が伝わるには、音を伝える物質（空気、水など）が必要","a":"振動"},{"id":"K5-107","s":"基本問題5年","f":"物理","u":["冬3"],"q":"［　　］に入る言葉は?\n音：音は物体の［　　］によって出る","a":"振動"},{"id":"K5-108","s":"基本問題5年","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n音が1秒間にふるえる回数","a":"振動数"},{"id":"K5-109","s":"基本問題5年","f":"物理","u":["夏5"],"q":"［　　］に入る言葉は?\nしょう点：とつレンズに日光のような平行光線を当てると、光は1点に集まる。その点がしょう点で、とつレンズからの距離が［　　］","a":"しょう点距離"},{"id":"K5-110","s":"基本問題5年","f":"物理","u":["夏5"],"q":"次の説明にあてはまる言葉は?\nとつレンズの材質や厚さによって決まる","a":"しょう点距離"},{"id":"K5-111","s":"基本問題5年","f":"物理","u":["夏5"],"q":"次の説明にあてはまる言葉は?\nとつレンズに日光のような平行光線を当てると、光は1点に集まる","a":"しょう点"},{"id":"K4-1","s":"基本問題4年","f":"生物","u":["7"],"q":"［　　］に入る言葉は?\n植物は、光のエネルギーを利用してでんぷんという栄養分をつくっている。この働きを［　　］という","a":"光合成"},{"id":"WS5a-1","s":"ウイニングステップ5年","f":"化学","u":["25"],"q":"次の説明にあてはまる言葉は?\n酸素と養分を使って活動するエネルギーを得る働き。すべての生物が行う。このとき二酸化炭素と水ができる","a":"呼吸"},{"id":"WS5a-2","s":"ウイニングステップ5年","f":"化学","u":["25"],"q":"次の説明にあてはまる言葉は?\n酸素と養分を使って活動するエネルギーを得る働き","a":"呼吸"},{"id":"WS5a-3","s":"ウイニングステップ5年","f":"化学","u":["25"],"q":"次の説明にあてはまる言葉は?\n植物が、二酸化炭素と水から、光のエネルギーを使って、養分（でんぷん）と酸素をつくる働き","a":"光合成"},{"id":"WS5a-4","s":"ウイニングステップ5年","f":"生物","u":["6"],"q":"次の説明にあてはまる言葉は?\n根から吸い上げて体内で余った水を、気孔から水蒸気として体外へ出す働き","a":"蒸散作用"},{"id":"WS5a-5","s":"ウイニングステップ5年","f":"生物","u":["28"],"q":"次の説明にあてはまる言葉は?\n4枚、2枚、0枚のどれか","a":"羽の数"},{"id":"WS5a-6","s":"ウイニングステップ5年","f":"生物","u":["29"],"q":"次の説明にあてはまる言葉は?\n卵・幼虫・さなぎ・成虫のどの時期で冬ごしをするか","a":"冬ごしのようす"},{"id":"WS5a-7","s":"ウイニングステップ5年","f":"生物","u":["28"],"q":"次の説明にあてはまる言葉は?\nかむ口・吸う口・なめる口のどれか","a":"口の形"},{"id":"WS5a-8","s":"ウイニングステップ5年","f":"地学","u":["22"],"q":"けずり取った土砂を運ぶ働きは?","a":"運ばん作用"},{"id":"WS5a-9","s":"ウイニングステップ5年","f":"地学","u":["22"],"q":"運んできた土砂を積もらせる働きは?","a":"たい積作用"},{"id":"WS5a-10","s":"ウイニングステップ5年","f":"地学","u":["22"],"q":"［　　］に入る言葉は?\n川の流れによって運ばれてきた土砂が海底にたい積した層や、火山灰がたい積した層などがいくつも重なってできたものを［　　］という","a":"地層"},{"id":"WS5a-11","s":"ウイニングステップ5年","f":"地学","u":["22"],"q":"［　　］に入る言葉は?\n地層で見られる変化：［　　］（両側からゆっくりおされる）","a":"しゅう曲"},{"id":"WS5b-1","s":"ウイニングステップ5年","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\n北の空の星座：1年中見ることができ、［　　］を中心に反時計回りに動いて見える","a":"北極星"},{"id":"WS5b-2","s":"ウイニングステップ5年","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\n北の空の星座：1年中見ることができ、北極星を中心に［　　］に動いて見える","a":"反時計回り"},{"id":"WS5b-3","s":"ウイニングステップ5年","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\n夏の南の空にはさそり座（赤い1等星［　　］）","a":"アンタレス"},{"id":"WS5b-4","s":"ウイニングステップ5年","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\nオリオン座には［　　］（青白い1等星）もある","a":"リゲル"},{"id":"WS5c-1","s":"ウイニングステップ5年","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n氷（固体）⇄水（液体）⇄水蒸気（気体）","a":"水の三態変化"},{"id":"WS5c-2","s":"ウイニングステップ5年","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n熱が、温度の高い方から低い方へ、順に伝わっていくような伝わり方","a":"伝導"},{"id":"WS5c-3","s":"ウイニングステップ5年","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n液体や気体が移動しながら全体に熱を伝えていくような伝わり方","a":"対流"},{"id":"WS5c-4","s":"ウイニングステップ5年","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n太陽の熱がとちゅうの空気を素通りして地面を直接あたためるように、熱がとちゅうを素通りして当たったものを直接あたためるような熱の伝わり方","a":"放射"},{"id":"WS5c-5","s":"ウイニングステップ5年","f":"化学","u":["2"],"q":"［　　］に入る言葉は?\n青色リトマス紙＝酸性は［　　］、中性・アルカリ性は変わらない","a":"赤く変わる"},{"id":"WS5c-6","s":"ウイニングステップ5年","f":"化学","u":["2"],"q":"［　　］に入る言葉は?\nフェノールフタレイン液＝酸性・中性は変わらない、アルカリ性は［　　］","a":"赤く変わる"},{"id":"WS5c-7","s":"ウイニングステップ5年","f":"化学","u":["25"],"q":"次の説明にあてはまる言葉は?\nろうとに液体を、三角フラスコに固体を入れる","a":"気体の発生方法"},{"id":"WS5c-8","s":"ウイニングステップ5年","f":"化学","u":["25"],"q":"［　　］に入る言葉は?\n［　　］（気体の性質によって、集め方がちがう）：水にとけにくい気体＝水上置換","a":"気体の集め方"},{"id":"WS5c-9","s":"ウイニングステップ5年","f":"化学","u":["25"],"q":"［　　］に入る言葉は?\n気体の集め方（気体の性質によって、集め方がちがう）：水にとけにくい気体＝［　　］","a":"水上置換"},{"id":"WS5c-10","s":"ウイニングステップ5年","f":"化学","u":["25"],"q":"空気よりも重い気体は?","a":"下方置換"},{"id":"WS5c-11","s":"ウイニングステップ5年","f":"化学","u":["25"],"q":"空気よりも軽い気体は?","a":"上方置換"},{"id":"WS5c-12","s":"ウイニングステップ5年","f":"化学","u":["夏2"],"q":"［　　］に入る言葉は?\nろうそくの炎：［　　］＝酸素が十分にあるので、完全燃焼している","a":"外炎"},{"id":"WS5c-13","s":"ウイニングステップ5年","f":"化学","u":["夏2"],"q":"次の説明にあてはまる言葉は?\n酸素が不十分なため、不完全燃焼している","a":"内炎"},{"id":"WS5c-14","s":"ウイニングステップ5年","f":"化学","u":["25"],"q":"次の説明にあてはまる言葉は?\n酸素不足でほとんど燃えていないので、ろうの気体がある","a":"炎心"},{"id":"JW1-1","s":"塾技100","f":"化学","u":["1"],"q":"次の説明にあてはまる言葉は?\n物を水にとかしてできた液","a":"水溶液"},{"id":"JW1-2","s":"塾技100","f":"化学","u":["20"],"q":"次の説明にあてはまる言葉は?\nある物が100gの水にとける最大の量（g）","a":"溶解度"},{"id":"JW1-3","s":"塾技100","f":"化学","u":["20"],"q":"次の説明にあてはまる言葉は?\n固体がとけた水溶液から、もとの固体が再び結晶となって出てくる現象","a":"再結晶"},{"id":"JW1-4","s":"塾技100","f":"化学","u":["1","2"],"q":"次の説明にあてはまる言葉は?\n酸性の水溶液とアルカリ性の水溶液を混ぜると、互いに相手の性質を打ち消し合う反応","a":"中和"},{"id":"JW1-5","s":"塾技100","f":"化学","u":["1"],"q":"［　　］に入る言葉は?\nもとの水溶液にとけていた物とまったく別の物（［　　］）と水ができる","a":"塩"},{"id":"JW1-6","s":"塾技100","f":"化学","u":["2"],"q":"［　　］に入る言葉は?\n金属には、酸性やアルカリ性の水溶液と反応して［　　］を出しながらとけるものがある","a":"水素"},{"id":"JW1-7","s":"塾技100","f":"化学","u":["25"],"q":"次の説明にあてはまる言葉は?\n二酸化マンガン（黒い固体）に過酸化水素水（オキシドール）を加える","a":"酸素の作り方"},{"id":"JW1-8","s":"塾技100","f":"化学","u":["25"],"q":"次の説明にあてはまる言葉は?\n亜鉛・鉄・アルミニウム・マグネシウムなどの金属に、うすい塩酸やうすい硫酸を反応させる","a":"水素のつくり方"},{"id":"JW1-9","s":"塾技100","f":"化学","u":["25"],"q":"次の説明にあてはまる言葉は?\n空気より軽く、水に非常にとけやすい気体で、鼻につんとくる刺激のあるにおい（刺激臭）がある","a":"アンモニア"},{"id":"JW1-10","s":"塾技100","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\n塩化アンモニウムと水酸化カルシウムの粉を混ぜ合わせたものを試験管に入れて熱する","a":"つくり方"},{"id":"JW1-11","s":"塾技100","f":"化学","u":["21"],"q":"次の説明にあてはまる言葉は?\nちっ素約78％・酸素約21％・二酸化炭素約0.04％（色やにおいはない）","a":"空気の成分"},{"id":"JW1-12","s":"塾技100","f":"化学","u":["20"],"q":"次の説明にあてはまる言葉は?\n液体の中にとけずに残っている物を、ろ紙を使ってこし分けること","a":"ろ過"},{"id":"JW1-13","s":"塾技100","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\n物が燃えるとき、光や熱などを出しながら激しく酸素と結びつくこと（激しい酸化）","a":"燃焼"},{"id":"JW1-14","s":"塾技100","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n物が十分な酸素と結びつく完全燃焼と、不十分な酸素と結びつく［　　］がある","a":"不完全燃焼"},{"id":"JW1-15","s":"塾技100","f":"化学","u":["25"],"q":"［　　］に入る言葉は?\nふたをした容器の中でろうそくを燃やしたあとの空気を気体検知管で調べると、約［　　］は酸素が残っている","a":"16％"},{"id":"JW1-16","s":"塾技100","f":"化学","u":["25"],"q":"［　　］に入る言葉は?\n大切なのは、気体中における［　　］","a":"酸素のしめる割合"},{"id":"JW1-17","s":"塾技100","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\nろうには炭素と水素がふくまれ、次の順序で酸素と結びついて燃える","a":"ろうそくの燃え方"},{"id":"JW1-18","s":"塾技100","f":"化学","u":["夏2"],"q":"［　　］に入る言葉は?\n炎には内炎と外炎があり、最も温度が高い部分は、ガスと空気が混ざり合って出てくる［　　］の部分","a":"内炎のすぐ上"},{"id":"JW1-19","s":"塾技100","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\n木は炭素や水素をふくんでいるため燃えると二酸化炭素や水（水蒸気）ができる。燃えたあとは、カリウムなどの燃えない物が灰となって残る","a":"木の燃え方"},{"id":"JW1-20","s":"塾技100","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\n木は炭素や水素をふくんでいるため燃えると二酸化炭素や水（水蒸気）ができる","a":"木の燃え方"},{"id":"JW1-21","s":"塾技100","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n［　　］（乾留）＝物を酸素とふれないようにして強く熱すること","a":"蒸し焼き"},{"id":"JW1-23","s":"塾技100","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n不完全燃焼すると、有毒な気体である［　　］が発生する","a":"一酸化炭素"},{"id":"JW1-24","s":"塾技100","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\n酸化した物質から酸素をとりのぞき、酸化する前の物質にもどす反応","a":"還元"},{"id":"JW1-25","s":"塾技100","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n温度が上がると体積がふくれ（ぼう張）、下がると縮む（しゅう縮）","a":"固体"},{"id":"JW1-26","s":"塾技100","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n物（物質）は、温度によって、固体・液体・気体の3つの状態（物質の三態）のいずれかとなる","a":"状態変化"},{"id":"JW1-27","s":"塾技100","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n融解と凝固：固体が液体になることを融解（融解するときの温度＝［　　］）","a":"融点"},{"id":"JW1-28","s":"塾技100","f":"化学","u":["25"],"q":"次の説明にあてはまる言葉は?\n液体が気体になること","a":"気化"},{"id":"JW1-29","s":"塾技100","f":"化学","u":["25"],"q":"次の説明にあてはまる言葉は?\n気体が液体になること","a":"液化"},{"id":"JW1-30","s":"塾技100","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n熱（エネルギー）は、高い方から低い方へと伝わる","a":"熱の伝わり方"},{"id":"JW1-31","s":"塾技100","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n熱の伝わり方には「［　　］」「対流」「放射」がある","a":"伝導"},{"id":"JW1-32","s":"塾技100","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n熱の伝わり方には「伝導」「［　　］」「放射」がある","a":"対流"},{"id":"JW1-33","s":"塾技100","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n物質どうしが直接せっすることで、熱が高い方から低い方へ同心円状に伝わっていくこと","a":"伝導"},{"id":"JW1-34","s":"塾技100","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n水や空気の流れによって熱が移動すること","a":"対流"},{"id":"JW1-35","s":"塾技100","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n太陽やストーブ、たき火などから出る熱は、空気をすどおりしてそれに当たった物に直接伝わる","a":"放射"},{"id":"JW1-36","s":"塾技100","f":"物理","u":["夏3"],"q":"次の説明にあてはまる言葉は?\n光は同じ物質の中ではまっすぐ進む","a":"光の直進"},{"id":"JW1-37","s":"塾技100","f":"物理","u":["夏3"],"q":"次の説明にあてはまる言葉は?\n太陽や電球、電とう、燃えているろうそくなど、自ら光を出す物体","a":"光源"},{"id":"JW1-38","s":"塾技100","f":"物理","u":["夏3"],"q":"次の説明にあてはまる言葉は?\n豆電球のような小さい物（点光源）の場合、スリットを通すと光が広がりながら進む","a":"拡散光線"},{"id":"JW1-39","s":"塾技100","f":"物理","u":["夏4"],"q":"次の説明にあてはまる言葉は?\n光が鏡や水面などに当たってはね返ること","a":"光の反射"},{"id":"JW1-40","s":"塾技100","f":"物理","u":["夏4"],"q":"次の説明にあてはまる言葉は?\n光が反射する点で面に垂直に引いた線を法線という","a":"反射の法則"},{"id":"JW1-41","s":"塾技100","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n入射光と法線のなす角（入射角）と、反射光と法線のなす角（反射角）は［　　］","a":"等しい"},{"id":"JW1-42","s":"塾技100","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n鏡にうつる像は、鏡をはさんで実際の物（実物）と［　　］の位置に見える（反射した光の道すじを逆にのばした位置から真っすぐ進んできたように見えるから）","a":"対称"},{"id":"JW1-43","s":"塾技100","f":"物理","u":["夏5"],"q":"次の説明にあてはまる言葉は?\n光は同じ物質の中では直進するが、ちがう物質を通るとき、その境界面で一部は反射し、残りはすべて折れ曲がって進む","a":"光の屈折"},{"id":"JW1-44","s":"塾技100","f":"物理","u":["夏5"],"q":"プリズムの一方から日光を入れると、7色の光に分かれて出てくるは?","a":"光の分散"},{"id":"JW1-45","s":"塾技100","f":"物理","u":["夏5"],"q":"次の説明にあてはまる言葉は?\n虫めがねなどに使われている、中央がまわりより厚くふくらんだレンズ","a":"凸レンズ"},{"id":"JW1-46","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n音は、音を出す物体の振動が、音を伝える物に次々に波のように伝わり、伝わった振動が耳のこ膜を振動させることによって聞こえる","a":"音の伝わり方"},{"id":"JW1-47","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n空気が音を伝える物であることを確かめる実験","a":"真空すずの実験"},{"id":"JW1-48","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n物が振動すると、そのまわりの空気に濃い部分（山）と、うすい部分（谷）がしまもようのようにできて広がる","a":"音波"},{"id":"JW1-49","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n音の強弱（大小）・音の高低・音色","a":"音の三要素"},{"id":"JW1-50","s":"塾技100","f":"物理","u":["冬3"],"q":"［　　］に入る言葉は?\n［　　］は振幅で決まり、強い音（大きい音）ほど振幅が大きくなる","a":"音の強弱"},{"id":"JW1-51","s":"塾技100","f":"物理","u":["冬3"],"q":"［　　］に入る言葉は?\n［　　］は振動数で決まり、高い音ほど振動数が多くなる","a":"音の高低"},{"id":"JW1-52","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n箱の上に弦をはり、弦の長さ・太さ・はりの強さを変えて音の高さを調べる装置","a":"モノコード"},{"id":"JW1-53","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n音が伝わる速さは、音を伝える物の種類や温度で異なる","a":"音の速さ"},{"id":"JW1-54","s":"塾技100","f":"物理","u":["冬3"],"q":"［　　］に入る言葉は?\n空気中での音の速さ：気温が0℃のとき［　　］、気温が1℃上がるごとに毎秒0.6mずつ速くなる","a":"毎秒331m"},{"id":"JW1-55","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n同じ振動数の音を出すおんさを2つ並べ、一方のおんさを鳴らすともう一方のおんさも鳴り出す現象","a":"共鳴"},{"id":"JW1-56","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n直進する光はさえぎる物があると進めないが、音は回りこむことができる現象","a":"回折"},{"id":"JW1-57","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n救急車のサイレン音のように、音を出しながら近づいてくるときの物の音は高く聞こえ、遠ざかっていくときの音は低く聞こえる現象","a":"ドップラー効果"},{"id":"JW2-1","s":"塾技100","f":"物理","u":["32"],"q":"［　　］に入る言葉は?\nばねの［　　］はおもりの重さに比例しない（のびが比例）","a":"長さ"},{"id":"JW2-2","s":"塾技100","f":"物理","u":["30"],"q":"次の説明にあてはまる言葉は?\n支点（てこを支えて動かない点）・力点（力を加える点）・作用点（力が働く点）","a":"てこの3点"},{"id":"JW2-3","s":"塾技100","f":"物理","u":["35","36"],"q":"次の説明にあてはまる言葉は?\n液体の中の物体にはたらく上向きの力","a":"浮力"},{"id":"JW2-4","s":"塾技100","f":"物理","u":["冬1","冬2"],"q":"1往復にかかる時間は?","a":"周期"},{"id":"JW2-5","s":"塾技100","f":"物理","u":["冬1","冬2"],"q":"支点からおもりの重心までの長さは?","a":"ふりこの長さ"},{"id":"JW3-1","s":"塾技100","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\nかん電池の＋極から出た電流が、豆電球などの抵抗を通らず直接導線を通って電池の−極にもどること","a":"ショート"},{"id":"JW3-2","s":"塾技100","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n電池に豆電球をつなぐと豆電球に電気が流れる","a":"電流"},{"id":"JW3-3","s":"塾技100","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n豆電球や電熱線のような電流の流れをさまたげるもの","a":"抵抗"},{"id":"JW3-4","s":"塾技100","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n電流が、電池の＋極から出てふたたび電池の−極にもどるというように、ひとまわりの道筋を流れている","a":"回路"},{"id":"JW3-5","s":"塾技100","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n流れる電流の大きさは、はかる場所によって変わる","a":"並列回路"},{"id":"JW3-6","s":"塾技100","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n枝分かれしないので、回路を流れる電流の大きさはどこも同じ","a":"直列回路"},{"id":"JW3-7","s":"塾技100","f":"物理","u":["夏8"],"q":"次の説明にあてはまる言葉は?\n電気ストーブやドライヤーなど、電流を流すと熱を出すところに使われる金属線。抵抗の大きいニクロム線がよく使われる","a":"電熱線"},{"id":"JW3-8","s":"塾技100","f":"物理","u":["夏8"],"q":"［　　］に入る言葉は?\n電熱線と水温：電熱線を用いて水をあたためる場合、水温の上昇は電熱線の発熱量に比例し、水の量に［　　］する","a":"反比例"},{"id":"JW3-9","s":"塾技100","f":"物理","u":["夏8"],"q":"次の説明にあてはまる言葉は?\n電気ストーブやドライヤーなど、電流を流すと熱を出すところに使われる金属線","a":"電熱線"},{"id":"JW3-10","s":"塾技100","f":"物理","u":["夏8"],"q":"［　　］に入る言葉は?\n抵抗の大きい［　　］がよく使われる","a":"ニクロム線"},{"id":"JW3-11","s":"塾技100","f":"物理","u":["夏7"],"q":"次の説明にあてはまる言葉は?\n抵抗が小さい方により大きな電流が流れるため、発熱量は抵抗に反比例する","a":"並列つなぎ"},{"id":"JW3-12","s":"塾技100","f":"物理","u":["8","夏7"],"q":"次の説明にあてはまる言葉は?\n回路を流れる電流の大きさは、電圧に比例し、抵抗に反比例する","a":"オームの法則"},{"id":"JW3-13","s":"塾技100","f":"物理","u":["10"],"q":"次の説明にあてはまる言葉は?\n磁石と磁石の間や磁石と鉄の間などには力がはたらいている","a":"磁界"},{"id":"JW3-14","s":"塾技100","f":"物理","u":["9"],"q":"次の説明にあてはまる言葉は?\n磁界の向きをつないだときにできる曲線","a":"磁力線"},{"id":"JW3-15","s":"塾技100","f":"物理","u":["9"],"q":"次の説明にあてはまる言葉は?\nまっすぐな導線に電流を右ねじの進む方向に流すと、導線のまわりには右ねじをしめるために回す向きの磁力線ができる","a":"右ねじの法則"},{"id":"JW3-16","s":"塾技100","f":"物理","u":["10"],"q":"次の説明にあてはまる言葉は?\nコイルの中に鉄しんを入れて電流を流すと、コイルだけのときよりはるかに強い磁界ができる。こうしてできた磁石","a":"電磁石"},{"id":"JW3-17","s":"塾技100","f":"物理","u":["10"],"q":"次の説明にあてはまる言葉は?\n円とう形のわくに導線を何回も巻きつけたもの","a":"コイル"},{"id":"JW3-18","s":"塾技100","f":"物理","u":["10"],"q":"次の説明にあてはまる言葉は?\n磁力線が出てくる方のはしがN極、磁力線が入ってくる方のはしがS極","a":"コイルの極"},{"id":"JW3-19","s":"塾技100","f":"物理","u":["10"],"q":"次の説明にあてはまる言葉は?\nコイルの中に鉄しんを入れて電流を流すと、コイルだけのときよりはるかに強い磁界ができる","a":"電磁石"},{"id":"JW3-20","s":"塾技100","f":"物理","u":["10"],"q":"次の説明にあてはまる言葉は?\nコイルに磁石を出し入れすると、コイルの中の磁界が変化し、コイルに電流が流れる","a":"電磁誘導"},{"id":"JW3-21","s":"塾技100","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n光のエネルギーを電気エネルギーに変化させる装置。かん電池とちがい電気をためておくことはできない","a":"光電池"},{"id":"JW3-22","s":"塾技100","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n電流を流すとフィラメントが発熱することによって光を出す豆電球に対し、LEDは電気を直接光に変える","a":"発光ダイオード（LED）"},{"id":"JW3-23","s":"塾技100","f":"物理","u":["10"],"q":"次の説明にあてはまる言葉は?\n電磁石の性質を利用した装置","a":"モーター"},{"id":"JW4-1","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\nはい乳・はい・種皮。子葉・はいじく・幼根の区別がしにくい","a":"イネ・トウモロコシの種子"},{"id":"JW4-2","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\nはい乳・はい・種皮","a":"イネ・トウモロコシの種子"},{"id":"JW4-3","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\n水・空気（酸素）・適当な温度。発芽後、成長していくためには、発芽の3つの条件に加え、日光・肥料が必要となる","a":"発芽の3条件"},{"id":"JW4-4","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\n水・空気（酸素）・適当な温度","a":"発芽の3条件"},{"id":"JW4-5","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\n動物のからだについて運ばれる（オナモミ）","a":"種子の運ばれ方"},{"id":"JW4-6","s":"塾技100","f":"生物","u":["5"],"q":"次の説明にあてはまる言葉は?\n葉をすかして見たときに見える葉のすじ","a":"葉脈"},{"id":"JW4-7","s":"塾技100","f":"生物","u":["6"],"q":"次の説明にあてはまる言葉は?\n植物が、体内の余分な水分を水蒸気として気孔から蒸発させる現象","a":"蒸散"},{"id":"JW4-8","s":"塾技100","f":"生物","u":["7"],"q":"次の説明にあてはまる言葉は?\n植物が光のエネルギーを利用して、葉の中にある葉緑体で水と二酸化炭素からでんぷんなどの養分をつくるはたらき","a":"光合成"},{"id":"JW4-9","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\n弱い光のもとでも生育できる","a":"陰生植物"},{"id":"JW4-10","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\n先にやく（花粉がつまっている）がある","a":"おしべ"},{"id":"JW4-11","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\nキク科（タンポポ・ヒマワリ）、ウリ科（ヘチマ・カボチャ）、ナス科（ナス・トマト・ジャガイモ）、ヒルガオ科（アサガオ）、ツツジなど","a":"合弁花"},{"id":"JW4-12","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\nアブラナ・バラ・マメなど","a":"離弁花"},{"id":"JW5-1","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\nおしべの花粉がめしべの柱頭につくこと","a":"受粉"},{"id":"JW5-2","s":"塾技100","f":"生物","u":["33"],"q":"［　　］に入る言葉は?\n受粉した花粉は花粉管をのばし、それが胚珠に達すると［　　］が起こる","a":"受精"},{"id":"JW5-3","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\n風ばい花でもあり自家受粉（花が開くとき、やくがめしべにふれる）もおこなう","a":"イネ"},{"id":"JW5-4","s":"塾技100","f":"化学","u":["2"],"q":"次の説明にあてはまる言葉は?\n日照時間に関係なく開花する植物","a":"中性植物"},{"id":"JW5-5","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\n春に発芽して秋にかれ、種子で冬をこす（ホウセンカ・アサガオ・ヒマワリ）","a":"一年草"},{"id":"JW5-6","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\nヒルガオ科の植物で、花弁がくっついた合弁花","a":"アサガオ"},{"id":"JW5-7","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\nバラ科の植物で、おしべが20〜30本と多いのが特ちょう","a":"サクラ"},{"id":"JW5-8","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\nお花のりん片にある花粉のうの中の花粉が風で飛ばされてめ花に受粉し、め花のりん片として次の年に成熟していく","a":"マツの花の受粉"},{"id":"JW5-9","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\nキク科の植物で、春に開花、秋に発芽、ロゼットとなって冬ごしをする。花は、小さな花（舌状花）がたくさん集まって1つの花のように見える","a":"タンポポ"},{"id":"JW5-10","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\nキク科の植物で、春に開花、秋に発芽、ロゼットとなって冬ごしをする","a":"タンポポ"},{"id":"JW5-11","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\nユリ科の植物で、秋に球根を植えると球根のすがたで冬ごしをする","a":"チューリップ"},{"id":"JW5-12","s":"塾技100","f":"生物","u":["33"],"q":"［　　］に入る言葉は?\nイネは花弁やがくのかわりに［　　］をもつ不完全花","a":"えい"},{"id":"JW5-13","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\nキク科の植物で、春に発芽させ、夏に花をさかせ、秋に多くの種子をつくる","a":"ヒマワリ"},{"id":"JW5-14","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\nツリフネソウ科の植物で、夏に花をさかせる離弁花","a":"ホウセンカ"},{"id":"JW5-15","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\nホウセンカやカタバミは、種子を遠くに運ぶために、実が熟すとはじけて、中から種子が飛び出す","a":"ホウセンカの成長"},{"id":"JW5-16","s":"塾技100","f":"地学","u":["春2"],"q":"次の説明にあてはまる言葉は?\n葉にはもともと緑色の色素と黄色の色素があり、気温が低くなると緑色の色素が分解され、黄色の方が目立ってくる","a":"黄葉"},{"id":"JW5-17","s":"塾技100","f":"物理","u":["33"],"q":"［　　］に入る言葉は?\n明るさと木の育ち方：木には、日光がよく当たる明るい所でないと育たない［　　］と、日かげでも良く育つ陰樹がある","a":"陽樹"},{"id":"JW5-18","s":"塾技100","f":"物理","u":["33"],"q":"［　　］に入る言葉は?\n明るさと木の育ち方：木には、日光がよく当たる明るい所でないと育たない陽樹と、日かげでも良く育つ［　　］がある","a":"陰樹"},{"id":"JW5-19","s":"塾技100","f":"地学","u":["春2"],"q":"次の説明にあてはまる言葉は?\n森林は気温の変化が小さく、風速が弱く、気温が高い","a":"森林のまわりの植物"},{"id":"JW5-20","s":"塾技100","f":"生物","u":["5"],"q":"次の説明にあてはまる言葉は?\n根・茎・葉の区別があり維管束をもつ（イヌワラビ・ゼンマイ・スギナ）","a":"シダ植物"},{"id":"JW5-21","s":"塾技100","f":"生物","u":["5"],"q":"次の説明にあてはまる言葉は?\n根・茎・葉の区別がなく維管束をもたない（ゼニゴケ・スギゴケ）","a":"コケ植物"},{"id":"JW5-22","s":"塾技100","f":"生物","u":["5","7"],"q":"次の説明にあてはまる言葉は?\nコケ植物と同じように、根・茎・葉の区別がなく維管束をもたずに光合成をおこなう水中の生物（胞子や分裂で増える","a":"ソウ類"},{"id":"JW5-23","s":"塾技100","f":"生物","u":["33"],"q":"［　　］に入る言葉は?\n子房なし：［　　］（胚珠がむき出し","a":"裸子植物"},{"id":"JW6-1","s":"塾技100","f":"生物","u":["29"],"q":"次の説明にあてはまる言葉は?\n無セキツイ動物のうち、体や足に節をもつ動物","a":"節足動物"},{"id":"JW6-2","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\nものに触れて大きさ・におい・味・音・しん動などを感じる","a":"触角"},{"id":"JW6-3","s":"塾技100","f":"生物","u":["29"],"q":"次の説明にあてはまる言葉は?\n明るさ・光の来る方向を感じる（1〜3個ある）","a":"単眼"},{"id":"JW6-4","s":"塾技100","f":"生物","u":["29"],"q":"次の説明にあてはまる言葉は?\n口のつくりは、それぞれの食べ物に適した形になっている","a":"こん虫の口・足"},{"id":"JW6-5","s":"塾技100","f":"生物","u":["29"],"q":"次の説明にあてはまる言葉は?\nアブラナ科（ダイコン・キャベツなど）の植物の葉のうらに卵 "u":["17"],"q":"［　　］に入る言葉は?\n胃＝胃液（ペプシン）が［　　］にはたらく","a":"タンパク質"},{"id":"JW7-4","s":"塾技100","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n肝臓＝たん汁が［　　］にはたらく（たん汁は肝臓でつくられ、たんのうにたくわえられる）","a":"脂肪"},{"id":"JW7-5","s":"塾技100","f":"生物","u":["17"],"q":"次の説明にあてはまる言葉は?\n3大栄養素（でんぷん・タンパク質・脂肪）のすべてにはたらく","a":"すい液"},{"id":"JW7-6","s":"塾技100","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n高温（80℃）から適温へ＝消化酵素は［　　］はたらきはもとにもどらない","a":"こわれていて"},{"id":"JW7-7","s":"塾技100","f":"生物","u":["19"],"q":"［　　］に入る言葉は?\n血管とそのつくり：［　　］＝心臓から送り出される血液が通る血管（かべは厚く丈夫だが、静脈のかべはうすい）","a":"動脈"},{"id":"JW7-8","s":"塾技100","f":"生物","u":["19"],"q":"次の説明にあてはまる言葉は?\n動脈と静脈をつなぐとても細い血管（養分などの受け渡しをする）","a":"毛細血管"},{"id":"JW7-9","s":"塾技100","f":"生物","u":["19"],"q":"［　　］に入る言葉は?\n血液の成分とはたらき：［　　］＝赤い色素ヘモグロビンをもち酸素を運ぶ（中央がくぼんだ円ばん状の形）","a":"赤血球"},{"id":"JW7-10","s":"塾技100","f":"生物","u":["19"],"q":"次の説明にあてはまる言葉は?\n細菌をつつんで食べてしまう（アメーバ状で形は不定）","a":"白血球"},{"id":"JW7-11","s":"塾技100","f":"生物","u":["19"],"q":"次の説明にあてはまる言葉は?\n出血したとき血を固まらせる（形は不定）","a":"血小板"},{"id":"JW7-12","s":"塾技100","f":"生物","u":["19","夏1"],"q":"次の説明にあてはまる言葉は?\n養分・不要物・二酸化炭素を運ぶ","a":"血しょう"},{"id":"JW7-13","s":"塾技100","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n肺胞と毛細血管中の血液との間で酸素と二酸化炭素の交換（［　　］）がおこなわれる","a":"ガス交換"},{"id":"JW7-14","s":"塾技100","f":"生物","u":["19"],"q":"次の説明にあてはまる言葉は?\n心臓から出た血液が、体の各器官をまわった後、ふたたび心臓にもどる道すじには、肺循環と体循環の2つがある","a":"血液の循環"},{"id":"JW7-15","s":"塾技100","f":"生物","u":["19"],"q":"次の説明にあてはまる言葉は?\n心臓から出た血液が肺を通って心臓へもどる循環","a":"肺循環"},{"id":"JW7-16","s":"塾技100","f":"生物","u":["19"],"q":"次の説明にあてはまる言葉は?\n心臓から出た血液が全身をめぐって心臓へもどる循環","a":"体循環"},{"id":"JW7-17","s":"塾技100","f":"化学","u":["25"],"q":"［　　］に入る言葉は?\n細胞の呼吸と不要物：体じゅうの細胞が生きるためのエネルギーを得るために、養分と酸素を分解してエネルギーをつくるはたらきを［　　］という","a":"内呼吸"},{"id":"JW7-18","s":"塾技100","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\nアミノ酸が呼吸で分解＝二酸化炭素・水・［　　］ができる","a":"有害なアンモニア"},{"id":"JW7-19","s":"塾技100","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n骨と筋肉：人の体は約200個の骨が組み合わさって骨格をつくっている。骨には［　　］という筋肉がついていて、縮んだりゆるんだりして骨を動かす","a":"骨格筋"},{"id":"JW7-20","s":"塾技100","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n骨には［　　］という筋肉がついていて、縮んだりゆるんだりして骨を動かす","a":"骨格筋"},{"id":"JW8-1","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n晴れた日の気温と湿度の関係：気温が上がると湿度が下がり、気温が下がると湿度が上がる（［　　］）","a":"反対の変化"},{"id":"JW8-2","s":"塾技100","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n空気にふくむことのできる水蒸気の量には限度がある","a":"飽和水蒸気量"},{"id":"JW8-3","s":"塾技100","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n空気1m³がふくむことのできる最大の水蒸気の量を［　　］という","a":"飽和水蒸気量"},{"id":"JW8-4","s":"塾技100","f":"化学","u":["25"],"q":"［　　］に入る言葉は?\n⇨ 空気にふくみきれなくなった水蒸気（気体）が、［　　］となって出てくる","a":"水滴（液体）"},{"id":"JW8-6","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n雲：上空にできる小さな［　　］を雲という。それらの粒が落ちてこないのは、上昇気流（上昇する空気の流れ）でささえられているため","a":"水滴や氷の粒の集まり"},{"id":"JW8-7","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n雲：上空にできる小さな水滴や氷の粒の集まりを雲という。それらの粒が落ちてこないのは、［　　］（上昇する空気の流れ）でささえられているため","a":"上昇気流"},{"id":"JW8-9","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n雲：上空にできる小さな［　　］を雲という","a":"水滴や氷の粒の集まり"},{"id":"JW8-14","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n風：風の正体は［　　］である。空気は、気圧の高い方から低い方へ向かって動くので、風は、気圧の高い方から低い方へ向かってふく","a":"空気の流れ"},{"id":"JW8-15","s":"塾技100","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n風は気圧の高い所から低い所へ向かってふくので、2地点の気圧の差があるとき発生する","a":"風の発生"},{"id":"JW8-16","s":"塾技100","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n夏は大陸が太平洋よりもあたたかくなるため、太平洋から大陸へ向かってしめった南東の風がふく","a":"季節風"},{"id":"JW8-17","s":"塾技100","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n冷たい空気とあたたかい空気のかたまりがふれ合っても、すぐには混じり合わずに境目ができる","a":"前線"},{"id":"JW8-18","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n日本付近の前線は、上空の［　　］（強い西よりの風）によって西から東へ移動する","a":"偏西風"},{"id":"JW8-19","s":"塾技100","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n通過後、気温が下がり、北よりの風がふく","a":"寒冷前線"},{"id":"JW8-20","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n空全体の面積を10としたとき、雲がしめる面積の割合を［　　］という","a":"雲量"},{"id":"JW8-21","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n日本の天気：日本の天気の特ちょうは、それぞれの季節に日本のまわりの大陸や海洋に現れる［　　］で決まる","a":"3つの高気圧（気団）"},{"id":"JW8-22","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n（［　　］：快晴・晴れ・くもり・雨・雪・みぞれ・あられ・ひょう・かみなり","a":"天気記号"},{" レブ・基礎力","f":"地学","u":["11","12"],"q":"［　　］に入る言葉は?\n月の自転と公転の周期が同じなので、地球は空の［　　］に見え、1日で少し満ちる（月が欠けていく向きと反対）","a":"同じ位置"},{"id":"GR-123","s":"グノレブ・基礎力","f":"地学","u":["11","12"],"q":"［　　］に入る言葉は?\n月の自転と公転の周期が同じなので、地球は空の同じ位置に見え、1日で［　　］（月が欠けていく向きと反対）","a":"少し満ちる"},{"id":"GR-124","s":"グノレブ・基礎力","f":"物理","u":["30"],"q":"［　　］に入る言葉は?\n棒の重さは中央（太さが一様なとき）にかかる。支点の反対側のおもりは回転を［　　］側","a":"助ける"},{"id":"GR-125","s":"グノレブ・基礎力","f":"物理","u":["30"],"q":"［　　］に入る言葉は?\n支点の反対側のおもりは回転を［　　］側","a":"助ける"},{"id":"GR-127","s":"グノレブ・基礎力","f":"物理","u":["10"],"q":"［　　］に入る言葉は?\nじしゃくにつくのは［　　］。10円玉（銅）・プラスチックはつかない","a":"鉄・ニッケル・コバルト"},{"id":"GR-128","s":"グノレブ・基礎力","f":"物理","u":["10"],"q":"［　　］に入る言葉は?\nN極で針をAから右へこすると、こすり終わりの右はしがS、AはN極。方位じしんのN極に真上から近づけると、針が［　　］反対向きで止まる","a":"180度まわって"},{"id":"GR-129","s":"グノレブ・基礎力","f":"物理","u":["10"],"q":"［　　］に入る言葉は?\nだから日本でもオーストラリアでも、ぼうじしゃくのN極は［　　］を向く","a":"北"},{"id":"GR-130","s":"グノレブ・基礎力","f":"物理","u":["10"],"q":"［　　］に入る言葉は?\nぼうじしゃくの上側の中央（㋑）では方位じしんのN極は［　　］を向く","a":"S極の側（右）"},{"id":"GR-131","s":"グノレブ・基礎力","f":"物理","u":["10"],"q":"［　　］に入る言葉は?\n方位じしんのN極に真上から近づけると、針が［　　］反対向きで止まる","a":"180度まわって"},{"id":"GR-132","s":"グノレブ・基礎力","f":"物理","u":["13","14","30"],"q":"［　　］に入る言葉は?\n分銅は［　　］にのせる。重すぎたらおろして次に軽いものへ","a":"重い順"},{"id":"GR-133","s":"グノレブ・基礎力","f":"物理","u":["冬1","冬2"],"q":"［　　］に入る言葉は?\n溶けのこりがあっても、溶けている部分のこさは［　　］（エ）。溶けのこりを溶かすには水を加える（くだく・かきまぜるは溶ける速さが変わるだけ）","a":"すべて同じ"},{"id":"GR-134","s":"グノレブ・基礎力","f":"化学","u":["20"],"q":"［　　］に入る言葉は?\n食塩の結晶は［　　］（ア）。ミョウバンは正八面体（イ）","a":"立方体"},{"id":"GR-135","s":"グノレブ・基礎力","f":"化学","u":["20"],"q":"［　　］に入る言葉は?\n大きな結晶は［　　］水を蒸発させると（風通しのよいところに置く）できる","a":"ゆっくり"},{"id":"GR-142","s":"グノレブ・基礎力","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n空きビンの口の十円玉がカタカタ動くのは［　　］がぼう張したから（イ）","a":"ビンの中の空気"},{"id":"GR-143","s":"グノレブ・基礎力","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n加熱のはじめの小さなあわ＝水にとけていた空気（ウ）。ふっとう（100℃）のときの大きなあわ＝［　　］（イ）","a":"水蒸気"},{"id":"GR-144","s":"グノレブ・基礎力","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\nふっとう（100℃）のときの大きなあわ＝［　　］（イ）","a":"水蒸気"},{"id":"GR-146","s":"グノレブ・基礎力","f":"生 {"id":"GR-252","s":"グノレブ・基礎力","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\n冬の大三角＝プロキオン（あ）・ベテルギウス（い）・シリウス（え）＝［　　］（イ）。リゲルは冬の大三角ではない","a":"あ・い・え"},{"id":"GR-253","s":"グノレブ・基礎力","f":"地学","u":["15"],"q":"次の説明にあてはまる言葉は?\n東の地平線から出るとき三つ星は縦にならぶ（イ）、南中のころ斜め、西にしずむとき横にならぶ","a":"オリオン座の通り道"},{"id":"GR-255","s":"グノレブ・基礎力","f":"地学","u":["12"],"q":"月のくぼみは?","a":"クレーター"},{"id":"GR-256","s":"グノレブ・基礎力","f":"物理","u":["13","14","30"],"q":"［　　］に入る言葉は?\n40gを［　　］につるすと80をこえてしまう","a":"3以上"},{"id":"GR-259","s":"グノレブ・基礎力","f":"生物","u":["29"],"q":"［　　］に入る言葉は?\n冬が近づくと黄色になる葉：［　　］（ウ）。カエデ・サクラ（赤〜茶）、マツ・ツバキは常緑","a":"イチョウ"},{"id":"GR-260","s":"グノレブ・基礎力","f":"生物","u":["29"],"q":"［　　］に入る言葉は?\n冬が近づくと黄色になる葉：［　　］（ウ）","a":"イチョウ"},{"id":"GR-261","s":"グノレブ・基礎力","f":"地学","u":["春2"],"q":"次の説明にあてはまる言葉は?\n太陽の高度が夏は高く冬は低い（イ）、昼の長さ（日の出から日の入りまで）が夏は長く冬は短い（エ）","a":"夏暑く冬寒い理由"},{"id":"GR-262","s":"グノレブ・基礎力","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n雲と雨：夏の午後、短い時間にはげしくふる雨＝［　　］","a":"夕立"},{"id":"GR-263","s":"グノレブ・基礎力","f":"物理","u":["30"],"q":"次の説明にあてはまる言葉は?\n左皿にはかりたいもの、右皿に分銅。分銅は重いものから順にのせ、右皿が下がったら（分銅が重すぎたら）その分銅をおろす","a":"上皿てんびん（右利き）"},{"id":"GR-264","s":"グノレブ・基礎力","f":"物理","u":["30"],"q":"［　　］に入る言葉は?\n（作用点が中央）＝力点より作用点の方が［　　］がはたらくが、動きは小さい（イ）","a":"必ず大きな力"},{"id":"GR-265","s":"グノレブ・基礎力","f":"物理","u":["30"],"q":"［　　］に入る言葉は?\n（作用点が中央）＝力点より作用点の方が必ず大きな力がはたらくが、動きは［　　］（イ）","a":"小さい"},{"id":"GR-266","s":"グノレブ・基礎力","f":"物理","u":["30"],"q":"［　　］に入る言葉は?\nつめ切り（2種類のてこの組み合わせ）：支点＝ア・カ、［　　］","a":"作用点＝イ・エ"},{"id":"GR-267","s":"グノレブ・基礎力","f":"物理","u":["30"],"q":"次の説明にあてはまる言葉は?\n左皿にはかりたいもの、右皿に分銅","a":"上皿てんびん（右利き）"},{"id":"GR-270","s":"グノレブ・基礎力","f":"生物","u":["5"],"q":"次の説明にあてはまる言葉は?\nチューリップ・イネ（ア）・ツユクサ（エ）は、葉が平行脈・根はひげ根","a":"単子葉植物"},{"id":"GR-271","s":"グノレブ・基礎力","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\n最も明るい星＝［　　］で、それを含む星座＝おおいぬ（座）","a":"B（シリウス）"},{"id":"GR-272","s":"グノレブ・基礎力","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\n最も明るい星＝B（シリウス）で、それを含む星座＝［　　］（座）","a":"おおいぬ"},{"id":"GR-273","s":"グノレブ・基礎力","f":"化学","u":["春1"],"q":"小さな水のつぶ）、E（大きなあわ）は?","a":"水蒸気（ウ）"},{"id":"GR-274","s" ル4年","f":"地学","u":["4年","春2"],"q":"次の説明にあてはまる言葉は?\n地面に垂直に立てたぼうのかげの先が1日に動いたあとを結んでできる線","a":"日かげ曲線"},{"id":"G4T-125","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"次の説明にあてはまる言葉は?\n後ろあしが太くてとびはねやすい","a":"バッタ"},{"id":"G4T-126","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"次の説明にあてはまる言葉は?\nつめがあって木を登りやすい","a":"カブトムシ"},{"id":"G4T-127","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"次の説明にあてはまる言葉は?\nかまのような形をしていて虫をつかまえやすい","a":"カマキリ"},{"id":"G4T-128","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"次の説明にあてはまる言葉は?\nシャベルのようになっていて土をほりやすい（土の中で生活）","a":"ケラ"},{"id":"G4T-129","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"次の説明にあてはまる言葉は?\n毛があって水をかきやすい（水の中で生活）","a":"ゲンゴロウ"},{"id":"G4T-130","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n足に節があり、からだの外側がかたいから（外骨格）でからだの内部を守っている動物を［　　］という","a":"節足動物"},{"id":"G4T-131","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"次の説明にあてはまる言葉は?\n卵→幼虫→さなぎ→成虫（さなぎの時期がある）","a":"完全変態"},{"id":"G4T-132","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"次の説明にあてはまる言葉は?\n卵→幼虫→成虫（さなぎの時期がない）","a":"不完全変態"},{"id":"G4T-133","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n卵から幼虫が出ることを［　　］という","a":"ふ化"},{"id":"G4T-134","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\nこん虫が成虫になることを［　　］という","a":"羽化"},{"id":"G4T-135","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n不完全変態では同じ（トンボのように、幼虫は水中・成虫は［　　］という例もある）","a":"陸上"},{"id":"G4T-136","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n［　　］（キャベツ・ハクサイ・ダイコン・カブ・ナズナなど）の植物の葉のうらに1つずつ産みつけられる","a":"アブラナ科"},{"id":"G4T-137","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\nアブラナ科（キャベツ・ハクサイ・ダイコン・カブ・ナズナなど）の植物の［　　］に1つずつ産みつけられる","a":"葉のうら"},{"id":"G4T-138","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n頭・むね・はらの3部分。頭には［　　］（複眼はない）・しょっ角・口（かむ口。アブラナ科の葉をえさにするため）がある","a":"単眼"},{"id":"G4T-139","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n頭・むね・はらの3部分。頭には単眼（複眼はない）・［　　］・口（かむ口。アブラナ科の葉をえさにするため）がある","a":"しょっ角"},{"id":"G4T-140","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\nさなぎは［　　］（まわりの物とにた色の目立たない色）をしている。葉のうらでは緑色、えだでは茶色。目的は天敵に見つかりにくくするため","a":"ほご色"},{"id":"G4T-141","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n夏はさなぎになって1週間ほどではねのもようや色がすけて見え、背中の方がわれて成虫が出てくる。こん虫が成虫になることを［　　］という","a":"羽化"},{"id":"G4T-142","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\nはら：たくさんの節に分かれ、節の左右の［　　］から空気を取り入れ、気管でこきゅうする。幼虫にあった10本のきゅうばんのような足はない","a":"気門"},{"id":"G4T-143","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\nはら：たくさんの節に分かれ、節の左右の気門から空気を取り入れ、［　　］でこきゅうする。幼虫にあった10本のきゅうばんのような足はない","a":"気管"},{"id":"G4T-144","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"次の説明にあてはまる言葉は?\n卵→幼虫→さなぎ→成虫","a":"完全変態"},{"id":"G4T-145","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\nまゆをにた後、ぬるま湯につけて糸を取り出せるところをさがし、数本をより集めていったものを［　　］という","a":"生糸"},{"id":"G4T-146","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"次の説明にあてはまる言葉は?\n女王バチと交尾するために女王バチが産む","a":"オスバチ"},{"id":"G4T-147","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"次の説明にあてはまる言葉は?\nミーンミンミンミー・サクラ、ケヤキなど","a":"ミンミンゼミ"},{"id":"G4T-148","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"次の説明にあてはまる言葉は?\nジージリジリ・サクラ、ケヤキなど","a":"アブラゼミ"},{"id":"G4T-149","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"次の説明にあてはまる言葉は?\nシャーシャー・サクラ、ケヤキなど","a":"クマゼミ"},{"id":"G4T-150","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n卵：だ円形。はじめはうすい黄色、少しずつこくなり、ふ化直前は1令幼虫がすけて［　　］になる","a":"黒色"},{"id":"G4T-151","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n卵：夏の終わりごろ、メスが土の中や［　　］に、丸い卵を1つずつ産む。1ぴきのメスが産む卵は30〜50個、大きさ約3mm。約10日でふ化","a":"落ち葉の下"},{"id":"G4T-152","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n甲虫類の冬ごし：カブトムシは［　　］、テントウムシは落ち葉の下などに集まって（成虫）、ゲンゴロウは水中で成虫のすがたで冬をこす","a":"幼虫"},{"id":"G4T-153","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n幼虫（ヤゴ）：水中で生活し、イトミミズやメダカなど水中の小さな生物をえさにして［　　］。こきゅうはえら","a":"かむ口"},{"id":"G4T-154","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n幼虫（ヤゴ）：水中で生活し、イトミミズやメダカなど水中の小さな生物をえさにしてかむ口。こきゅうは［　　］","a":"えら"},{"id":"G4T-155","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\nエンマコオロギ・スズムシ・マツムシ・キリギリスなど［　　］に鳴くこん虫が多い。成虫のオスは前ばねをこすり合わせて鳴く（メスをひきよせる）","a":"秋"},{"id":"G4T-156","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\nエンマコオロギ・スズムシ・マツムシ・キリギリスなど秋に鳴くこん虫が多い。成虫の［　　］は前ばねをこすり合わせて鳴く（メスをひきよせる）","a":"オス"},{"id":"G4T-157","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n卵：秋、メスが［　　］を地面にさして地中に産みつけ、卵のまま冬をこす","a":"産卵管"},{"id":"G4T-158","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n卵：秋、メスが産卵管を地面にさして地中に産みつけ、［　　］をこす","a":"卵のまま冬"},{"id":"G4T-159","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n卵：メスが産卵管を［　　］などにさして産みつける。多くのセミは次の年の梅雨の時期にふ化","a":"かれ木や木の皮"},{"id":"G4T-160","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n卵：メスが産卵管をかれ木や木の皮などにさして産みつける。多くのセミは次の年の［　　］にふ化","a":"梅雨の時期"},{"id":"G4T-161","s":"グノーブル4年","f":"生物","u":["4年","29"],"q":"［　　］に入る言葉は?\n冬ごしのすがた：セミは［　　］のすがたで冬をこす（数年間土の中）","a":"幼虫"},{"id":"G4T-163","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"次の説明にあてはまる言葉は?\nつぶの動き：固体","a":"わずかにふるえている"},{"id":"G4T-164","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"次の説明にあてはまる言葉は?\nはげしく動いている","a":"気体"},{"id":"G4T-165","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"次の説明にあてはまる言葉は?\n熱がものの内部を、温度の高い方から低い方へ順に伝わっていく熱の伝わり方","a":"伝導"},{"id":"G4T-166","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"次の説明にあてはまる言葉は?\n熱がものの内部を、温度の高い方から低い方へ順に伝わっていく熱の伝わり方。熱している点に近いところから順に熱が伝わる","a":"伝導"},{"id":"G4T-167","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"［　　］に入る言葉は?\n熱を伝えやすいもの＝熱の良導体（金属）、熱を伝えにくいもの＝熱の［　　］（ガラス・水・木・空気など）","a":"不良導体"},{"id":"G4T-168","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"次の説明にあてはまる言葉は?\nあたためられた水がぐるぐる回るように流れて、全体の温度が上がっていく熱の伝わり方","a":"対流"},{"id":"G4T-169","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"次の説明にあてはまる言葉は?\n熱を出すものから直接熱が伝わってあたたまる熱の伝わり方","a":"放射"},{"id":"G4T-170","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"［　　］に入る言葉は?\n放射で伝わる熱を［　　］という","a":"放射熱"},{"id":"G4T-171","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"［　　］に入る言葉は?\nものから熱が放射されることによって温度が下がることを［　　］という","a":"放射冷却"},{"id":"G4T-172","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"次の説明にあてはまる言葉は?\n液体・気体が流れて全体があたたまる（ストーブで部屋全体・おふろをかきまぜる・季節風・クーラー・試験管の底を熱する）","a":"対流"},{"id":"G4T-173","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"次の説明にあてはまる言葉は?\n直接熱が伝わる（太陽・ひなたぼっこ・ストーブの鏡の金属板・ストーブの前だけあたたかい）","a":"放射"},{"id":"G4T-174","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"［　　］に入る言葉は?\nものはあたためられるとぼう張して体積が増える。ぼう張したものは、同じ体積あたりで重さをくらべると［　　］なる（重さそのものは変わらない）","a":"軽く"},{"id":"G4T-175","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"［　　］に入る言葉は?\nものは冷やされると収縮して体積が減る。収縮したものは、同じ体積あたりで重さをくらべると［　　］なる","a":"重く"},{"id":"G4T-176","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"次の説明にあてはまる言葉は?\nあたためられた水がぐるぐる回るように流れて、全体の温度が上がっていく熱の伝わり方。水のような液体だけでなく、空気のような気体でも起こる","a":"対流"},{"id":"G4T-177","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"［　　］に入る言葉は?\n空気もあたためられるとぼう張して軽くなり［　　］し、それよりも冷たく重い空気が下降して対流が起こる。火をつけた線香を箱に入れ、けむりの流れで見る","a":"上昇"},{"id":"G4T-178","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"［　　］に入る言葉は?\n空気もあたためられるとぼう張して軽くなり上昇し、それよりも冷たく重い空気が［　　］して対流が起こる。火をつけた線香を箱に入れ、けむりの流れで見る","a":"下降"},{"id":"G4T-179","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"［　　］に入る言葉は?\n放射＝熱を出すものから直接熱が伝わってあたたまる熱の伝わり方。放射で伝わる熱を［　　］という。途中の空気は素通りする","a":"放射熱"},{"id":"G4T-180","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"次の説明にあてはまる言葉は?\n目にはっきり見え、形が決まっていて、圧力や温度が変化してもほとんど体積は変わらない。つぶが動かない（つぶがくっついている）","a":"固体"},{"id":"G4T-181","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"次の説明にあてはまる言葉は?\n目にはっきり見えるが形は決まっていない（容器に合わせて変化）。圧力や温度が変化してもほとんど体積は変わらない。つぶが動ける","a":"液体"},{"id":"G4T-182","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"［　　］に入る言葉は?\n水蒸気は目に見えない。［　　］は水蒸気が細かい水のつぶとなったもの（見える）","a":"湯気"},{"id":"G4T-183","s":"グノーブル4年","f":"化学","u":["4年","春1"],"q":"［　　］に入る言葉は?\n水が蒸発して水蒸気になるとき、まわりから熱をうばう。この熱を［　　］という","a":"気化熱"},{"id":"G4T-184","s":"グノーブル4年","f":"地学","u":["4年","34"],"q":"次の説明にあてはまる言葉は?\n空全体を10として、そのうちどれくらい雲がおおっているかを表す数","a":"雲量"},{"id":"G4T-185","s":"グノーブル4年","f":"地学","u":["4年","34"],"q":"次の説明にあてはまる言葉は?\n風がふいてくる方向","a":"風向"},{"id":"G4T-186","s":"グノーブル4年","f":"地学","u":["4年","34"],"q":"次の説明にあてはまる言葉は?\n地上10mの地点で、1秒間に空気（風）が何m動くか（m/秒）","a":"風速"},{"id":"G4T-187","s":"グノーブル4年","f":"地学","u":["4年","34"],"q":"次の説明にあてはまる言葉は?\n北から南へふく風で風向は北","a":"北風"},{"id":"G4T-188","s":"グノーブル4年","f":"地学","u":["4年","34"],"q":"次の説明にあてはまる言葉は?\n降った雨や雪の水平な面にたまった水の深さを「mm」で表す","a":"降水量"},{"id":"G4T-189","s":"グノーブル4年","f":"地学","u":["4年","34"],"q":"次の説明にあてはまる言葉は?\n空気が地面をおす力","a":"気圧"},{"id":"G4T-190","s":"グノーブル4年","f":"地学","u":["4年","34"],"q":"［　　］に入る言葉は?\nまわりよりも気圧の低いところを［　　］という","a":"低気圧"},{"id":"G4T-191","s":"グノーブル4年","f":"地学","u":["4年","34"],"q":"［　　］に入る言葉は?\nまわりよりも気圧の高いところを［　　］という","a":"高気圧"},{"id":"G4T-192","s":"グノーブル4年","f":"地学","u":["4年","34"],"q":"次の説明にあてはまる言葉は?\nまわりよりあたたかい空気が発達し、あたたかい空気はぼう張して軽いため上昇気流が起こり、まわりより地面をおす力が小さくなる","a":"低気圧"},{"id":"G4T-193","s":"グノーブル4年","f":"地学","u":["4年","34"],"q":"［　　］に入る言葉は?\n日本の上空には［　　］という強い西風がふいている","a":"偏西風"},{"id":"G4T-194","s":"グノーブル4年","f":"地学","u":["4年","34"],"q":"次の説明にあてはまる言葉は?\n水蒸気をあまりふくんでいない太平洋側でふく冬の風","a":"からっ風"},{"id":"G4T-195","s":"グノーブル4年","f":"地学","u":["4年","34"],"q":"次の説明にあてはまる言葉は?\n陸の方が海よりあたたまりやすく冷めやすい（水・砂の実験：砂の上の空気があたためられて上昇し、そこへ水の上の空気が流れこむ","a":"海風の関係"},{"id":"G4T-196","s":"グノーブル4年","f":"地学","u":["4年","34"],"q":"次の説明にあてはまる言葉は?\n地上10mの地点で、1秒間に空気（風）が何m動くか（m/秒）。観測時こく前の10分間の平均","a":"風速"},{"id":"G4T-197","s":"グノーブル4年","f":"生物","u":["4年","7"],"q":"［　　］に入る言葉は?\n葉緑体は光のエネルギーを［　　］という色素をふくむ","a":"吸収する葉緑素"},{"id":"G4T-198","s":"グノーブル4年","f":"生物","u":["4年","7"],"q":"［　　］に入る言葉は?\nわかること：AとBから光合成には［　　］が必要。AとCから光合成には葉緑体が必要","a":"日光"},{"id":"G4T-199","s":"グノーブル4年","f":"生物","u":["4年","7"],"q":"［　　］に入る言葉は?\nわかること：AとBから光合成には日光が必要。AとCから光合成には［　　］が必要","a":"葉緑体"},{"id":"G4T-200","s":"グノーブル4年","f":"生物","u":["4年","5"],"q":"［　　］に入る言葉は?\n発芽のとき子葉を2枚出す植物＝［　　］、子葉を1枚出す植物＝単子葉植物。子葉の枚数とからだのつくりには大きな関係がある","a":"双子葉植物"},{"id":"G4T-201","s":"グノーブル4年","f":"生物","u":["4年","5"],"q":"［　　］に入る言葉は?\n発芽のとき子葉を2枚出す植物＝双子葉植物、子葉を1枚出す植物＝［　　］。子葉の枚数とからだのつくりには大きな関係がある","a":"単子葉植物"},{"id":"G4T-202","s":"グノーブル4年","f":"生物","u":["4年","5"],"q":"［　　］に入る言葉は?\n無はいにゅう種子：発芽のための養分を［　　］にたくわえている。有はいにゅう種子：発芽のための養分をはいにゅうにたくわえている","a":"子葉"},{"id":"G4T-203","s":"グノーブル4年","f":"生物","u":["4年","5"],"q":"次の説明にあてはまる言葉は?\n太い根の主根から細い根の側根が出ている","a":"双子葉植物"},{"id":"G4T-204","s":"グノーブル4年","f":"生物","u":["4年","5"],"q":"次の説明にあてはまる言葉は?\n茎のつけ根から、たくさんの細い根が出ている。これをひげ根という","a":"単子葉植物"},{"id":"G4T-205","s":"グノーブル4年","f":"生物","u":["4年","5"],"q":"［　　］に入る言葉は?\n根は水を吸収する部分なので、水を運ぶ道管が発達している。中心から放射状に広がった道管の間に、葉でつくられた養分を運ぶ［　　］がある","a":"師管"},{"id":"G4T-206","s":"グノーブル4年","f":"生物","u":["4年","6"],"q":"［　　］に入る言葉は?\n葉にも道管や師管が通っていて、道管と師管の集まりを［　　］という","a":"葉脈"},{"id":"G4T-207","s":"グノーブル4年","f":"生物","u":["4年","6"],"q":"［　　］に入る言葉は?\n緑色なのは［　　］という緑色の色素をもつから","a":"葉緑素"},{"id":"G4T-208","s":"グノーブル4年","f":"生物","u":["4年","6"],"q":"［　　］に入る言葉は?\n葉から水蒸気が出るのは［　　］というあなから","a":"気孔"},{"id":"G4T-209","s":"グノーブル4年","f":"生物","u":["4年","6"],"q":"次の説明にあてはまる言葉は?\n維管束は散らばっている（内側が道管、外側が師管）","a":"茎"},{"id":"G4T-210","s":"グノーブル4年","f":"生物","u":["4年","6"],"q":"次の説明にあてはまる言葉は?\n形成層があり、維管束は輪のようにならんでいる","a":"茎"},{"id":"G4T-211","s":"グノーブル4年","f":"生物","u":["4年","6"],"q":"［　　］に入る言葉は?\n単子葉植物：葉のつけ根から何本もの葉脈がほぼ平行に出ている。［　　］","a":"平行脈"},{"id":"G4T-212","s":"グノーブル4年","f":"生物","u":["4年","6"],"q":"［　　］に入る言葉は?\n双子葉植物：中心に太い葉脈（道管と師管の集まり）があり、そこから細い葉脈が網の目のように全体に広がっている。［　　］","a":"網状脈"},{"id":"G4T-214","s":"グノーブル4年","f":"生物","u":["4年","6"],"q":"［　　］に入る言葉は?\n気孔は孔辺細胞によってつくられたすき間。孔辺細胞が水分を多くふくんだときに気孔が［　　］、水分が不足すると気孔が閉じるつくり","a":"開き"},{"id":"G4T-215","s":"グノーブル4年","f":"生物","u":["4年","6"],"q":"［　　］に入る言葉は?\n気孔は孔辺細胞によってつくられたすき間。孔辺細胞が水分を多くふくんだときに気孔が開き、水分が不足すると気孔が［　　］つくり","a":"閉じる"},{"id":"G4T-216","s":"グノーブル4年","f":"生物","u":["4年","6"],"q":"［　　］に入る言葉は?\n蒸散を確かめるために使う。塩化コバルト紙は、かんそうしているときは［　　］、水分をふくむと赤色に変わる","a":"青色"},{"id":"G4T-217","s":"グノーブル4年","f":"生物","u":["4年","6"],"q":"［　　］に入る言葉は?\n蒸散を確かめるために使う。塩化コバルト紙は、かんそうしているときは青色、水分をふくむと［　　］に変わる","a":"赤色"},{"id":"G4T-218","s":"グノーブル4年","f":"生物","u":["4年"],"q":"次の説明にあてはまる言葉は?\n冬が近づいて葉を落とす木","a":"落葉樹"},{"id":"G4T-219","s":"グノーブル4年","f":"生物","u":["4年"],"q":"次の説明にあてはまる言葉は?\nコロコロコロリー","a":"エンマコオロギ"},{"id":"G4T-220","s":"グノーブル4年","f":"生物","u":["4年"],"q":"次の説明にあてはまる言葉は?\nチンチロリンチンチロリン","a":"マツムシ"},{"id":"G4T-221","s":"グノーブル4年","f":"生物","u":["4年"],"q       var n = 0;
      Object.keys(o.S || {}).forEach(function(k){ var a = S[k], b = o.S[k]; if (!a || (b && (b.l > a.l || (b.l === a.l && b.d > a.d)))){ S[k] = b; n++; } });
      if (o.P){ if ((o.P.xp || 0) > (P.xp || 0)){ P.xp = o.P.xp; P.sci = o.P.sci || P.sci; P.sciStart = o.P.sciStart || P.sciStart; } P.scis = Object.assign({}, o.P.scis || {}, P.scis || {}); var pr = Object.assign({}, o.P.prog || {}); Object.keys(P.prog || {}).forEach(function(k){ pr[k] = Math.max(pr[k] || 0, P.prog[k]); }); P.prog = pr; P.streak = Math.max(P.streak || 0, o.P.streak || 0); }
      saveS(); saveP(); initSci(); buildHome();
      $('bkmsg').textContent = '読み込みました(' + n + '問分を更新)。';
    } catch(e){ $('bkmsg').textContent = 'コードが読めません。「コードを出す」で出た文字を、そのまま全部貼りつけてください。'; }
  };
  var resetStep = 0;
  $('resetall').onclick = function(){
    var box = $('resetbox'); box.innerHTML = ''; resetStep = 1; box.classList.remove('hide');
    var p = document.createElement('p'); p.textContent = '学習の記録(ランク・ポイント・仲間)をぜんぶ消しますか?'; box.appendChild(p);
    var b1 = document.createElement('button'); b1.className = 'btn ng'; b1.textContent = '消す'; var b2 = document.createElement('button'); b2.className = 'btn ghost'; b2.textContent = 'やめる';
    box.appendChild(b1); box.appendChild(b2);
    b2.onclick = function(){ box.classList.add('hide'); resetStep = 0; };
    b1.onclick = function(){
      if (resetStep === 1){ resetStep = 2; p.textContent = '本当に消しますか?もとにはもどせません。'; b1.textContent = '本当に消す'; return; }
      S = {}; saveS(); P = {xp:0, mute:P.mute, day:'', streak:0, sci:'me', sciStart:1, scis:{}, prog:{}}; saveP();
      try { localStorage.removeItem(KEY); localStorage.removeItem(PKEY); } catch(e){}
      box.classList.add('hide'); resetStep = 0; buildHome();
    };
  };

  initSci();
  buildHome();
  // 予定表(schedule.json)があれば読み込んで、授業日に合わせて回を開く
  try {
    fetch('schedule.json?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
      if (!j) return;
      if (j.open) Object.keys(j.open).forEach(function(u){ CFG.open[u] = j.open[u]; });
      if (j.gnorev) CFG.gnorev = j.gnorev;
      if (j.units) Object.keys(j.units).forEach(function(u){ UNITNAME[u] = j.units[u]; });
      if (j.updated) CFG.schedVer = j.updated;
      if ($('home') && !$('home').classList.contains('hide')) buildHome();
    }).catch(function(){});
  } catch(e){}
  window.__ichimon = { S: function(){ return S; }, P: function(){ return P; }, WAIT: WAIT, DATA: DATA, CFG: CFG, SCI: SCI, lvOf: lvOf, changeSci: changeSci };
})();
</script>
