ら水蒸気として体外へ出す働き","a":"蒸散作用"},{"id":"WS5a-5","s":"ウイニングステップ5年","f":"生物","u":["28"],"q":"次の説明にあてはまる言葉は?\n4枚、2枚、0枚のどれか","a":"羽の数"},{"id":"WS5a-6","s":"ウイニングステップ5年","f":"生物","u":["29"],"q":"次の説明にあてはまる言葉は?\n卵・幼虫・さなぎ・成虫のどの時期で冬ごしをするか","a":"冬ごしのようす"},{"id":"WS5a-7","s":"ウイニングステップ5年","f":"生物","u":["28"],"q":"次の説明にあてはまる言葉は?\nかむ口・吸う口・なめる口のどれか","a":"口の形"},{"id":"WS5a-8","s":"ウイニングステップ5年","f":"地学","u":["22"],"q":"けずり取った土砂を運ぶ働きは?","a":"運ばん作用"},{"id":"WS5a-9","s":"ウイニングステップ5年","f":"地学","u":["22"],"q":"運んできた土砂を積もらせる働きは?","a":"たい積作用"},{"id":"WS5a-10","s":"ウイニングステップ5年","f":"地学","u":["22"],"q":"［　　］に入る言葉は?\n川の流れによって運ばれてきた土砂が海底にたい積した層や、火山灰がたい積した層などがいくつも重なってできたものを［　　］という","a":"地層"},{"id":"WS5a-11","s":"ウイニングステップ5年","f":"地学","u":["22"],"q":"［　　］に入る言葉は?\n地層で見られる変化：［　　］（両側からゆっくりおされる）","a":"しゅう曲"},{"id":"WS5b-1","s":"ウイニングステップ5年","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\n北の空の星座：1年中見ることができ、［　　］を中心に反時計回りに動いて見える","a":"北極星"},{"id":"WS5b-2","s":"ウイニングステップ5年","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\n北の空の星座：1年中見ることができ、北極星を中心に［　　］に動いて見える","a":"反時計回り"},{"id":"WS5b-3","s":"ウイニングステップ5年","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\n夏の南の空にはさそり座（赤い1等星［　　］）","a":"アンタレス"},{"id":"WS5b-4","s":"ウイニングステップ5年","f":"地学","u":["15"],"q":"［　　］に入る言葉は?\nオリオン座には［　　］（青白い1等星）もある","a":"リゲル"},{"id":"WS5c-1","s":"ウイニングステップ5年","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n氷（固体）⇄水（液体）⇄水蒸気（気体）","a":"水の三態変化"},{"id":"WS5c-2","s":"ウイニングステップ5年","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n熱が、温度の高い方から低い方へ、順に伝わっていくような伝わり方","a":"伝導"},{"id":"WS5c-3","s":"ウイニングステップ5年","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n液体や気体が移動しながら全体に熱を伝えていくような伝わり方","a":"対流"},{"id":"WS5c-4","s":"ウイニングステップ5年","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n太陽の熱がとちゅうの空気を素通りして地面を直接あたためるように、熱がとちゅうを素通りして当たったものを直接あたためるような熱の伝わり方","a":"放射"},{"id":"WS5c-5","s":"ウイニングステップ5年","f":"化学","u":["2"],"q":"［　　］に入る言葉は?\n青色リトマス紙＝酸性は［　　］、中性・アルカリ性は変わらない","a":"赤く変わる"},{"id":"WS5c-6","s":"ウイニングステップ5年","f":"化学","u":["2"],"q":"［　　］に入る言葉は?\nフェノールフタレイン液＝酸性・中性は変わらない、アルカリ性は［　　］","a":"赤く変わる"},{"id":"WS5c-7","s":"ウイニングステップ5年","f":"化学","u":["3","25"],"q":"次の説明にあてはまる言葉は?\nろうとに液体を、三角フラスコに固体を入れる","a":"気体の発生方法"},{"id":"WS5c-8","s":"ウイニングステップ5年","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n［　　］（気体の性質によって、集め方がちがう）：水にとけにくい気体＝水上置換","a":"気体の集め方"},{"id":"WS5c-9","s":"ウイニングステップ5年","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n気体の集め方（気体の性質によって、集め方がちがう）：水にとけにくい気体＝［　　］","a":"水上置換"},{"id":"WS5c-10","s":"ウイニングステップ5年","f":"化学","u":["3","25"],"q":"空気よりも重い気体は?","a":"下方置換"},{"id":"WS5c-11","s":"ウイニングステップ5年","f":"化学","u":["3","25"],"q":"空気よりも軽い気体は?","a":"上方置換"},{"id":"WS5c-12","s":"ウイニングステップ5年","f":"化学","u":["夏2"],"q":"［　　］に入る言葉は?\nろうそくの炎：［　　］＝酸素が十分にあるので、完全燃焼している","a":"外炎"},{"id":"WS5c-13","s":"ウイニングステップ5年","f":"化学","u":["夏2"],"q":"次の説明にあてはまる言葉は?\n酸素が不十分なため、不完全燃焼している","a":"内炎"},{"id":"WS5c-14","s":"ウイニングステップ5年","f":"化学","u":["3","25"],"q":"次の説明にあてはまる言葉は?\n酸素不足でほとんど燃えていないので、ろうの気体がある","a":"炎心"},{"id":"JW1-1","s":"塾技100","f":"化学","u":["1"],"q":"次の説明にあてはまる言葉は?\n物を水にとかしてできた液","a":"水溶液"},{"id":"JW1-2","s":"塾技100","f":"化学","u":["20"],"q":"次の説明にあてはまる言葉は?\nある物が100gの水にとける最大の量（g）","a":"溶解度"},{"id":"JW1-3","s":"塾技100","f":"化学","u":["20"],"q":"次の説明にあてはまる言葉は?\n固体がとけた水溶液から、もとの固体が再び結晶となって出てくる現象","a":"再結晶"},{"id":"JW1-4","s":"塾技100","f":"化学","u":["1","2"],"q":"次の説明にあてはまる言葉は?\n酸性の水溶液とアルカリ性の水溶液を混ぜると、互いに相手の性質を打ち消し合う反応","a":"中和"},{"id":"JW1-5","s":"塾技100","f":"化学","u":["1"],"q":"［　　］に入る言葉は?\nもとの水溶液にとけていた物とまったく別の物（［　　］）と水ができる","a":"塩"},{"id":"JW1-6","s":"塾技100","f":"化学","u":["2"],"q":"［　　］に入る言葉は?\n金属には、酸性やアルカリ性の水溶液と反応して［　　］を出しながらとけるものがある","a":"水素"},{"id":"JW1-7","s":"塾技100","f":"化学","u":["3","25"],"q":"次の説明にあてはまる言葉は?\n二酸化マンガン（黒い固体）に過酸化水素水（オキシドール）を加える","a":"酸素の作り方"},{"id":"JW1-8","s":"塾技100","f":"化学","u":["3","25"],"q":"次の説明にあてはまる言葉は?\n亜鉛・鉄・アルミニウム・マグネシウムなどの金属に、うすい塩酸やうすい硫酸を反応させる","a":"水素のつくり方"},{"id":"JW1-9","s":"塾技100","f":"化学","u":["3","25"],"q":"次の説明にあてはまる言葉は?\n空気より軽く、水に非常にとけやすい気体で、鼻につんとくる刺激のあるにおい（刺激臭）がある","a":"アンモニア"},{"id":"JW1-10","s":"塾技100","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\n塩化アンモニウムと水酸化カルシウムの粉を混ぜ合わせたものを試験管に入れて熱する","a":"つくり方"},{"id":"JW1-11","s":"塾技100","f":"化学","u":["21"],"q":"次の説明にあてはまる言葉は?\nちっ素約78％・酸素約21％・二酸化炭素約0.04％（色やにおいはない）","a":"空気の成分"},{"id":"JW1-12","s":"塾技100","f":"化学","u":["20"],"q":"次の説明にあてはまる言葉は?\n液体の中にとけずに残っている物を、ろ紙を使ってこし分けること","a":"ろ過"},{"id":"JW1-13","s":"塾技100","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\n物が燃えるとき、光や熱などを出しながら激しく酸素と結びつくこと（激しい酸化）","a":"燃焼"},{"id":"JW1-14","s":"塾技100","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n物が十分な酸素と結びつく完全燃焼と、不十分な酸素と結びつく［　　］がある","a":"不完全燃焼"},{"id":"JW1-15","s":"塾技100","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\nふたをした容器の中でろうそくを燃やしたあとの空気を気体検知管で調べると、約［　　］は酸素が残っている","a":"16％"},{"id":"JW1-16","s":"塾技100","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n大切なのは、気体中における［　　］","a":"酸素のしめる割合"},{"id":"JW1-17","s":"塾技100","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\nろうには炭素と水素がふくまれ、次の順序で酸素と結びついて燃える","a":"ろうそくの燃え方"},{"id":"JW1-18","s":"塾技100","f":"化学","u":["夏2"],"q":"［　　］に入る言葉は?\n炎には内炎と外炎があり、最も温度が高い部分は、ガスと空気が混ざり合って出てくる［　　］の部分","a":"内炎のすぐ上"},{"id":"JW1-19","s":"塾技100","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\n木は炭素や水素をふくんでいるため燃えると二酸化炭素や水（水蒸気）ができる。燃えたあとは、カリウムなどの燃えない物が灰となって残る","a":"木の燃え方"},{"id":"JW1-20","s":"塾技100","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\n木は炭素や水素をふくんでいるため燃えると二酸化炭素や水（水蒸気）ができる","a":"木の燃え方"},{"id":"JW1-21","s":"塾技100","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n［　　］（乾留）＝物を酸素とふれないようにして強く熱すること","a":"蒸し焼き"},{"id":"JW1-22","s":"塾技100","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\nそのため、木炭を燃やすと［　　］（最後は白い灰になる）","a":"軽くなっていく"},{"id":"JW1-23","s":"塾技100","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n不完全燃焼すると、有毒な気体である［　　］が発生する","a":"一酸化炭素"},{"id":"JW1-24","s":"塾技100","f":"化学","u":["夏1"],"q":"次の説明にあてはまる言葉は?\n酸化した物質から酸素をとりのぞき、酸化する前の物質にもどす反応","a":"還元"},{"id":"JW1-25","s":"塾技100","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n温度が上がると体積がふくれ（ぼう張）、下がると縮む（しゅう縮）","a":"固体"},{"id":"JW1-26","s":"塾技100","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n物（物質）は、温度によって、固体・液体・気体の3つの状態（物質の三態）のいずれかとなる","a":"状態変化"},{"id":"JW1-27","s":"塾技100","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n融解と凝固：固体が液体になることを融解（融解するときの温度＝［　　］）","a":"融点"},{"id":"JW1-28","s":"塾技100","f":"化学","u":["3","25"],"q":"次の説明にあてはまる言葉は?\n液体が気体になること","a":"気化"},{"id":"JW1-29","s":"塾技100","f":"化学","u":["3","25"],"q":"次の説明にあてはまる言葉は?\n気体が液体になること","a":"液化"},{"id":"JW1-30","s":"塾技100","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n熱（エネルギー）は、高い方から低い方へと伝わる","a":"熱の伝わり方"},{"id":"JW1-31","s":"塾技100","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n熱の伝わり方には「［　　］」「対流」「放射」がある","a":"伝導"},{"id":"JW1-32","s":"塾技100","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n熱の伝わり方には「伝導」「［　　］」「放射」がある","a":"対流"},{"id":"JW1-33","s":"塾技100","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n物質どうしが直接せっすることで、熱が高い方から低い方へ同心円状に伝わっていくこと","a":"伝導"},{"id":"JW1-34","s":"塾技100","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n水や空気の流れによって熱が移動すること","a":"対流"},{"id":"JW1-35","s":"塾技100","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n太陽やストーブ、たき火などから出る熱は、空気をすどおりしてそれに当たった物に直接伝わる","a":"放射"},{"id":"JW1-36","s":"塾技100","f":"物理","u":["夏3"],"q":"次の説明にあてはまる言葉は?\n光は同じ物質の中ではまっすぐ進む","a":"光の直進"},{"id":"JW1-37","s":"塾技100","f":"物理","u":["夏3"],"q":"次の説明にあてはまる言葉は?\n太陽や電球、電とう、燃えているろうそくなど、自ら光を出す物体","a":"光源"},{"id":"JW1-38","s":"塾技100","f":"物理","u":["夏3"],"q":"次の説明にあてはまる言葉は?\n豆電球のような小さい物（点光源）の場合、スリットを通すと光が広がりながら進む","a":"拡散光線"},{"id":"JW1-39","s":"塾技100","f":"物理","u":["夏4"],"q":"次の説明にあてはまる言葉は?\n光が鏡や水面などに当たってはね返ること","a":"光の反射"},{"id":"JW1-40","s":"塾技100","f":"物理","u":["夏4"],"q":"次の説明にあてはまる言葉は?\n光が反射する点で面に垂直に引いた線を法線という","a":"反射の法則"},{"id":"JW1-41","s":"塾技100","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n入射光と法線のなす角（入射角）と、反射光と法線のなす角（反射角）は［　　］","a":"等しい"},{"id":"JW1-42","s":"塾技100","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n鏡にうつる像は、鏡をはさんで実際の物（実物）と［　　］の位置に見える（反射した光の道すじを逆にのばした位置から真っすぐ進んできたように見えるから）","a":"対称"},{"id":"JW1-43","s":"塾技100","f":"物理","u":["夏5"],"q":"次の説明にあてはまる言葉は?\n光は同じ物質の中では直進するが、ちがう物質を通るとき、その境界面で一部は反射し、残りはすべて折れ曲がって進む","a":"光の屈折"},{"id":"JW1-44","s":"塾技100","f":"物理","u":["夏5"],"q":"プリズムの一方から日光を入れると、7色の光に分かれて出てくるは?","a":"光の分散"},{"id":"JW1-45","s":"塾技100","f":"物理","u":["夏5"],"q":"次の説明にあてはまる言葉は?\n虫めがねなどに使われている、中央がまわりより厚くふくらんだレンズ","a":"凸レンズ"},{"id":"JW1-46","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n音は、音を出す物体の振動が、音を伝える物に次々に波のように伝わり、伝わった振動が耳のこ膜を振動させることによって聞こえる","a":"音の伝わり方"},{"id":"JW1-47","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n空気が音を伝える物であることを確かめる実験","a":"真空すずの実験"},{"id":"JW1-48","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n物が振動すると、そのまわりの空気に濃い部分（山）と、うすい部分（谷）がしまもようのようにできて広がる","a":"音波"},{"id":"JW1-49","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n音の強弱（大小）・音の高低・音色","a":"音の三要素"},{"id":"JW1-50","s":"塾技100","f":"物理","u":["冬3"],"q":"［　　］に入る言葉は?\n［　　］は振幅で決まり、強い音（大きい音）ほど振幅が大きくなる","a":"音の強弱"},{"id":"JW1-51","s":"塾技100","f":"物理","u":["冬3"],"q":"［　　］に入る言葉は?\n［　　］は振動数で決まり、高い音ほど振動数が多くなる","a":"音の高低"},{"id":"JW1-52","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n箱の上に弦をはり、弦の長さ・太さ・はりの強さを変えて音の高さを調べる装置","a":"モノコード"},{"id":"JW1-53","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n音が伝わる速さは、音を伝える物の種類や温度で異なる","a":"音の速さ"},{"id":"JW1-54","s":"塾技100","f":"物理","u":["冬3"],"q":"［　　］に入る言葉は?\n空気中での音の速さ：気温が0℃のとき［　　］、気温が1℃上がるごとに毎秒0.6mずつ速くなる","a":"毎秒331m"},{"id":"JW1-55","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n同じ振動数の音を出すおんさを2つ並べ、一方のおんさを鳴らすともう一方のおんさも鳴り出す現象","a":"共鳴"},{"id":"JW1-56","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n直進する光はさえぎる物があると進めないが、音は回りこむことができる現象","a":"回折"},{"id":"JW1-57","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\n救急車のサイレン音のように、音を出しながら近づいてくるときの物の音は高く聞こえ、遠ざかっていくときの音は低く聞こえる現象","a":"ドップラー効果"},{"id":"JW2-1","s":"塾技100","f":"物理","u":["32"],"q":"［　　］に入る言葉は?\nばねの［　　］はおもりの重さに比例しない（のびが比例）","a":"長さ"},{"id":"JW2-2","s":"塾技100","f":"物理","u":["13","14","30"],"q":"次の説明にあてはまる言葉は?\n支点（てこを支えて動かない点）・力点（力を加える点）・作用点（力が働く点）","a":"てこの3点"},{"id":"JW2-3","s":"塾技100","f":"物理","u":["35","36"],"q":"次の説明にあてはまる言葉は?\n液体の中の物体にはたらく上向きの力","a":"浮力"},{"id":"JW2-4","s":"塾技100","f":"物理","u":["冬1","冬2"],"q":"1往復にかかる時間は?","a":"周期"},{"id":"JW2-5","s":"塾技100","f":"物理","u":["冬1","冬2"],"q":"支点からおもりの重心までの長さは?","a":"ふりこの長さ"},{"id":"JW3-1","s":"塾技100","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\nかん電池の＋極から出た電流が、豆電球などの抵抗を通らず直接導線を通って電池の−極にもどること","a":"ショート"},{"id":"JW3-2","s":"塾技100","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n電池に豆電球をつなぐと豆電球に電気が流れる","a":"電流"},{"id":"JW3-3","s":"塾技100","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n豆電球や電熱線のような電流の流れをさまたげるもの","a":"抵抗"},{"id":"JW3-4","s":"塾技100","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n電流が、電池の＋極から出てふたたび電池の−極にもどるというように、ひとまわりの道筋を流れている","a":"回路"},{"id":"JW3-5","s":"塾技100","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n流れる電流の大きさは、はかる場所によって変わる","a":"並列回路"},{"id":"JW3-6","s":"塾技100","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n枝分かれしないので、回路を流れる電流の大きさはどこも同じ","a":"直列回路"},{"id":"JW3-7","s":"塾技100","f":"物理","u":["夏8"],"q":"次の説明にあてはまる言葉は?\n電気ストーブやドライヤーなど、電流を流すと熱を出すところに使われる金属線。抵抗の大きいニクロム線がよく使われる","a":"電熱線"},{"id":"JW3-8","s":"塾技100","f":"物理","u":["夏8"],"q":"［　　］に入る言葉は?\n電熱線と水温：電熱線を用いて水をあたためる場合、水温の上昇は電熱線の発熱量に比例し、水の量に［　　］する","a":"反比例"},{"id":"JW3-9","s":"塾技100","f":"物理","u":["夏8"],"q":"次の説明にあてはまる言葉は?\n電気ストーブやドライヤーなど、電流を流すと熱を出すところに使われる金属線","a":"電熱線"},{"id":"JW3-10","s":"塾技100","f":"物理","u":["夏8"],"q":"［　　］に入る言葉は?\n抵抗の大きい［　　］がよく使われる","a":"ニクロム線"},{"id":"JW3-11","s":"塾技100","f":"物理","u":["夏7"],"q":"次の説明にあてはまる言葉は?\n抵抗が小さい方により大きな電流が流れるため、発熱量は抵抗に反比例する","a":"並列つなぎ"},{"id":"JW3-12","s":"塾技100","f":"物理","u":["8","夏7"],"q":"次の説明にあてはまる言葉は?\n回路を流れる電流の大きさは、電圧に比例し、抵抗に反比例する","a":"オームの法則"},{"id":"JW3-13","s":"塾技100","f":"物理","u":["10"],"q":"次の説明にあてはまる言葉は?\n磁石と磁石の間や磁石と鉄の間などには力がはたらいている","a":"磁界"},{"id":"JW3-14","s":"塾技100","f":"物理","u":["9"],"q":"次の説明にあてはまる言葉は?\n磁界の向きをつないだときにできる曲線","a":"磁力線"},{"id":"JW3-15","s":"塾技100","f":"物理","u":["9"],"q":"次の説明にあてはまる言葉は?\nまっすぐな導線に電流を右ねじの進む方向に流すと、導線のまわりには右ねじをしめるために回す向きの磁力線ができる","a":"右ねじの法則"},{"id":"JW3-16","s":"塾技100","f":"物理","u":["10"],"q":"次の説明にあてはまる言葉は?\nコイルの中に鉄しんを入れて電流を流すと、コイルだけのときよりはるかに強い磁界ができる。こうしてできた磁石","a":"電磁石"},{"id":"JW3-17","s":"塾技100","f":"物理","u":["10"],"q":"次の説明にあてはまる言葉は?\n円とう形のわくに導線を何回も巻きつけたもの","a":"コイル"},{"id":"JW3-18","s":"塾技100","f":"物理","u":["10"],"q":"次の説明にあてはまる言葉は?\n磁力線が出てくる方のはしがN極、磁力線が入ってくる方のはしがS極","a":"コイルの極"},{"id":"JW3-19","s":"塾技100","f":"物理","u":["10"],"q":"次の説明にあてはまる言葉は?\nコイルの中に鉄しんを入れて電流を流すと、コイルだけのときよりはるかに強い磁界ができる","a":"電磁石"},{"id":"JW3-20","s":"塾技100","f":"物理","u":["10"],"q":"次の説明にあてはまる言葉は?\nコイルに磁石を出し入れすると、コイルの中の磁界が変化し、コイルに電流が流れる","a":"電磁誘導"},{"id":"JW3-21","s":"塾技100","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n光のエネルギーを電気エネルギーに変化させる装置。かん電池とちがい電気をためておくことはできない","a":"光電池"},{"id":"JW3-22","s":"塾技100","f":"物理","u":["8"],"q":"次の説明にあてはまる言葉は?\n電流を流すとフィラメントが発熱することによって光を出す豆電球に対し、LEDは電気を直接光に変える","a":"発光ダイオード（LED）"},{"id":"JW3-23","s":"塾技100","f":"物理","u":["10"],"q":"次の説明にあてはまる言葉は?\n電磁石の性質を利用した装置","a":"モーター"},{"id":"JW4-1","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\nはい乳・はい・種皮。子葉・はいじく・幼根の区別がしにくい","a":"イネ・トウモロコシの種子"},{"id":"JW4-2","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\nはい乳・はい・種皮","a":"イネ・トウモロコシの種子"},{"id":"JW4-3","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\n水・空気（酸素）・適当な温度。発芽後、成長していくためには、発芽の3つの条件に加え、日光・肥料が必要となる","a":"発芽の3条件"},{"id":"JW4-4","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\n水・空気（酸素）・適当な温度","a":"発芽の3条件"},{"id":"JW4-5","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\n動物のからだについて運ばれる（オナモミ）","a":"種子の運ばれ方"},{"id":"JW4-6","s":"塾技100","f":"生物","u":["5"],"q":"次の説明にあてはまる言葉は?\n葉をすかして見たときに見える葉のすじ","a":"葉脈"},{"id":"JW4-7","s":"塾技100","f":"生物","u":["6"],"q":"次の説明にあてはまる言葉は?\n植物が、体内の余分な水分を水蒸気として気孔から蒸発させる現象","a":"蒸散"},{"id":"JW4-8","s":"塾技100","f":"生物","u":["7"],"q":"次の説明にあてはまる言葉は?\n植物が光のエネルギーを利用して、葉の中にある葉緑体で水と二酸化炭素からでんぷんなどの養分をつくるはたらき","a":"光合成"},{"id":"JW4-9","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\n先にやく（花粉がつまっている）がある","a":"おしべ"},{"id":"JW4-10","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\nキク科（タンポポ・ヒマワリ）、ウリ科（ヘチマ・カボチャ）、ナス科（ナス・トマト・ジャガイモ）、ヒルガオ科（アサガオ）、ツツジなど","a":"合弁花"},{"id":"JW4-11","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\nアブラナ・バラ・マメなど","a":"離弁花"},{"id":"JW5-1","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\nおしべの花粉がめしべの柱頭につくこと","a":"受粉"},{"id":"JW5-2","s":"塾技100","f":"生物","u":["33"],"q":"［　　］に入る言葉は?\n受粉した花粉は花粉管をのばし、それが胚珠に達すると［　　］が起こる","a":"受精"},{"id":"JW5-3","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\n風ばい花でもあり自家受粉（花が開くとき、やくがめしべにふれる）もおこなう","a":"イネ"},{"id":"JW5-4","s":"塾技100","f":"化学","u":["2"],"q":"次の説明にあてはまる言葉は?\n日照時間に関係なく開花する植物","a":"中性植物"},{"id":"JW5-5","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\n春に発芽して秋にかれ、種子で冬をこす（ホウセンカ・アサガオ・ヒマワリ）","a":"一年草"},{"id":"JW5-6","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\nヒルガオ科の植物で、花弁がくっついた合弁花","a":"アサガオ"},{"id":"JW5-7","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\nバラ科の植物で、おしべが20〜30本と多いのが特ちょう","a":"サクラ"},{"id":"JW5-8","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\nお花のりん片にある花粉のうの中の花粉が風で飛ばされてめ花に受粉し、め花のりん片として次の年に成熟していく","a":"マツの花の受粉"},{"id":"JW5-9","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\nキク科の植物で、春に開花、秋に発芽、ロゼットとなって冬ごしをする。花は、小さな花（舌状花）がたくさん集まって1つの花のように見える","a":"タンポポ"},{"id":"JW5-10","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\nキク科の植物で、春に開花、秋に発芽、ロゼットとなって冬ごしをする","a":"タンポポ"},{"id":"JW5-11","s":"塾技100","f":"生物","u":["33"],"q":"［　　］に入る言葉は?\nイネは花弁やがくのかわりに［　　］をもつ不完全花","a":"えい"},{"id":"JW5-12","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\nキク科の植物で、春に発芽させ、夏に花をさかせ、秋に多くの種子をつくる","a":"ヒマワリ"},{"id":"JW5-13","s":"塾技100","f":"生物","u":["33"],"q":"次の説明にあてはまる言葉は?\nツリフネソウ科の植物で、夏に花をさかせる離弁花","a":"ホウセンカ"},{"id":"JW5-14","s":"塾技100","f":"生物","u":["4"],"q":"次の説明にあてはまる言葉は?\nホウセンカやカタバミは、種子を遠くに運ぶために、実が熟すとはじけて、中から種子が飛び出す","a":"ホウセンカの成長"},{"id":"JW5-15","s":"塾技100","f":"地学","u":["春2"],"q":"次の説明にあてはまる言葉は?\n葉にはもともと緑色の色素と黄色の色素があり、気温が低くなると緑色の色素が分解され、黄色の方が目立ってくる","a":"黄葉"},{"id":"JW5-16","s":"塾技100","f":"物理","u":["夏3"],"q":"［　　］に入る言葉は?\n明るさと木の育ち方：木には、日光がよく当たる明るい所でないと育たない［　　］と、日かげでも良く育つ陰樹がある","a":"陽樹"},{"id":"JW5-17","s":"塾技100","f":"物理","u":["夏3"],"q":"［　　］に入る言葉は?\n明るさと木の育ち方：木には、日光がよく当たる明るい所でないと育たない陽樹と、日かげでも良く育つ［　　］がある","a":"陰樹"},{"id":"JW5-18","s":"塾技100","f":"地学","u":["春2"],"q":"次の説明にあてはまる言葉は?\n森林は気温の変化が小さく、風速が弱く、気温が高い","a":"森林のまわりの植物"},{"id":"JW5-19","s":"塾技100","f":"生物","u":["5"],"q":"次の説明にあてはまる言葉は?\n根・茎・葉の区別があり維管束をもつ（イヌワラビ・ゼンマイ・スギナ）","a":"シダ植物"},{"id":"JW5-20","s":"塾技100","f":"生物","u":["5"],"q":"次の説明にあてはまる言葉は?\n根・茎・葉の区別がなく維管束をもたない（ゼニゴケ・スギゴケ）","a":"コケ植物"},{"id":"JW5-21","s":"塾技100","f":"生物","u":["5","7"],"q":"次の説明にあてはまる言葉は?\nコケ植物と同じように、根・茎・葉の区別がなく維管束をもたずに光合成をおこなう水中の生物（胞子や分裂で増える","a":"ソウ類"},{"id":"JW5-22","s":"塾技100","f":"生物","u":["33"],"q":"［　　］に入る言葉は?\n子房なし：［　　］（胚珠がむき出し","a":"裸子植物"},{"id":"JW6-1","s":"塾技100","f":"生物","u":["29"],"q":"次の説明にあてはまる言葉は?\n無セキツイ動物のうち、体や足に節をもつ動物","a":"節足動物"},{"id":"JW6-2","s":"塾技100","f":"物理","u":["冬3"],"q":"次の説明にあてはまる言葉は?\nものに触れて大きさ・におい・味・音・しん動などを感じる","a":"触角"},{"id":"JW6-3","s":"塾技100","f":"生物","u":["29"],"q":"次の説明にあてはまる言葉は?\n明るさ・光の来る方向を感じる（1〜3個ある）","a":"単眼"},{"id":"JW6-4","s":"塾技100","f":"生物","u":["29"],"q":"次の説明にあてはまる言葉は?\n口のつくりは、それぞれの食べ物に適した形になっている","a":"こん虫の口・足"},{"id":"JW6-5","s":"塾技100","f":"生物","u":["29"],"q":"次の説明にあてはまる言葉は?\nアブラナ科（ダイコン・キャベツなど）の植物の葉のうらに卵を産む","a":"モンシロチョウ"},{"id":"JW6-6","s":"塾技100","f":"生物","u":["29"],"q":"［　　］に入る言葉は?\n1週間くらいでふ化（卵から幼虫にかえる）し、ふ化したばかりの幼虫を［　　］という","a":"1齢の幼虫"},{"id":"JW6-7","s":"塾技100","f":"生物","u":["29"],"q":"［　　］に入る言葉は?\n［　　］＝オビカレハ・カマキリ・バッタ・コオロギ","a":"卵"},{"id":"JW6-8","s":"塾技100","f":"生物","u":["29"],"q":"次の説明にあてはまる言葉は?\nカブトムシ・セミ（1年目は卵）・ミノガ・トンボ","a":"幼虫"},{"id":"JW6-9","s":"塾技100","f":"生物","u":["29"],"q":"次の説明にあてはまる言葉は?\nセミやコオロギ・スズムシ・キリギリスなどのオスは、メスをさそうなどのために鳴く","a":"こん虫の鳴き声"},{"id":"JW6-10","s":"塾技100","f":"生物","u":["28"],"q":"次の説明にあてはまる言葉は?\n背骨のあるセキツイ動物で、水中生活をする魚類","a":"メダカ"},{"id":"JW6-11","s":"塾技100","f":"生物","u":["28"],"q":"次の説明にあてはまる言葉は?\n広い水そうにくみおきの水と水草を入れ、砂や小石をしき、直射日光の当たらない明るい場所に置く","a":"メダカの飼育操作"},{"id":"JW6-12","s":"塾技100","f":"化学","u":["3","25","7"],"q":"［　　］に入る言葉は?\n卵をからみつかせたり、光合成で水中の酸素を増やしたりするため［　　］を入れる","a":"水草"},{"id":"JW6-13","s":"塾技100","f":"生物","u":["28"],"q":"次の説明にあてはまる言葉は?\n体はうろこでおおわれている","a":"メダカの体"},{"id":"JW6-14","s":"塾技100","f":"生物","u":["28"],"q":"次の説明にあてはまる言葉は?\n日照時間が13時間以上、水温が18℃以上になると早朝に産卵する","a":"メダカの産卵"},{"id":"JW6-15","s":"塾技100","f":"生物","u":["28"],"q":"次の説明にあてはまる言葉は?\nえらぶたを閉じて口から水を吸いこみ、次に口を閉じてえらぶたをあけ、えらぶたから水を出す","a":"メダカの呼吸"},{"id":"JW6-16","s":"塾技100","f":"生物","u":["28"],"q":"次の説明にあてはまる言葉は?\n子ども（幼生）のときはえら呼吸で水中生活をし、大人（成体）になると肺呼吸で陸上生活をするセキツイ動物を両生類という","a":"カエル"},{"id":"JW6-17","s":"塾技100","f":"生物","u":["18","28"],"q":"［　　］に入る言葉は?\n幼生（オタマジャクシ）＝［　　］、成体＝肺と皮ふ呼吸","a":"えら呼吸"},{"id":"JW6-18","s":"塾技100","f":"生物","u":["夏6"],"q":"次の説明にあてはまる言葉は?\n水中をただよう小さな生物","a":"プランクトン"},{"id":"JW6-19","s":"塾技100","f":"生物","u":["夏6"],"q":"次の説明にあてはまる言葉は?\n自然界では様々な生物が「食べる」「食べられる」の関係にあり、生物の数のバランスがとれている","a":"食物連鎖"},{"id":"JW6-20","s":"塾技100","f":"生物","u":["28"],"q":"［　　］に入る言葉は?\nは虫類・鳥類＝陸上にからのある卵（［　　］）","a":"卵生"},{"id":"JW7-1","s":"塾技100","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n消化管および、消化液をつくったりたくわえたりする［　　］を合わせて消化器官という","a":"肝臓・たんのう・すい臓"},{"id":"JW7-2","s":"塾技100","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n消化管および、消化液をつくったりたくわえたりする肝臓・たんのう・すい臓を合わせて［　　］という","a":"消化器官"},{"id":"JW7-3","s":"塾技100","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n胃＝胃液（ペプシン）が［　　］にはたらく","a":"タンパク質"},{"id":"JW7-4","s":"塾技100","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n肝臓＝たん汁が［　　］にはたらく（たん汁は肝臓でつくられ、たんのうにたくわえられる）","a":"脂肪"},{"id":"JW7-5","s":"塾技100","f":"生物","u":["17"],"q":"次の説明にあてはまる言葉は?\n3大栄養素（でんぷん・タンパク質・脂肪）のすべてにはたらく","a":"すい液"},{"id":"JW7-6","s":"塾技100","f":"生物","u":["17"],"q":"［　　］に入る言葉は?\n高温（80℃）から適温へ＝消化酵素は［　　］はたらきはもとにもどらない","a":"こわれていて"},{"id":"JW7-7","s":"塾技100","f":"生物","u":["19"],"q":"［　　］に入る言葉は?\n血管とそのつくり：［　　］＝心臓から送り出される血液が通る血管（かべは厚く丈夫だが、静脈のかべはうすい）","a":"動脈"},{"id":"JW7-8","s":"塾技100","f":"生物","u":["19"],"q":"次の説明にあてはまる言葉は?\n動脈と静脈をつなぐとても細い血管（養分などの受け渡しをする）","a":"毛細血管"},{"id":"JW7-9","s":"塾技100","f":"生物","u":["19"],"q":"［　　］に入る言葉は?\n血液の成分とはたらき：［　　］＝赤い色素ヘモグロビンをもち酸素を運ぶ（中央がくぼんだ円ばん状の形）","a":"赤血球"},{"id":"JW7-10","s":"塾技100","f":"生物","u":["19"],"q":"次の説明にあてはまる言葉は?\n細菌をつつんで食べてしまう（アメーバ状で形は不定）","a":"白血球"},{"id":"JW7-11","s":"塾技100","f":"生物","u":["19"],"q":"次の説明にあてはまる言葉は?\n出血したとき血を固まらせる（形は不定）","a":"血小板"},{"id":"JW7-12","s":"塾技100","f":"生物","u":["19","夏1"],"q":"次の説明にあてはまる言葉は?\n養分・不要物・二酸化炭素を運ぶ","a":"血しょう"},{"id":"JW7-13","s":"塾技100","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n肺胞と毛細血管中の血液との間で酸素と二酸化炭素の交換（［　　］）がおこなわれる","a":"ガス交換"},{"id":"JW7-14","s":"塾技100","f":"生物","u":["19"],"q":"次の説明にあてはまる言葉は?\n心臓から出た血液が、体の各器官をまわった後、ふたたび心臓にもどる道すじには、肺循環と体循環の2つがある","a":"血液の循環"},{"id":"JW7-15","s":"塾技100","f":"生物","u":["19"],"q":"次の説明にあてはまる言葉は?\n心臓から出た血液が肺を通って心臓へもどる循環","a":"肺循環"},{"id":"JW7-16","s":"塾技100","f":"生物","u":["19"],"q":"次の説明にあてはまる言葉は?\n心臓から出た血液が全身をめぐって心臓へもどる循環","a":"体循環"},{"id":"JW7-17","s":"塾技100","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n細胞の呼吸と不要物：体じゅうの細胞が生きるためのエネルギーを得るために、養分と酸素を分解してエネルギーをつくるはたらきを［　　］という","a":"内呼吸"},{"id":"JW7-18","s":"塾技100","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\nアミノ酸が呼吸で分解＝二酸化炭素・水・［　　］ができる","a":"有害なアンモニア"},{"id":"JW7-19","s":"塾技100","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n骨と筋肉：人の体は約200個の骨が組み合わさって骨格をつくっている。骨には［　　］という筋肉がついていて、縮んだりゆるんだりして骨を動かす","a":"骨格筋"},{"id":"JW7-20","s":"塾技100","f":"生物","u":["18"],"q":"［　　］に入る言葉は?\n骨には［　　］という筋肉がついていて、縮んだりゆるんだりして骨を動かす","a":"骨格筋"},{"id":"JW8-1","s":"塾技100","f":"地学","u":["春2","34"],"q":"［　　］に入る言葉は?\n晴れた日の気温と湿度の関係：気温が上がると湿度が下がり、気温が下がると湿度が上がる（［　　］）","a":"反対の変化"},{"id":"JW8-2","s":"塾技100","f":"化学","u":["春1"],"q":"次の説明にあてはまる言葉は?\n空気にふくむことのできる水蒸気の量には限度がある","a":"飽和水蒸気量"},{"id":"JW8-3","s":"塾技100","f":"化学","u":["春1"],"q":"［　　］に入る言葉は?\n空気1m³がふくむことのできる最大の水蒸気の量を［　　］という","a":"飽和水蒸気量"},{"id":"JW8-4","s":"塾技100","f":"化学","u":["3","25","春1"],"q":"［　　］に入る言葉は?\n⇨ 空気にふくみきれなくなった水蒸気（気体）が、［　　］となって出てくる","a":"水滴（液体）"},{"id":"JW8-5","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n（このときの温度を［　　］という","a":"露点"},{"id":"JW8-6","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n雲：上空にできる小さな［　　］を雲という。それらの粒が落ちてこないのは、上昇気流（上昇する空気の流れ）でささえられているため","a":"水滴や氷の粒の集まり"},{"id":"JW8-7","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n雲：上空にできる小さな水滴や氷の粒の集まりを雲という。それらの粒が落ちてこないのは、［　　］（上昇する空気の流れ）でささえられているため","a":"上昇気流"},{"id":"JW8-8","s":"塾技100","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n⑦層積雲（くもり雲）／⑧積雲（わた雲）／⑨積乱雲（入道雲）⇨ せまい範囲に激しい雨／⑩層雲（きり雲）","a":"下層の雲"},{"id":"JW8-9","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n雲：上空にできる小さな［　　］を雲という","a":"水滴や氷の粒の集まり"},{"id":"JW8-10","s":"塾技100","f":"物理","u":["13","14","30"],"q":"［　　］に入る言葉は?\nそれらの粒が落ちてこないのは、［　　］（上昇する空気の流れ）でささえられているため","a":"上昇気流"},{"id":"JW8-11","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n手順⑤ 温度が［　　］に達し、水蒸気が水滴にかわって雲ができ始める","a":"露点"},{"id":"JW8-12","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n手順⑥ 空気がさらに上昇し、［　　］ができ、雲が成長していく","a":"氷の結晶"},{"id":"JW8-13","s":"塾技100","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n⑦層積雲（くもり雲）","a":"下層の雲"},{"id":"JW8-14","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n風：風の正体は［　　］である。空気は、気圧の高い方から低い方へ向かって動くので、風は、気圧の高い方から低い方へ向かってふく","a":"空気の流れ"},{"id":"JW8-15","s":"塾技100","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n風は気圧の高い所から低い所へ向かってふくので、2地点の気圧の差があるとき発生する","a":"風の発生"},{"id":"JW8-16","s":"塾技100","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n夏は大陸が太平洋よりもあたたかくなるため、太平洋から大陸へ向かってしめった南東の風がふく","a":"季節風"},{"id":"JW8-17","s":"塾技100","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n冷たい空気とあたたかい空気のかたまりがふれ合っても、すぐには混じり合わずに境目ができる","a":"前線"},{"id":"JW8-18","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n日本付近の前線は、上空の［　　］（強い西よりの風）によって西から東へ移動する","a":"偏西風"},{"id":"JW8-19","s":"塾技100","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n通過後、気温が下がり、北よりの風がふく","a":"寒冷前線"},{"id":"JW8-20","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n空全体の面積を10としたとき、雲がしめる面積の割合を［　　］という","a":"雲量"},{"id":"JW8-21","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n日本の天気：日本の天気の特ちょうは、それぞれの季節に日本のまわりの大陸や海洋に現れる［　　］で決まる","a":"3つの高気圧（気団）"},{"id":"JW8-22","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n（［　　］：快晴・晴れ・くもり・雨・雪・みぞれ・あられ・ひょう・かみなり","a":"天気記号"},{"id":"JW8-23","s":"塾技100","f":"地学","u":["34"],"q":"次の説明にあてはまる言葉は?\n温暖前線・寒冷前線・停滞前線（梅雨前線などのように、冷たい空気とあたたかい空気がぶつかり合ってほとんど動かないときにできる前線）","a":"前線記号"},{"id":"JW8-24","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n台風の被害＝［　　］が起こることがある","a":"高潮"},{"id":"JW8-25","s":"塾技100","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n夕焼けの次の日は晴れ＝理由：夕焼けは西の空が晴れていると見え、天気は［　　］の影響で西から東に変わるため","a":"偏西風"},{"id":"JW8-26","s":"塾技100","f":"化学","u":["春1","春2"],"q":"次の説明にあてはまる言葉は ,"s":"グノレブ・基礎力","f":"化学","u":["2"],"q":"［　　］に入る言葉は?\nBTB液：酸性黄・中性［　　］・アルカリ性青","a":"緑"},{"id":"GR-21","s":"グノレブ・基礎力","f":"化学","u":["2"],"q":"［　　］に入る言葉は?\nフェノールフタレイン液：酸性・中性［　　］、アルカリ性赤","a":"無色"},{"id":"GR-22","s":"グノレブ・基礎力","f":"化学","u":["2"],"q":"［　　］に入る言葉は?\nフェノールフタレイン液：酸性・中性無色、アルカリ性［　　］","a":"赤"},{"id":"GR-23","s":"グノレブ・基礎力","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n分銅は［　　］で（さびて重さが変わるのを防ぐ）、重い分銅から順にのせ、重すぎたら次に軽いものへ（同じ重さの2個目は試さない）","a":"ピンセット"},{"id":"GR-24","s":"グノレブ・基礎力","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n発生装置：ろうと管は液体の中まで［　　］、誘導管は短く","a":"長く"},{"id":"GR-25","s":"グノレブ・基礎力","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n発生装置：ろうと管は液体の中まで長く、誘導管は［　　］","a":"短く"},{"id":"GR-26","s":"グノレブ・基礎力","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n確かめ方：酸素＝火のついたろうそくが［　　］。二酸化炭素＝石灰水が白くにごる。水素＝マッチの火でポンと鳴って燃える","a":"激しく燃える"},{"id":"GR-27","s":"グノレブ・基礎力","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n二酸化マンガンは［　　］（自身は変化せず、重さも変わらず何度でも使える）で、酸素の量は過酸化水素水の量だけで決まる","a":"触媒"},{"id":"GR-28","s":"グノレブ・基礎力","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n共通成分は［　　］、副生物は塩化カルシウムと水","a":"炭酸カルシウム"},{"id":"GR-29","s":"グノレブ・基礎力","f":"化学","u":["1"],"q":"［　　］に入る言葉は?\n塩酸＋アルミニウムの残りは［　　］（白・水に溶けやすい・塩酸と反応しない）","a":"塩化アルミニウム"},{"id":"GR-32","s":"グノレブ・基礎力","f":"化学","u":["3","25"],"q":"集め方：水に溶けにくい気体は?","a":"水上置換"},{"id":"GR-33","s":"グノレブ・基礎力","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n二酸化炭素は水上置換か［　　］（上方置換は不可）","a":"下方置換"},{"id":"GR-34","s":"グノレブ・基礎力","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n性質：酸素＝色においなし、水に溶けにくい、空気の約1.1倍、［　　］、空気中約21％","a":"助燃性"},{"id":"GR-35","s":"グノレブ・基礎力","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n性質：酸素＝色においなし、水に溶けにくい、空気の約1.1倍、助燃性、空気中約［　　］","a":"21％"},{"id":"GR-36","s":"グノレブ・基礎力","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n水素＝色においなし、水に溶けにくい、約0.07倍（最も軽い）、［　　］（ポンと音を出し青白い炎）、燃料電池","a":"可燃性"},{"id":"GR-37","s":"グノレブ・基礎力","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n水素＝色においなし、水に溶けにくい、約0.07倍（最も軽い）、可燃性（ポンと音を出し青白い炎）、［　　］","a":"燃料電池"},{"id":"GR-38","s":"グノレブ・基礎力","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n確かめ方：酸素＝火のついたろうそくが［　　］","a":"激しく燃える"},{"id":"GR-39","s":"グノレブ・基礎力","f":"物理","u":["10"],"q":"［　　］に入る言葉は?\nN極は北、S極は［　　］を指す（地球の北極側はS極）。鉄・ニッケル・コバルトを引きつける（アルミ・銅・金・10円玉・1円玉はつかない）","a":"南"},{"id":"GR-40","s":"グノレブ・基礎力","f":"物理","u":["10"],"q":"［　　］に入る言葉は?\nN極は北、S極は［　　］を指す（地球の北極側はS極）","a":"南"},{"id":"GR-41","s":"グノレブ・基礎力","f":"物理","u":["10"],"q":"［　　］に入る言葉は?\n磁石についた鉄は磁石になる：くっついた極と［　　］がくっついた側に、同じ極が先端にできる","a":"反対の極"},{"id":"GR-42","s":"グノレブ・基礎力","f":"物理","u":["10"],"q":"［　　］に入る言葉は?\n磁石についた鉄は磁石になる：くっついた極と反対の極がくっついた側に、［　　］が先端にできる","a":"同じ極"},{"id":"GR-47","s":"グノレブ・基礎力","f":"化学","u":["1"],"q":"見分けの手順：におい○・赤リトマス変化なし・電気○は?","a":"塩酸（塩化水素の水溶液）"},{"id":"GR-48","s":"グノレブ・基礎力","f":"生物","u":["4"],"q":"［　　］に入る言葉は?\n発芽で葉が1枚＝単子葉：イネ・ムギ・トウモロコシ・ススキ・［　　］","a":"ツユクサ"},{"id":"GR-50","s":"グノレブ・基礎力","f":"地学","u":["春2"],"q":"次の説明にあてはまる言葉は?\nK（半球のふちに接した点）までの長さ","a":"日の出"},{"id":"GR-51","s":"グノレブ・基礎力","f":"地学","u":["春2","春3"],"q":"厚紙（水平面）と棒のなす角Qは?","a":"その地点の緯度"},{"id":"GR-52","s":"グノレブ・基礎力","f":"物理","u":["8"],"q":"［　　］に入る言葉は?\nスイッチで［　　］ができると、そこに並列な豆電球には電流が流れない（ショート）","a":"導線だけの道"},{"id":"GR-54","s":"グノレブ・基礎力","f":"物理","u":["9"],"q":"［　　］に入る言葉は?\n方位磁針を［　　］に置いたとき：導線の電流が北向きならN極は東、南向きなら西にふれる（導線を磁針の上に置いたときは逆）","a":"導線の上"},{"id":"GR-55","s":"グノレブ・基礎力","f":"物理","u":["9"],"q":"［　　］に入る言葉は?\n方位磁針を導線の上に置いたとき：導線の電流が北向きならN極は東、［　　］にふれる（導線を磁針の上に置いたときは逆）","a":"南向きなら西"},{"id":"GR-58","s":"グノレブ・基礎力","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n像を大きく：物体を針穴に［　　］／スクリーンを針穴から遠ざける（内づつを引く）","a":"近づける"},{"id":"GR-59","s":"グノレブ・基礎力","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n像を大きく：物体を針穴に近づける／スクリーンを針穴から［　　］（内づつを引く）","a":"遠ざける"},{"id":"GR-60","s":"グノレブ・基礎力","f":"物理","u":["夏4"],"q":"［　　］に入る言葉は?\n像を大きく：物体を針穴に［　　］","a":"近づける"},{"id":"GR-61","s":"グノレブ・基礎力","f":"生物","u":["28"],"q":"［　　］に入る言葉は?\nメダカのメス：しりびれが三角形に近い・せびれに切れこみがない、卵はしりびれとはらびれの間（総排泄孔）につける。産卵は［　　］","a":"早朝"},{"id":"GR-62","s":"グノレブ・基礎力","f":"化学","u":["夏2"],"q":"［　　］に入る言葉は?\nガラス棒を入れると［　　］の部分に黒いすすがつく。しめったわりばしは外炎の部分が最初にこげる","a":"内炎"},{"id":"GR-63","s":"グノレブ・基礎力","f":"化学","u":["夏2"],"q":"［　　］に入る言葉は?\nガラス棒を入れると内炎の部分に黒いすすがつく。 "q":"［　　］に入る言葉は?\n雲のでき方：（低気圧）の中心に向かって風がふき、中心付近で空気がぶつかって（［　　］）ができる","a":"上昇気流"},{"id":"GR-229","s":"グノレブ・基礎力","f":"地学","u":["34"],"q":"［　　］に入る言葉は?\n水蒸気が上空で（［　　］）水滴＝雲","a":"冷やされて"},{"id":"GR-230","s":"グノレブ・基礎力","f":"生物","u":["7"],"q":"［　　］に入る言葉は?\nアルコールは火がつきやすいので直火ではなく［　　］であたためる","a":"ゆせん"},{"id":"GR-231","s":"グノレブ・基礎力","f":"化学","u":["夏1"],"q":"石灰水が白くにごるは?","a":"二酸化炭素"},{"id":"GR-232","s":"グノレブ・基礎力","f":"生物","u":["7"],"q":"はたらきは?","a":"呼吸"},{"id":"GR-233","s":"グノレブ・基礎力","f":"生物","u":["5"],"q":"細胞分れつがさかんでくきを太くするは?","a":"エ（形成層）"},{"id":"GR-234","s":"グノレブ・基礎力","f":"生物","u":["5"],"q":"養分の通り道は?","a":"イ・ウ（師管）"},{"id":"GR-235","s":"グノレブ・基礎力","f":"生物","u":["5"],"q":"水の通り道は?","a":"ア・オ（道管）"},{"id":"GR-239","s":"グノレブ・基礎力","f":"化学","u":["夏1"],"q":"［　　］に入る言葉は?\n二酸化炭素の固体＝［　　］（−80℃近く）。液体は空気が強い力で圧縮されていないと存在できない","a":"ドライアイス"},{"id":"GR-240","s":"グノレブ・基礎力","f":"化学","u":["21"],"q":"次の説明にあてはまる言葉は?\n窒素78％・酸素21％・アルゴン0.93％・二酸化炭素0.04％（50年前は約0.033％で増加中","a":"空気の成分"},{"id":"GR-241","s":"グノレブ・基礎力","f":"化学","u":["3","25","夏1"],"q":"［　　］に入る言葉は?\n息：吸う息の二酸化炭素＝［　　］（ア）、はく息の酸素＝約16％（エ）","a":"0.04％"},{"id":"GR-242","s":"グノレブ・基礎力","f":"化学","u":["3","25","夏1"],"q":"生物が酸素をとり入れ二酸化炭素を出すはたらきは?","a":"呼吸"},{"id":"GR-243","s":"グノレブ・基礎力","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n酸素が不足しないのは植物が［　　］をしているから","a":"光合成"},{"id":"GR-244","s":"グノレブ・基礎力","f":"化学","u":["夏1"],"q":"二酸化炭素の固体は?","a":"ドライアイス"},{"id":"GR-245","s":"グノレブ・基礎力","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n二酸化マンガンは［　　］で、酸素がいくら発生しても減らない","a":"触媒"},{"id":"GR-246","s":"グノレブ・基礎力","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n利点＝［　　］な気体が集められる・集めた気体の量（体積）がわかる","a":"純粋"},{"id":"GR-247","s":"グノレブ・基礎力","f":"化学","u":["3","25"],"q":"［　　］に入る言葉は?\n利点＝純粋な気体が集められる・集めた気体の［　　］がわかる","a":"量（体積）"},{"id":"GR-248","s":"グノレブ・基礎力","f":"化学","u":["3","25","夏1"],"q":"［　　］に入る言葉は?\n二酸化炭素＝空気より重いので［　　］（イ）","a":"下方置換法"},{"id":"GR-249","s":"グノレブ・基礎力","f":"生物","u":["6"],"q":"この葉から水を出すはたらきは?","a":"蒸散"},{"id":"GR-250","s":"グノレブ・基礎力","f":"生物","u":["5"],"q":"［　　］に入る言葉は?\n切り口：赤く染まるのは道管だけ（維管束の［
